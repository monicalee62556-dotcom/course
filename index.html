及试验验证。", "source": "机械工程师面试提纲 · 张文龙", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q096", "q": "动力轴最大传递扭矩7000 N·m，让你设计主轴，你怎么确定轴径？需要哪些条件？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：关注受力模型、危险截面、许用应力、疲劳、应力集中、安全系数、轴承跨距和连接形式。", "source": "机械工程师面试提纲 · 张文龙", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "先不要只按经验，请讲机械设计计算逻辑。；如果同时存在径向力、轴向冲击、台阶、键槽或螺纹，怎么处理？材料和安全系数怎么选？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q097", "q": "做一个回转机构，已知负载和转动惯量，要求10秒内转90°并有定位精度要求。你如何从零开始选择伺服电机和减速机？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：候选人简历强调伺服、导轨、行星减速器、滚珠丝杆、齿轮齿条和同步带，这应属于其强项。重点听计算和选型依据。", "source": "机械工程师面试提纲 · 张文龙", "type": "面试官追问题", "category": "公差装配与机械基础", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "什么时候用齿轮？什么时候用同步带？什么时候用齿轮齿条？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q098", "q": "现场一根轴反复断，轴径已经加粗过一次，但仍然断。你接手后怎么处理？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：合理路径通常应覆盖断口、受力路径、实际工况、危险截面、材料/热处理、应力集中、装配同轴度、冲击载荷、计算/仿真和改进验证。", "source": "机械工程师面试提纲 · 张文龙", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "你到现场第一步看什么？需要哪些数据或证据？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q099", "q": "我们这里机械负责人很多时候需要自己做方案、建模、关键图纸，并下现场解决问题。你现在做技术总监以后，这些工作还亲自做吗？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点判断是否仍保持一线设计能力，而不是主要依赖下属完成。", "source": "机械工程师面试提纲 · 张文龙", "type": "面试官追问题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "如果今天给你一个全新的设备需求，你现在还能不能自己从空白SolidWorks开始搭整机？最近一次亲自完整设计设备是什么时候？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q100", "q": "你之前做海上风电桩基特种钻机时，具体负责哪些部分？钻机的主要参数是什么？你亲自设计的核心结构有哪些？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：是否能快速给出具体参数、结构细节、故障现象和解决过程；如果长期停留在“负责/协调/推进”，继续深挖。", "source": "机械工程师面试提纲 · 王少虎", "type": "面试官追问题", "category": "液压与重载装备", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "动力头如何实现？钻进扭矩、钻压、转速大概多少？钻杆/钻具如何连接？；项目中最大的机械故障或现场问题是什么？你怎么定位原因，最后怎么解决？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q101", "q": "假设让你设计一台微型桩钻机：先打φ130中心孔，再扩到φ400，孔深10 m以上，岩石最高约150 MPa。你接到任务后，会怎样一步一步完成整机设计？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：能否从单一机械结构上升到整机系统；是否主动询问工况和关键参数。", "source": "机械工程师面试提纲 · 王少虎", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "如果扩孔过程中出现偏载、振动、防松失效、卡钻，你分别从哪些方向排查？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q102", "q": "动力头最大输出扭矩7000 N·m，让你设计主轴，你怎么确定轴径？需要哪些已知条件？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：应主动考虑扭矩、弯矩、轴向力、材料、许用应力、疲劳、应力集中、安全系数、轴承跨距和连接形式，而不是仅凭经验直接报轴径。", "source": "机械工程师面试提纲 · 王少虎", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "材料怎么选？如果同时存在弯矩、轴向力和冲击载荷，计算逻辑怎么变化？；轴上有台阶、键槽、花键或螺纹时，你会重点考虑什么？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q103", "q": "现场一个连接件/铰接件突然断裂，你如何判断是强度不足、疲劳、材料、热处理、加工、装配还是使用工况导致？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：断口→受力路径→实际工况→材料/热处理→尺寸与应力集中→装配→载荷→计算/仿真→复现→改进验证。", "source": "机械工程师面试提纲 · 王少虎", "type": "面试官追问题", "category": "材料与热处理", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "到现场后第一批要收集哪些证据？如果断口已经被污染或二次破坏怎么办？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q104", "q": "讲一个你亲自完成的有限元案例：载荷从哪里来？边界条件怎么定？网格怎么处理？结果如何验证？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：区分“会操作软件”和“会做工程分析”；关注边界条件合理性、网格收敛、奇异点、实际试验验证。", "source": "机械工程师面试提纲 · 王少虎", "type": "面试官追问题", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "如果最大应力恰好出现在固定约束位置，你怎么判断这个结果能不能直接用于设计？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q105", "q": "现在需要一个液压回转系统，输出7000 N·m、转速30 rpm，你如何从需求反推液压马达、减速机构和泵？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：扭矩↔压力/排量；转速↔流量/排量；是否考虑机械效率、容积效率、减速比、溢流保护、吸油条件和空气进入系统。", "source": "机械工程师面试提纲 · 王少虎", "type": "面试官追问题", "category": "液压与重载装备", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "如果系统压力受限，你会如何调整马达排量或减速比？流量怎么确定？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q106", "q": "设计一根传动轴，轴承到底怎么选？", "short": "先画完整受力简图，求两支座径向反力和每个支点的轴向力；结合转速、倾覆力矩、刚度及空间选择类型，随后校核额定寿命、静载、极限转速、游隙/预紧、配合、润滑和装配。", "deep": "常见选择：高速中轻载用深沟/角接触球；大径向载荷用圆柱滚子；径轴复合载荷用角接触球/圆锥滚子；角度误差大可考虑调心；紧凑关节复合力矩可考虑交叉滚子。不要先拿一个型号反向拼需求。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "只按轴径选轴承，完全忽略轴向力、弯矩和安装误差。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q107", "q": "轴承当量动载荷 P 是怎么来的？", "short": "典型径向轴承按厂家表在适用条件下用 P=XFr+YFa；X、Y、界限 e 随轴承类型、接触角、载荷比等变化，不是通用固定常数。", "deep": "先把载荷分解到轴承支点，处理外加轴向力及成对轴承内部轴向力；再查该型号厂家计算系数；多工况可按寿命损伤等效处理。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "不看 e、直接取 X=1、Y=0 或使用任何型号共用同一组 X/Y。", "followups": "", "formula": "P = X·Fr + Y·Fa", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q108", "q": "轴承基本额定寿命 L10h 怎么算？", "short": "L10h = [10^6/(60n)](C/P)^p；球轴承 p=3，滚子轴承 p=10/3。C和P同单位，n为rpm。", "deep": "例如 C=35kN，P=7kN，n=1000rpm，球轴承 L10h≈2083h。L10代表常规条件下90%可靠度的基本疲劳寿命，不等于保证实际寿命。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "忽略工况变化、冲击、污染、润滑和预紧，再把L10h说成一定能用多久。", "followups": "", "formula": "L10h=10^6/(60n)·(C/P)^p", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q109", "q": "轴承额定动载荷 C 和静载荷 C0 的区别？", "short": "C用于旋转状态的接触疲劳寿命核算；C0用于静止/低速或冲击条件下的塑性变形风险核算，二者都应查产品数据。", "deep": "静载当量载荷 P0 与静安全系数 s0=C0/P0 一起看；存在冲击载荷、短暂停转、摆动往复时，仅校核C和L10可能不够。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "误以为C0比C大就可以替代疲劳寿命计算。", "followups": "", "formula": "s0=C0/P0", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q110", "q": "为什么球轴承和滚子轴承寿命指数不同？", "short": "球与滚道通常为点接触，滚子近似线接触，标准寿命模型的经验指数分别采用3与10/3。", "deep": "载荷减半，按基本寿命模型球轴承寿命增加8倍，滚子轴承约10倍；这不是对实际使用寿命的保证。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "把10/3误写为3/10。", "followups": "", "formula": "p_ball=3；p_roller=10/3", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q111", "q": "固定端与浮动端怎样布置？", "short": "固定端实现轴向定位，承受设计方向的轴向力；浮动端允许轴向位移，消化热伸长和装配误差。", "deep": "固定端可用成对角接触或其他可双向定位组合；浮动端常借助NU/N型圆柱滚子内部滑移，或在条件允许时让某个套圈相对座孔轴向滑动。具体取决于载荷方向和配合。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "两端都刚性轴向锁死，热伸长导致轴承附加预紧和温升。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q112", "q": "一端固定一端浮动时，外圈一定要间隙配合吗？", "short": "不一定。真正目标是允许预期的轴向位移，能否靠外圈在座孔滑动要取决于该圈所受载荷相对转动、蠕动风险和配合要求。", "deep": "圆柱滚子NU/N可以在轴承内部允许相对轴向位移，既能保障环圈必要过盈，又能实现浮动。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "把“浮动端”简单等同于“外圈一定松配”。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q113", "q": "DB、DF、DT 三种角接触轴承组合怎么选？", "short": "DB背对背（O形）有效支点跨距大，抗倾覆力矩能力通常好；DF面对面（X形）对部分安装倾斜的容忍度相对更高；DT串联仅共同承担同方向轴向载荷，双向定位需另配轴承。", "deep": "应结合轴向载荷方向、倾覆力矩、热膨胀及预紧配置；配对轴承通常按制造商匹配要求安装。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "把DT当成能双向承受轴向力的方案。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q114", "q": "轴承预紧的目的是什么？", "short": "通过消除工作间隙改善轴系定位精度、刚度和运行稳定性；用于需要准确轴向位置的角接触轴承、主轴和关节支承。", "deep": "可采用定位预紧或弹簧恒压预紧；选预紧量须同时考察扭矩、温升、刚度和寿命，供应商预紧等级应优先考虑。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "预紧越大越好，或直接靠拧紧锁紧螺母的手感。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q115", "q": "轴承预紧过大和过小分别出现什么问题？", "short": "过小可能窜动、刚度不足、振动及定位精度差；过大导致摩擦扭矩上升、温升高、润滑膜风险和寿命下降。", "deep": "量测启动力矩、轴向位移、空载/负载温升，结合厂家预紧力建议与装配基准判断。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "把预紧异常误诊为电机功率不足或齿轮损坏。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q116", "q": "C2、CN、C3、C4、C5 游隙怎样选？", "short": "径向游隙一般由小到大为C2、CN、C3、C4、C5；预判配合过盈和内外圈温差造成的游隙减少，再查具体轴承系列和内径范围的厂家表。", "deep": "C3不是高精度等级，而是比普通组更大初始游隙；最终需要检查工作游隙并以噪声、温升、寿命与振动试验确认。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "见到高速或高温就无条件用C3，没有温差和配合核算。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q117", "q": "原始游隙、安装后游隙、工作游隙是什么？", "short": "原始游隙是未装配时的内部游隙；安装后游隙已受到内外圈过盈变形影响；工作游隙还随温差、载荷、转速等变化。", "deep": "简化思路：工作游隙≈原始游隙−过盈造成减少量−内外圈差温造成减少量；特殊结构还要考虑材料和配合热约束。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "将厂家表的原始游隙直接当成运行时的最终游隙。", "followups": "", "formula": "Gwork≈G0−ΔGfit−ΔGtemp", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q118", "q": "轴承温差如何减少游隙？", "short": "当钢制轴承内圈相对外圈更热，内圈滚道通常向外膨胀使径向游隙减少。SKF给出简化估计 Δrtemp(μm)≈0.012ΔT·dm(mm)，dm=(d+D)/2。", "deep": "例如6205，d=25、D=52，内外圈温差10°C，则dm=38.5mm，估计径向游隙减少约4.62μm。这个公式适用于其规定的钢轴/钢或铸铁座等假设；复杂工况查厂家更详细模型。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "温升绝对值等于游隙损失；以及混淆温差与绝对工作温度。", "followups": "", "formula": "Δrtemp(μm)≈0.012×ΔT(°C)×(d+D)/2(mm)", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q119", "q": "轴承内圈60°C，外圈50°C，是怎么估算温度的？", "short": "不能直接仅凭型号得出。初算需估摩擦发热功率并建立热阻网络：轴承—轴—壳体—环境/冷却；最好做空载/负载稳态温升测试。", "deep": "摩擦热功率P=Mf·2πn/60，单位W（Mf为N·m）；若简化单热阻T−Ta≈P·Rth，只得到一个等效温度，内外圈温差仍需细分热路径。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "只算整机平均温度，不区分轴承内外圈的热流路径。", "followups": "", "formula": "P=Mf·2πn/60；ΔT≈P·Rth", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q120", "q": "轴承配合公差 h6、j5、k5 应该怎样确定？", "short": "先确认哪个套圈承受旋转载荷、载荷大小及振动，再按厂家配合表选轴和座孔公差，考虑材料壁厚、热膨胀和可拆卸性。", "deep": "同一个k5对不同轴径和不同轴承类型产生的实际过盈不一样；要根据极限尺寸算最大/最小过盈并复核游隙变化。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "死记某一种公差等级对所有轴承都适用。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q121", "q": "轴承内圈为什么可能在轴上爬行？", "short": "若承受相对转动载荷但配合不足，内圈和轴表面可能发生微动磨损/爬行，表现为发黑、擦伤、配合松旷。", "deep": "查载荷相对套圈方向、实际过盈、轴表面硬度和尺寸、热态配合，再优化公差与定位结构。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "只靠涂胶补救，不分析旋转载荷与配合条件。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q122", "q": "轴承游隙与轴承精度P5/P4有什么区别？", "short": "游隙描述滚道与滚动体可相对移动的距离；精度等级描述尺寸、形状和旋转精度等制造公差，两者维度不同。", "deep": "高精度轴承也可能提供不同游隙或配对预紧选项，不能把C3当成P3等级。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q123", "q": "深沟球、角接触、圆柱滚子、圆锥滚子怎么比较？", "short": "深沟球适合常见径向并可承受一定双向轴向力；角接触适合组合载荷与高速高精度；圆柱滚子径向承载刚性好；圆锥滚子可承受径向与单向轴向分力，常成对使用。", "deep": "还要考虑安装空间、摩擦、速度、拆装和轴向定位。真正承载能力按具体型号与厂家表，不按笼统种类猜。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q124", "q": "交叉滚子轴承适合什么机器人关节？", "short": "在有限轴向空间承受径向、双向轴向和倾覆力矩的结构，常见于旋转台或紧凑关节输出支承。", "deep": "并非所有交叉滚子轴承都相同：核对载荷分配、预紧、安装刚度、安装面精度、密封与润滑。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "认为有交叉滚子轴承就不必再验算轴承座变形。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q125", "q": "实际轴承寿命比L10h短，怎么排查？", "short": "先核对实际载荷谱和冲击，再查润滑、污染、对中、过盈、预紧、热态游隙、电蚀、装配损伤与腐蚀。", "deep": "查看滚道剥落、磨粒划痕、发蓝烧蚀、保持架破坏等失效特征；区分疲劳失效与非疲劳的早期故障。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "不看失效照片和测量数据就直接换大一号轴承。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q126", "q": "大跨距双轴承支承如何求支反力？", "short": "对轴和外力建立平面静力模型，按ΣF=0、ΣM=0求两支点反力；倾覆弯矩和悬臂载荷可能使近端轴承承载远大于外力本身。", "deep": "把外力投影到互相垂直的两个平面分别计算，再矢量合成每支点径向力；考虑轴向力的分配及轴承实际作用中心。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "将总载荷简单各分一半。", "followups": "", "formula": "ΣFy=0；ΣM=0", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q127", "q": "轴承支点间距增大一定好吗？", "short": "支点间距增加通常降低同一倾覆力矩产生的支反力差、改善整体抗倾覆能力，但也可能让轴更长、更重、挠度或热伸长问题增加。", "deep": "按总体刚度、支点实际有效中心、装配公差和外部载荷位置综合优化，不单看单一力矩指标。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q128", "q": "轴承密封与润滑脂如何选？", "short": "根据转速、温度、介质、污染、水侵入、补脂周期和摩擦损耗，选择密封形式、脂基础油粘度、稠化剂和填充量。", "deep": "机器人关节关注低摩擦、长期免维护与可维护性；密封过紧可能增加起动力矩和温升。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "密封越紧越好、润滑脂填得越满越好。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q129", "q": "旋转轴承与摆动轴承的寿命计算一样吗？", "short": "小角度摆动或频繁启停时，标准旋转额定寿命模型可能无法充分覆盖润滑状态、微动磨损和载荷反复作用，需要采用厂家摆动应用计算指南。", "deep": "关注摆动角度、频率、载荷峰值、润滑接触条件和静载；反复小角度往复可出现假性布氏压痕。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q130", "q": "如何测量关节支承刚度和轴向窜动？", "short": "用受控轴向载荷与位移测量装置，记录加载/卸载曲线，计算增量刚度k=ΔF/Δx；记录回差与重复性。", "deep": "测量时区分轴承内部弹性、支承座变形、连接件松动和减速器间隙；建立工装自身刚度修正。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "轴承与轴系", "steps": [], "pitfalls": "只用手晃轴判断刚度与预紧。", "followups": "", "formula": "k=ΔF/Δx", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q131", "q": "齿轮从输入需求到出图的完整设计流程？", "short": "需求（功率、输入输出转速、峰值扭矩、寿命、空间、噪声）→传动级数和速比分配→齿轮参数→材料热处理→齿根/齿面强度→轴承与轴→润滑与热→公差装配→仿真和台架验证。", "deep": "不能只计算m和z；要把载荷工况、齿宽载荷分布、制造精度、回差、NVH以及批量工艺闭合。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "一看到扭矩就直接拍一个模数。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q132", "q": "齿轮模数、齿数、分度圆和中心距的关系？", "short": "标准直齿圆柱齿轮 d=mz，两外啮合齿轮理论中心距 a=m(z1+z2)/2；传动比 i=z2/z1。", "deep": "此为标准直齿、无变位并按标准中心距装配的基础关系。斜齿轮需区分法向模数mn、端面模数mt和螺旋角β，变位中心距亦可能变化。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "把d=mz不经修正直接用于斜齿轮法向模数。", "followups": "", "formula": "d=mz；a=m(z1+z2)/2；i=z2/z1", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q133", "q": "齿轮切向力Ft怎么计算？", "short": "在已知作用在该齿轮上的扭矩T和分度圆直径d时，Ft=2T/d；T用N·m则d必须用m。", "deep": "直齿外啮合径向力Fr=Ft·tanα；斜齿轮还存在轴向力Fa，作用方向要由旋向和旋转方向判定。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "用毫米d却不把N·m换成N·mm，结果差1000倍。", "followups": "", "formula": "Ft=2T/d；Fr=Ft·tanα", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q134", "q": "标准直齿轮齿数过少为什么会根切？", "short": "用标准齿条刀具加工少齿数渐开线齿轮时，齿根部分渐开线可能被切除，减弱齿根；20°全齿高标准直齿常以17齿附近作为经验界限。", "deep": "通过适当正变位、增大压力角或调整齿顶高系数等设计方法避免根切，最终按几何和标准核算。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "把17齿当成所有压力角、所有变位和斜齿轮的固定极限。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q135", "q": "齿轮正变位和负变位会改变什么？", "short": "变位系数x改变刀具相对毛坯的径向位置，影响齿根厚度、齿顶厚度、根切风险、工作压力角及中心距设计。", "deep": "小齿轮常用适当正变位提高齿根强度；配对齿轮需一起核算顶隙、重合度、齿侧间隙与中心距。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "变位不是齿轮直径简单整体加大；也不等于一定更强。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q136", "q": "齿轮修形与变位有什么本质区别？", "short": "变位是齿轮宏观几何设计参数；修形是在齿形/齿向局部微量修正，以改善受载啮合和噪声、边缘接触。", "deep": "修缘、鼓形、齿顶修缘等需要依据受载变形、制造与安装误差确定量级；常用接触分析或试验优化。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "把变位系数x和齿向鼓形修形量混在一起。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q137", "q": "齿根弯曲疲劳与齿面接触疲劳怎样校核？", "short": "齿根弯曲关注齿根拉应力引起裂纹/折断；齿面接触关注接触压力与点蚀、剥落。通常依据ISO 6336或适用标准并结合材料、热处理、寿命、载荷系数计算。", "deep": "核对实际载荷谱、冲击、齿宽载荷分布、润滑油膜、表面粗糙度；ANSYS局部静应力结果不能取代整套齿轮评级。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "只通过一张静力云图就宣称齿轮寿命合格。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q138", "q": "如何确定齿轮模数和齿宽？", "short": "模数先根据扭矩、齿数、尺寸和齿根/齿面承载初选，再用适用标准迭代；齿宽受承载、轴挠度、齿向偏载、制造和空间约束。", "deep": "模数越大并非越优：会增加体积、噪声和惯量；齿宽增加也可能因轴系挠曲引起偏载而降低实际有效接触。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q139", "q": "齿轮精度6级、7级、8级哪个高？", "short": "按常见ISO/GB齿轮精度体系，数字越小通常精度越高；6级比7级更精密、7级比8级更精密。", "deep": "应明确精度标准及检测项目（齿距、齿廓、齿向、跳动），等级不是单独的“噪声保证书”。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "齿轮精度6级一定没有回差。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q140", "q": "为什么齿轮精度高也可能有较大齿侧间隙？", "short": "齿轮精度与齿侧间隙属于不同设计维度；侧隙受齿厚偏差、中心距、热膨胀、装配和加工策略影响。", "deep": "高精度齿轮可以有设计规定的侧隙以保证润滑、热补偿；零侧隙未必可靠。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q141", "q": "斜齿轮比直齿轮有什么特点？", "short": "斜齿通常啮合更平稳、重合度更高且噪声较低，但产生轴向力，轴承与箱体需承受额外轴向载荷。", "deep": "法向模数mn、端面模数mt=mn/cosβ，实际力计算以端面参数和压力角关系为准。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "斜齿轮只要齿轮强度够就不用算轴向力。", "followups": "", "formula": "mt=mn/cosβ", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q142", "q": "行星减速器传动比怎么算？", "short": "简单NGW行星机构固定内齿圈、太阳轮输入、行星架输出时，i=1+Zr/Zs；不同固定构件和动力路线时公式不同。", "deep": "先明确太阳轮、齿圈、行星架哪一个输入、输出、固定，写出Willis运动关系，再核对齿数配装条件和效率。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "在任意行星机构里直接套1+Zr/Zs。", "followups": "", "formula": "i=1+Zr/Zs（齿圈固定工况）", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q143", "q": "多级减速器的速比怎么分配？", "short": "总传动比为各级速比乘积；结合每级承载、尺寸、最高转速、效率和齿轮工艺进行分配，不一定平均分配。", "deep": "高速级一般功率高而扭矩较小，低速级扭矩大；每级输出T≈9550P/n并传递效率修正，再校核每级齿轮与轴承。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "直接用两级各√i而完全不校核级间受力。", "followups": "", "formula": "i总=∏i级", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q144", "q": "NGW与NW复合行星传动设计重点是什么？", "short": "先明确机构拓扑、固定构件、轮系相对运动及目标速比，再检查齿数组合、同心条件、邻接条件、装配条件、承载分配与效率。", "deep": "复合行星不能套单排NGW公式；需绘制运动链、基于相对运动推导速比并进行多行星载荷不均校核。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "背速比公式却说不清动力流与固定件。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q145", "q": "谐波、行星、RV减速器怎么选？", "short": "谐波紧凑、大速比、具有柔性传动特征；行星效率高、成熟、可做多级；RV/摆线类通常刚度与抗冲击承载强，但重量和体积可能更大。", "deep": "从连续/峰值扭矩、速度、速比、回差、扭转刚度、寿命、冲击、质量、价格以及反驱需求综合选，型号以厂商曲线验证。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "把某一种减速器绝对化为所有关节的最优选择。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q146", "q": "齿轮回差怎么测量？", "short": "固定输入端，缓慢向输出端施加正反方向小力矩，读取反向切换的角位移；同时区分弹性扭转、摩擦死区与真正的齿侧间隙。", "deep": "注意规定测试负载和角速度，重复多个位置取数据；多级系统端部间隙要考虑各级的传动比映射。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q147", "q": "齿轮啮合噪声有哪些主要原因？", "short": "齿形齿向误差、节距误差、中心距/同轴度偏差、齿轮刚度周期性变化、共振、润滑和载荷波动都可能造成啮合噪声。", "deep": "通过频谱寻找啮合频率fmesh=z·n/60及倍频，做转速扫频、空载负载对比、接触斑点和齿向偏载检查。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "只看到噪声就决定换更高齿轮精度。", "followups": "", "formula": "fmesh=z·n/60", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q148", "q": "齿轮箱热平衡怎么估算？", "short": "先按每级输入输出功率求损耗，分配到啮合、轴承、密封和搅油；用壳体对流、润滑系统及冷却通道估计散热。", "deep": "稳态热平衡 P损耗≈Q散热；温升依赖散热面积、介质、流量、环境温度，不可从效率直接给出一个固定温度。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "把所有损耗重复相加，或把10kW乘2%误认为温度上升200°C。", "followups": "", "formula": "Ploss=Pin−Pout；Q≈hA(Ts−Ta)", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q149", "q": "怎样选择减速器的润滑方式？", "short": "按周速、载荷、温度、布置姿态和密封条件选择脂润滑、油浴、飞溅或循环油润滑。", "deep": "关键看齿面与轴承的实际供油可达性、搅油损耗、热排出、寿命及维护；高速级和低速级需求可能不同。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q150", "q": "减速器传动效率如何叠加？", "short": "各级效率的乘积近似为总效率，输出功率=输入功率×各级效率乘积。", "deep": "轴承、密封和搅油等损耗是否已包含在级效率中必须明确，避免重复扣减。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "把两级98%效率简单相加得到196%。", "followups": "", "formula": "η总=η1·η2·…；Pout=Pin·η总", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q151", "q": "齿轮常见失效有哪些？", "short": "齿根疲劳断裂、齿面点蚀/剥落、胶合、磨粒磨损、塑性变形、微点蚀、腐蚀等。", "deep": "诊断顺序：表面宏观与微观→载荷谱→接触斑点→齿轮材料硬度与热处理→润滑油检验→轴系/箱体变形→验证措施。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q152", "q": "齿轮热处理常见路线怎么选？", "short": "中高强度高表面硬度需求可选渗碳淬火或感应淬火；氮化变形较小但硬化层深度和承载能力受限，需按材料和目标寿命选。", "deep": "承载与工艺共同决定路线：心部韧性、表面硬度、有效硬化层深、齿根弯曲和齿面接触疲劳都要兼顾。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "认为渗碳、氮化、调质是互相等价的处理。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q153", "q": "齿轮中心距偏差会有什么影响？", "short": "影响工作压力角、齿侧间隙、接触比和啮合位置，过小可能卡死、温升大，过大可能侧隙大、冲击噪声增加。", "deep": "在考虑轴承游隙、壳体变形、热膨胀和齿厚公差后检查工作中心距。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q154", "q": "如何估算齿轮输出扭矩？", "short": "若输入扭矩Tin、减速比i、效率η，则理想化输出Tout≈Tin·i·η；同时核对实际电机扭矩-速度曲线和持续负载能力。", "deep": "峰值扭矩与持续扭矩不能互换；启停或冲击工况需用安全裕度及实际寿命载荷谱。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "齿轮与减速器", "steps": [], "pitfalls": "拿峰值瞬时扭矩冒充额定长期可用扭矩。", "followups": "", "formula": "Tout≈Tin·i·η", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q155", "q": "同步带从零选型的步骤？", "short": "输入转速/功率/转矩与工况→设计功率及使用系数→传动比→齿形节距→两带轮齿数→中心距和带长→啮合齿数→带宽→安装张力和轴载荷校核。", "deep": "按Gates等厂家的具体系列功率评级表、最小齿数/包角修正进行最终选型。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "只按皮带能绕上去就算完成设计。", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q156", "q": "同步带齿数和传动比关系？", "short": "无打滑的理想同步带传动中，i=n1/n2=z2/z1；需核对带轮实际节径与选用节距。", "deep": "实际角度传动精度受皮带弹性、齿形变形、张紧和安装误差影响，不等于零回差。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "使用外径代替节圆直径计算准确传动比。", "followups": "", "formula": "i=n1/n2=z2/z1", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q157", "q": "同步带节圆直径怎么计算？", "short": "当带轮齿数z、皮带节距p已知，节圆直径Dp=z·p/π。", "deep": "小轮齿数必须满足厂商最小齿数、弯曲疲劳和电机轴承要求；大速比不应无脑选择极小主动轮。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "将节距p当成模数m。", "followups": "", "formula": "Dp=z·p/π", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q158", "q": "同步带长度和中心距怎么初算？", "short": "两带轮节径D、d，中心距a时，近似节线长度 L≈2a+π(D+d)/2+(D−d)^2/(4a)。", "deep": "根据计算结果选标准齿数的闭环带长，再反求中心距、包角、啮合齿数与张紧行程。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "按皮带外周长直接代替节线长。", "followups": "", "formula": "L≈2a+π(D+d)/2+(D−d)^2/(4a)", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q159", "q": "同步带设计功率怎样确定？", "short": "Pdesign=Prated×Ks，Ks为随原动机、负载、启停、峰值和工作时间变化的工况系数，按对应厂家的设计手册查表。", "deep": "不同系列/工业标准的建议系数不同，不能固定认为每个机器人关节都用1.5。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "不给出载荷性质就随意取一个安全系数。", "followups": "", "formula": "Pdesign=Prated·Ks", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q160", "q": "同步带带宽按什么选？", "short": "在已定节距、带轮齿数、转速和包角后，根据厂家单位带宽功率/扭矩额定值与修正系数选带宽，并校核齿剪切、拉力、疲劳和轴承载荷。", "deep": "带宽越大不能解决所有问题：小轮包角、啮合齿数、偏摆和安装张力常是更早的瓶颈。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q161", "q": "同步带初张力越高越好吗？", "short": "不是。足够的初张力可避免跳齿和松边抖动，但过大增加轴承径向负荷、摩擦和带寿命风险。", "deep": "结合厂家张力表/频率法测量；考虑热膨胀、张紧行程和工况载荷。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "按手感拉到最紧。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q162", "q": "同步带与链传动怎么选？", "short": "同步带通常噪声低、免油润滑、惯量相对低；链传动常耐高温/恶劣环境、长距离与重载适应强，但有润滑、冲击噪声和节距磨损。", "deep": "比较转矩、转速、洁净度、维护、布局、定位精度及总拥有成本。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q163", "q": "同步带为什么会爬齿或跳齿？", "short": "可能因张力不足、负载峰值大、小轮啮合齿数不足、带轮不对中、规格错误或齿面损伤。", "deep": "测量驱动电流、负载冲击、张力频率、包角、同轴度和皮带磨损后逐项排查。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q164", "q": "同步带安装中心距没法调，怎么设计？", "short": "优先使用张紧轮或可调整电机座，标准带长配合合理中心距公差；如果完全固定中心距，需要选适合固定中心距的皮带系列和张力管理方案。", "deep": "额外张紧轮的位置会影响包角、带寿命和紧松边布置；按厂家建议校核。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q165", "q": "机械传动中的联轴器怎么选？", "short": "看额定/峰值扭矩、转速、允许角向/径向/轴向偏差、扭转刚度、惯量、安装空间和环境。", "deep": "柔性联轴器允许一定偏差但不是消除严重不同轴的手段；机器人精密传动要注意回差与扭转弹性。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q166", "q": "传动系统扭矩、转速、功率怎样互算？", "short": "用SI单位：P(kW)=T(N·m)×n(rpm)/9550；T=9550P/n。", "deep": "此式使用输入或输出轴的实际扭矩与转速；多级传动跨轴计算要考虑效率。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "同步带与动力传动", "steps": [], "pitfalls": "在n=0时直接代入T=9550P/n；堵转/峰值需另看电机曲线。", "followups": "", "formula": "P(kW)=T·n/9550", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q167", "q": "42CrMo为什么适合高负载主轴？", "short": "42CrMo经合理调质有较好的强韧性配合，可用于高负载轴、齿轮和连接件；尺寸、硬度、疲劳与热处理状态必须具体规定。", "deep": "校核疲劳、应力集中、淬透性及大截面心部性能；按工况选择表面强化，并考虑加工热处理次序。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "只写42CrMo不写调质硬度/验收要求。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q168", "q": "40Cr、42CrMo、45钢如何比较？", "short": "45钢成本低、常用于一般轴类；40Cr合金调质性能和淬透性提升；42CrMo适合更高要求的强韧性轴系。", "deep": "具体强度必须对应热处理、截面尺寸和标准，不能只凭牌号断言某个数值。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q169", "q": "渗碳淬火和氮化有什么区别？", "short": "渗碳淬火一般能形成较深硬化层和强韧心部，适用于高载齿轮；氮化温度较低、变形通常小，适合耐磨及精密零件，但硬化层深度等需针对载荷核算。", "deep": "查有效层深、硬度梯度、变形、材料适应性和后加工方式。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q170", "q": "正火、退火、调质分别什么作用？", "short": "退火主要软化、改善加工性/组织；正火细化组织、改善均匀性；调质通常是淬火加高温回火，提高强韧性综合性能。", "deep": "工艺目的由材料、截面和终性能决定；不能把调质理解为单纯提高表面硬度。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q171", "q": "为什么7075铝比6061强，却不一定更适合机器人？", "short": "7075-T6强度高，但成本、可焊性、耐蚀性及应力腐蚀敏感性需要权衡；6061-T6加工和焊接应用广、综合成本低。", "deep": "机械腿轻量化应同时看弹性模量、构件形状和连接/疲劳；两种铝合金弹性模量接近，换7075并不会自动大幅提高同尺寸刚度。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q172", "q": "6061铝合金焊接后强度为什么变化？", "short": "焊接热影响区会改变T6析出强化状态，局部强度可能显著降低；实际结构应按焊态材料允许应力与适用工艺验算。", "deep": "避免将母材T6强度用于焊缝及热影响区直接判定合格。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q173", "q": "Q235换NM400能改善什么，风险是什么？", "short": "NM400为耐磨钢，常在磨粒磨损场景具优势，但其韧性、可焊性、冷弯加工和焊接工艺要求需核验；不等于所有机械结构都应该换。", "deep": "原本失效如果来自疲劳、冲击断裂或连接设计，换耐磨板可能并不解决根因。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q174", "q": "焊接件静强度合格但焊趾开裂，怎么理解？", "short": "焊趾是典型应力集中位置，交变载荷可引起疲劳裂纹；残余拉应力、缺陷和焊缝几何影响寿命。", "deep": "优先优化力流、减小焊趾应力集中、改善焊接质量、必要时疲劳评级与无损检测；不能只提高板厚。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q175", "q": "不锈钢一定比碳钢耐腐蚀吗？", "short": "耐腐蚀取决于介质、氯离子、温度、表面状态与缝隙结构；不锈钢可能有点蚀、缝隙腐蚀或应力腐蚀。", "deep": "海水工况关注材料牌号、表面防护、电偶腐蚀和维护，不是看到304/316就完事。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q176", "q": "为什么零件热处理后容易变形？", "short": "残余应力释放、组织转变、温度梯度与几何不对称造成尺寸变化；复杂薄壁件更敏感。", "deep": "采取预加工留量、去应力、夹具支撑、对称结构、热处理后精加工及检测；必要时对工艺进行试样确认。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q177", "q": "轴的疲劳性能只看抗拉强度够吗？", "short": "不够。疲劳还受应力集中、表面粗糙度、尺寸效应、平均应力、残余应力、腐蚀和热处理质量影响。", "deep": "先找到危险截面，再在实际交变应力和修正后的疲劳许用下进行设计。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q178", "q": "基孔制与基轴制有什么区别？", "short": "基孔制基准孔常为H，孔下偏差为零；基轴制基准轴常为h，轴上偏差为零；实际配合由两者公差带相对位置决定。", "deep": "选择配合制度看刀量具、标准件及制造经济性，最终算极限间隙/过盈。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "只说H7/h6是间隙配合，却不计算具体尺寸下的范围。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q179", "q": "过盈量如何根据极限尺寸计算？", "short": "最大过盈=轴最大极限尺寸−孔最小极限尺寸，最小过盈=轴最小极限尺寸−孔最大极限尺寸；符号若出现负值，表示某些组合变成间隙。", "deep": "过盈配合再校核接触压力、材料屈服、套圈膨胀、装拆工艺以及热态配合。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "把名义尺寸差当成最大过盈。", "followups": "", "formula": "Imax=Smax−Hmin；Imin=Smin−Hmax", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q180", "q": "轴承孔同轴度应该靠什么保证？", "short": "工艺上优先统一基准、尽可能同一次装夹/镗削加工两个孔，并在图纸上定义明确的基准体系、检测方法。", "deep": "结构上关注箱体分体装配和螺栓紧固变形；检测用坐标测量或专用芯轴并识别装夹误差。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "同轴度只靠把两个孔的尺寸公差标得很紧。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q181", "q": "形位公差的基准A、B、C有什么意义？", "short": "基准决定被测要素所依据的理想参考体系；主、次、第三基准依次约束相应自由度，必须与零件实际装配/检测定位一致。", "deep": "设计者应先明确功能基准，选择可制造可测量的基准特征；多基准不能随意互换。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q182", "q": "公差链怎么计算，极值法和统计法区别？", "short": "极值法把各环最不利公差按方向叠加，保守、适合关键不可失效尺寸；统计法基于各环分布、独立性等假设估计整体分散。", "deep": "做机器人关节公差链时核对轴承预紧端面、减速器定位面、密封压缩量、编码器气隙与端跳。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "仅把每个尺寸标很严，不做封闭环分析。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q183", "q": "定位销与螺栓功能有什么区别？", "short": "定位销主要保证重复定位与相对位置；螺栓主要提供预紧夹紧，使摩擦界面传递载荷。", "deep": "高剪切或定位要求下应明确载荷路径、配合销精度、螺栓预紧和摩擦系数；有特殊设计时螺栓也可承受剪力，但不宜默认普通通孔螺栓精准定位。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q184", "q": "铝壳体与钢螺栓连接要注意什么？", "short": "重点校核铝基体内螺纹剥扣、螺纹啮合长度、预紧力、热膨胀差和电偶腐蚀；高频拆装可考虑钢丝螺套。", "deep": "避免单纯按螺栓等级决定扭矩，先核对基材强度与接合面条件。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q185", "q": "螺栓拧紧力矩与预紧力什么关系？", "short": "初算可用T≈KFd，K为综合扭矩系数，受润滑、表面状态和螺纹影响很大。", "deep": "关键连接可用扭矩-转角或直接测量预紧力控制，振动工况要同时检查松脱和疲劳。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "拧紧力矩合格不等于预紧力一定合格。", "followups": "", "formula": "T≈K·F·d", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q186", "q": "弹簧垫圈为什么不是高振动连接的万能防松？", "short": "横向滑移会导致预紧力衰减；普通弹垫无法代替合理连接刚度、预紧力和可靠防松措施。", "deep": "可评估楔形防松垫圈、锁紧螺母、机械止退、螺纹胶及相应振动验证。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q187", "q": "键连接和花键连接怎么选？", "short": "键简单经济、适合中小扭矩但会削弱轴；花键齿数多、承载与对中能力一般更好、成本也更高。", "deep": "校核挤压、剪切、疲劳、加工公差和轴向定位；可拆装高频场景需注意磨损和润滑。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q188", "q": "O形圈密封槽设计核心是什么？", "short": "先明确静密封/动密封、介质压力、温度和沟槽尺寸；按厂商数据确定压缩率、拉伸、填充率及挤出间隙。", "deep": "动密封还需考虑速度、摩擦、表面粗糙度与材质；10bar并不意味着任何O圈尺寸都能通用。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q189", "q": "机械尺寸链为什么会导致装配卡滞？", "short": "每个零件尺寸单独合格，但累计偏差可能导致轴承过预紧、同轴度不足或间隙消失。", "deep": "按装配顺序检查封闭环、基准面平行度、热膨胀和紧固变形，必要时设计调整垫片。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q190", "q": "四足机器人每条腿为什么常采用三个自由度？", "short": "典型三主动自由度为髋外展/内收、髋俯仰及膝俯仰，使足端获得三维可控工作空间。", "deep": "实际构型仍可有不同自由度和闭链结构；设计时结合步态、运动学奇异位形、足端工作空间、布线和轻量化。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q191", "q": "关节静力矩如何从足端力求得？", "short": "使用静力关系τ=J^T F，其中J为对应构型的雅可比矩阵，F为足端外力/力矩。", "deep": "求最不利姿态、动力学冲击及负载谱，峰值和连续电机扭矩分开匹配；关节还会受到自重与惯性项。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "只用质量乘重力除腿数确定所有关节扭矩。", "followups": "", "formula": "τ=JᵀF", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q192", "q": "电机和减速器扭矩匹配有哪些陷阱？", "short": "必须同时满足峰值扭矩、持续RMS扭矩、速度-扭矩包络、效率、热限制与减速器允许冲击负载。", "deep": "减速后扭矩上升但输出速度下降；峰值持续时间和转动惯量反射需在控制周期中验证。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q193", "q": "关节扭转刚度怎么评价？", "short": "在规定扭矩范围内测输出弹性角位移，kθ=ΔT/Δθ；应区分电机、减速器、轴承和壳体贡献。", "deep": "串联柔度近似相加：1/keq≈Σ1/ki（折算到同一轴端）；低刚度会影响末端定位、控制带宽及共振。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "用减速器额定扭矩代替扭转刚度指标。", "followups": "", "formula": "kθ=ΔT/Δθ", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q194", "q": "输出端0.1°角误差对末端位置影响多少？", "short": "小角度下末端位移近似Δx≈LΔθ（弧度），例如L=0.5m、Δθ=0.1°≈0.001745rad，位移约0.873mm。", "deep": "多轴机器人要用雅可比矩阵叠加关节误差，单一关节的LΔθ只是局部近似。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "把度数直接当弧度代入。", "followups": "", "formula": "Δx≈L·Δθ(rad)", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q195", "q": "关节为什么可能需要电机端与输出端双编码器？", "short": "电机侧用于高速换相和速度控制，输出侧能观察减速器柔性与回差后的真实关节角，有助于控制和标定。", "deep": "输出编码器安装刚度、同心度、热漂移和磁干扰决定效果，不是装两个编码器就自动达到高精度。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q196", "q": "机器人关节热源通常有哪些？", "short": "电机铜损/铁损、减速器啮合损失、轴承和密封摩擦、驱动电子器件散热。", "deep": "在不同转速、负载、占空比下比较功率与温升，热模型可把铜、铁、壳体、轴和空气作为热阻节点。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q197", "q": "机器人关节如何验证防护等级？", "short": "先按目标使用场景设定防尘防水目标，优化密封路径、旋转轴封、线束接口和壳体接缝，再按适用标准开展试验。", "deep": "浸水、喷淋、粉尘、温循和长期磨损是不同测试；不能把一次静态淋水当长期动态密封可靠。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q198", "q": "为什么机器人关节要设计机械限位？", "short": "用于约束异常控制下的极端运动范围、防止结构和线束遭受破坏，同时结合软限位、缓冲和强度校核。", "deep": "机械限位可能在高速下承受冲击，需定义能量吸收、止挡位置和峰值载荷。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q199", "q": "四连杆膝关节的机械优势与代价？", "short": "可把部分驱动质量前移以降低腿端惯量，但会引入更多铰接、轴承、摩擦和变传动比，参数匹配更复杂。", "deep": "需根据目标步态和工作角度计算传动比/力臂曲线，分析死点附近力矩变化和制造误差。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q200", "q": "机器人腿部轻量化要先优化哪里？", "short": "优先降低远端质量、优化负载路径、空心截面、加强筋与高强轻质材料，并校核刚度、模态、疲劳和连接件。", "deep": "远端质量对摆动惯量的影响近似与距离平方相关；不能牺牲关节安装刚度换轻量化。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "轻量化只看静态强度和质量，忽略惯量与定位误差。", "followups": "", "formula": "I≈Σm·r²", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q201", "q": "关节模块可维护性怎么设计？", "short": "采用明确模块边界、可替换编码器/减速器/电机、可检查密封和紧固件、便捷线束连接与标定流程。", "deep": "量产时设计防呆、安装定位、紧固扭矩记录、维护寿命和故障件追溯。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q202", "q": "机器人关节回差与顺应性有什么区别？", "short": "回差是反向时的空行程/死区，顺应性是受力产生的弹性角变形；两者都会导致定位误差但诊断方法不同。", "deep": "用不同正反力矩、不同幅值、静态/动态扫描分离死区和线性刚度。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q203", "q": "ANSYS静力分析完整流程怎么讲？", "short": "明确目标和失效模式→几何简化→材料参数→接触及连接→网格→载荷/约束→求解→危险截面/位移→网格敏感性→理论核对和试验验证。", "deep": "针对螺纹、焊缝、过盈/接触需使用适合的模型，不能无条件把所有接触改为Bonded。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q204", "q": "为什么固定约束附近应力无穷高可能不可信？", "short": "尖角、点载荷和过刚约束可能产生数学奇异性，网格越细峰值越大；需要辨识真实几何与载荷施加区域。", "deep": "关注远离奇异点的应力分布、结构危险截面、线性化/平均应力和实际边界条件。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "把局部最大一格应力直接当零件真实失效应力。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q205", "q": "怎样验证网格无关性？", "short": "选择关键输出（位移、危险截面应力、接触压力等），连续进行粗、中、细网格对比，观察是否收敛。", "deep": "对奇异点的峰值应力可能永不收敛，需改变评价量与建模方式。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q206", "q": "材料强度足够为什么还要查刚度？", "short": "强度解决会不会屈服/断裂，刚度解决承载后是否过度变形；机器人末端误差、齿轮啮合、轴承偏载可能由刚度主导。", "deep": "结合静刚度、结构模态与控制带宽，尤其需要评估长细杆、空心壳体和连接界面。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q207", "q": "模态分析的主要价值是什么？", "short": "识别结构固有频率和振型，检查转动激励、齿轮啮合频率、步态激励与控制带宽是否接近共振区。", "deep": "模态频率依赖真实质量与边界；装配体需要考虑螺栓夹紧和接触刚度，不应只算孤立零件自由模态。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q208", "q": "7000N·m主轴为什么不能只用扭转公式定尺寸？", "short": "实际传动轴可能同时有弯矩、轴向力、冲击、疲劳、应力集中、联接和支承变形；扭转强度只是初步下限。", "deep": "先求轴上各危险截面内力并按材料和载荷波动进行组合强度/疲劳校核，最后复核挠度、轴承寿命与装配。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q209", "q": "实心圆轴扭转切应力怎么算？", "short": "最大扭转切应力τmax=16T/(πd³)，T用N·mm、d用mm则输出MPa。", "deep": "若空心轴，则使用极惯性矩J=π(D⁴−d⁴)/32，τmax=T·(D/2)/J；真实危险位置还受台阶和键槽影响。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "用实心公式直接算空心轴；单位混乱。", "followups": "", "formula": "τmax=16T/(πd³)（实心圆轴）", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q210", "q": "屈服强度和疲劳强度该如何区分？", "short": "静力极限最大应力与材料屈服比较；交变载荷需用疲劳曲线、应力比、平均应力修正、表面及尺寸修正等计算。", "deep": "有冲击工况还要考虑峰值塑性变形，材料说明书的静态抗拉值无法直接给疲劳寿命。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q211", "q": "螺栓连接有限元是否可直接完全绑定？", "short": "初步整体刚度分析可简化，但关键连接滑移、松动、接触压力和螺栓疲劳需要更真实的预紧及接触模型。", "deep": "模型复杂度取决于分析目标；要校核施加载荷、预紧、摩擦和截面。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q212", "q": "一台机器人腿需要做哪些校核？", "short": "受力与运动范围→静强度/刚度→疲劳→模态→接触/销轴与轴承→温升→振动/跌落/冲击→整机试验。", "deep": "危险姿态不一定是最大伸展，可能是侧向受力、单腿支撑或跳落地瞬态。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q213", "q": "液压马达理论扭矩怎么算？", "short": "液压马达理论输出T=Δp·V/(2π)，Δp用Pa、V用m³/rev；考虑机械效率后Tout≈Δp·V·ηm/(2π)。", "deep": "输出转速n≈Q·ηv/V（按一致单位），同时需要校核泵流量、压降、油温和连续压力等级。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "把液压泵额定压力当成执行器两端实际压差。", "followups": "", "formula": "T≈Δp·V·ηm/(2π)", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q214", "q": "两台液压马达并联驱动齿轮如何算总扭矩？", "short": "先分别按实际压差、排量、机械效率求轴端扭矩，再通过各自传动比和效率映射到输出轴；若工况允许共同做功才可相加。", "deep": "需要考虑流量分配、马达同步、齿轮啮合及载荷分配，不能简单按照泵最大压力乘两次。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q215", "q": "液压系统压力、流量与功率关系？", "short": "理论液压功率P(kW)=p(MPa)×Q(L/min)/60，实际输入功率还要除以泵站与传动效率。", "deep": "60L/min、21MPa理论液压功率为21kW；系统持续工作需核对电机/发动机额定功率及冷却。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "把21MPa×60L/min直接说成1260kW。", "followups": "", "formula": "P(kW)=p(MPa)·Q(L/min)/60", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q216", "q": "双锤冲击钻机卡钻如何系统排查？", "short": "按地层/水文→排渣/孔内碎屑→冲击器供气→钻杆导向→推进力及转速→孔壁坍塌→连接件与结构振动逐步定位。", "deep": "停机保护条件应明确，不能让现场人员靠增加扭矩强拉硬拽；调整工艺先试验并留记录。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q217", "q": "钻孔偏移过大如何排查？", "short": "检查开孔定位、导向柱垂直/刚度、钻杆直线度、钻头磨损、单侧岩层冲击、平台支腿稳定和推进侧向力。", "deep": "结合每杆的倾角与孔深记录定位偏斜发生的阶段。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q218", "q": "四台空压机并联为什么实际压力可能不足？", "short": "排查并联单向阀压降、管径与流速、泄漏、压缩机控制逻辑、进气温度以及实际冲击器耗气量。", "deep": "流量理论相加并不保证实际设备入口压力满足设计；要在负载工况测入口压力与总流量。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q219", "q": "液压油温持续升高如何估算和定位？", "short": "计算泵、阀、管路、马达的损失功率并估散热器排热能力；记录油箱进出温度、流量、负载压力和环境。", "deep": "比例阀节流、溢流和低效率马达可能产生主要热损失；需分路测量。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q220", "q": "重载机械腿摆动液压执行器与轴承如何区分？", "short": "明确执行器内部输出轴支承与腿部外部铰点的支承：轴承的实际载荷路径不同，不应视为同一个轴承。", "deep": "关节结构图要明确摆动缸、连接轴、外部铰点、腿杆和负载，分别计算反力。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "液压与重载装备", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q221", "q": "现场零件突然断裂如何做8D/根因排查？", "short": "先保全断口与装配状态→隔离风险批次→采集真实载荷→宏微观断口→材料硬度/热处理→结构应力与加工缺陷→提出并验证永久改进。", "deep": "区分疲劳条带、一次性过载韧窝、脆断和腐蚀；所有判断都要有材料与载荷证据。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "量产质量与失效分析", "steps": [], "pitfalls": "未取证先打磨断口或直接归因操作失误。", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q222", "q": "样机工作正常，量产不稳定从哪里查？", "short": "先核对版本和BOM一致性，再检查关键工序能力、加工尺寸散布、材料热处理、装配工装、供应商批次与测试覆盖。", "deep": "通过CTQ关键特性、过程能力/抽检、首件报告、追溯和8D纠正措施完成闭环。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q223", "q": "FMEA与DFMEA的目的是什么？", "short": "在设计阶段识别潜在失效模式、后果、原因、现有控制和风险优先级，并落实可验证的预防/探测行动。", "deep": "不要只写表格：要将分析结果驱动结构更改、设计验证计划和检查规范。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q224", "q": "样机温升测试怎么设计？", "short": "明确环境温度、转速、负载、占空比、测试点与稳态判据；记录温度时间序列并区分各个热源。", "deep": "对比空载/负载、正反转、多个转速点；把壳体温度与内部轴承温度区分。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q225", "q": "设备出现重复性异响如何定位？", "short": "先按转速相关/负载相关/周期性/瞬态分类；用转速同步频谱、振动测点、听诊和拆装隔离查找源头。", "deep": "核对轴承特征 展", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q232", "q": "面试中不会的精密减速器问题怎么办？", "short": "明确自己掌握的已知原理与尚未验证的部分，给出标准/厂商资料查核路径和工程验证步骤，不硬编使用经历。", "deep": "坦诚不等于只说不知道；应展示正确的分析框架。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q233", "q": "与研发总监面谈要准备什么？", "short": "3分钟真实自我介绍+2个工程项目闭环+1个技术失败改进+机器人匹配逻辑+管理职责+对岗位产品阶段的反问。", "deep": "领导更关注能解决什么问题、风险管理和资源配置，技术负责人追问时再展开计算细节。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q234", "q": "面试如何展示从样机到量产的能力？", "short": "用具体案例呈现需求指标、方案权衡、DFM/DFA、公差链、供应链、装配工装、测试规范、问题回写和版本冻结。", "deep": "不要仅说“我负责从0到1”，要有交付物清单和验证证据。", "source": "历史问答延伸 · 工程知识卡", "type": "知识扩展", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}];
