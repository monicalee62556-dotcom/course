<dialog id="detail-dialog" class="dialog" aria-label="学习帮助"><div id="dialog-content"></div></dialog><div id="toast" class="toast" hidden role="status"></div><noscript><p>课程需要启用 JavaScript 才能显示。完整内容和图解已包含在本文件内，无需另外加载题库。</p></noscript><script>const TOPICS=[{"id": "T01", "module": "高扭矩执行机构与液压马达", "title": "为什么选两台BM3Y-315，而不是一台更大排量马达？", "diagram": "hydraulic_dual", "summary": "围绕目标扭矩、目标转速、液压站流量与结构布置，比较双马达方案与单大马达方案。", "goal": "讲清“低速大扭矩 + 高速低扭矩”的双工况需求，以及双马达串并联切换的优势。", "process": ["先确认目标：低速模式约20 rpm，高速模式约40 rpm，主轴输出扭矩目标约7 kN·m。", "核查液压站边界：系统压力约21 MPa，总流量约60 L/min。", "比较单马达大排量与双马达方案：双马达更容易实现串并联切换，既能保留扭矩，又便于做两档速度。", "从安装空间、油路切换、采购通用性、故障冗余等维度说明双马达方案更均衡。"], "keypoints": ["双马达并联可做低速大扭矩；串联可做高速低扭矩。", "不是“马达越大越好”，还要看流量、转速和装配空间。", "面试时最好强调“液压系统是功率约束，齿轮箱是转速/扭矩重分配器”。"], "formulas": [{"name": "液压功率边界", "expr": "P_h=ΔpQ/60", "explain": "压力(MPa)×流量(L/min)可快速估算液压输入功率(kW)。"}], "pitfalls": ["只盯扭矩，不看流量与转速，容易把方案说死。", "不能把双马达方案说成“天然功率翻倍”，核心还是系统总压差与总流量。"], "related": ["Q001", "Q210"]}, {"id": "T02", "module": "高扭矩执行机构与液压马达", "title": "已知排量321.5 mL/r、压差20 MPa、机械效率0.85，如何算单台马达扭矩？", "diagram": "motor_torque", "summary": "从液压马达基本扭矩公式入手，先算理论扭矩，再乘机械效率。", "goal": "掌握单台马达扭矩计算，是后续齿轮减速和主轴输出计算的起点。", "process": ["统一单位：321.5 mL/r = 321.5×10^-6 m³/r。", "代入液压马达扭矩公式 T=ΔpVη_m/(2π)。", "20 MPa、321.5 mL/r、η_m=0.85 对应单台扭矩约870 N·m。", "说明这个值是计算值，连续额定扭矩仍应以样本为准。"], "keypoints": ["压差决定扭矩，流量决定转速。", "机械效率用于扭矩，容积效率用于转速。", "样本连续扭矩与理论计算值要交叉核对。"], "formulas": [{"name": "马达输出扭矩", "expr": "T_m=ΔpV_mη_m/(2π)", "explain": "适用于液压马达或摆线马达的静态估算。"}], "pitfalls": ["最常见错误是把mL/r直接代入Pa公式不换单位。", "不要把0.85机械效率误写成总效率。"], "related": ["Q004"]}, {"id": "T03", "module": "高扭矩执行机构与液压马达", "title": "14齿主动轮、55齿从动轮，如何算减速比、输出转速与输出扭矩？", "diagram": "gear_pair", "summary": "先求速比，再把马达转速和扭矩通过齿轮副映射到主轴。", "goal": "把“齿数比→减速比→转速降低→扭矩放大”的逻辑讲完整。", "process": ["速比 i=z2/z1=55/14≈3.93。", "若已知马达转速 n_m，则主轴转速 n_out=n_m/i。", "若已知马达扭矩 T_m，则主轴扭矩 T_out=T_m·i·η_g。", "两台马达共同驱动时，再考虑两路扭矩叠加。"], "keypoints": ["减速比由齿数比决定，不是由模数决定。", "齿轮扭矩放大要扣除传动效率。", "两台马达共同驱动同一大齿轮时，要提醒面试官“需关注载荷分配”。"], "formulas": [{"name": "齿轮减速比", "expr": "i=z_2/z_1", "explain": "从动齿数除以主动齿数。"}, {"name": "扭矩放大", "expr": "T_out=T_in·i·η_g", "explain": "忽略惯性与波动时的稳态估算。"}], "pitfalls": ["把55/14算成反比是常见低级错误。", "只说“减速比越大扭矩越大”，不说明转速同步下降，会显得不完整。"], "related": ["Q001", "Q024"]}, {"id": "T04", "module": "高扭矩执行机构与液压马达", "title": "双马达串联和并联，为什么能实现低速大扭矩与高速低扭矩？", "diagram": "series_parallel", "summary": "关键是总流量与总压差的分配方式不同，直接决定每台马达的转速与扭矩。", "goal": "理解液压并联/串联切换，是讲明M400动力头设计亮点的核心。", "process": ["并联：总流量分成两路，每台获得约30 L/min，但压差都可接近系统压差，因此每台扭矩大、转速低。", "串联：总流量依次流过两台马达，每台都通过整路流量，转速提高；总压差分摊到两台，单台扭矩下降。", "将两台输出统一经齿轮副作用于主轴，形成两档工况。", "强调串联工况下压差分配并非绝对平均，要受负载与泄漏影响。"], "keypoints": ["并联更像“保压降流”，串联更像“保流分压”。", "双工况切换通常意味着阀组、回油和安全逻辑更复杂。"], "formulas": [{"name": "转速近似关系", "expr": "n∝Q/V_m", "explain": "流量增大则转速增大。"}, {"name": "扭矩近似关系", "expr": "T∝ΔpV_m", "explain": "压差增大则扭矩增大。"}], "pitfalls": ["不能绝对化说“串联时每台一定10 MPa”，那只是理想均载近似。"], "related": ["Q007"]}, {"id": "T05", "module": "高扭矩执行机构与液压马达", "title": "液压站60 L/min供油时，并联和串联两种模式下主轴转速分别是多少？", "diagram": "speed_calc", "summary": "基于流量、排量、容积效率和齿轮减速比，计算两种模式的理论输出转速。", "goal": "把20 rpm与40 rpm这两个目标工况算出来。", "process": ["先区分马达容积效率与机械效率；转速计算主要用容积效率。", "并联时每台约30 L/min：马达转速约79 rpm；除以3.93后主轴约20 rpm。", "串联时每台通过60 L/min：马达转速约159 rpm；除以3.93后主轴约40 rpm。", "说明这是理论速度，实际会受泄漏、压降与负载影响。"], "keypoints": ["60 L/min不是“每台60 L/min”的并联工况。", "目标20/40 rpm恰好与双工况需求吻合，这是参数匹配合理的证据。"], "formulas": [{"name": "马达转速", "expr": "n_m=1000Q_mη_v/V_m", "explain": "Q单位L/min，V单位mL/r。"}, {"name": "主轴转速", "expr": "n_out=n_m/i", "explain": "减速后转速下降。"}], "pitfalls": ["别把0.85机械效率直接拿去算转速；严格应使用容积效率。"], "related": ["Q006"]}, {"id": "T06", "module": "高扭矩执行机构与液压马达", "title": "机械效率、容积效率、总效率分别如何参与扭矩、转速和功率计算？", "diagram": "efficiency", "summary": "这是一道特别容易被追问的效率拆分题。", "goal": "说清每个效率项进入哪个公式，避免“把一个0.85到处乱乘”。", "process": ["机械效率主要影响输出扭矩。", "容积效率主要影响转速/流量关系。", "总效率≈机械效率×容积效率，用于估算整体输入输出功率比。", "在面试里最好明确：不同效率来自样本数据或经验估算，不能随便假定。"], "keypoints": ["机械效率对扭矩，容积效率对转速。", "总效率用于能量守恒层面的输入输出核算。"], "formulas": [{"name": "总效率", "expr": "η_t≈η_m·η_v", "explain": "常用于液压元件粗算。"}], "pitfalls": ["把容积效率乘到扭矩公式里，或者把机械效率乘到转速公式里，都是常见错误。"], "related": ["Q004", "Q010"]}, {"id": "T07", "module": "高扭矩执行机构与液压马达", "title": "6630 N·m、20 rpm对应多少机械输出功率？如何与液压站输入功率核对？", "diagram": "power_balance", "summary": "先算主轴机械功率，再与液压输入功率比较，验证方案是否自洽。", "goal": "面试回答要体现功率守恒意识，而不是只看扭矩。", "process": ["输出轴功率 P=Tn/9550。", "6630 N·m、20 rpm对应约13.9 kW；3315 N·m、40 rpm同样约13.9 kW。", "液压输入功率在20 MPa、60 L/min条件下约20 kW。", "考虑马达与齿轮损耗后，13.9 kW输出是合理的。"], "keypoints": ["主轴输出功率必须小于液压输入功率。", "同一液压站下，两种模式往往功率接近，但扭矩和转速互换。"], "formulas": [{"name": "旋转轴功率", "expr": "P=Tn/9550", "explain": "T单位N·m，n单位rpm，P单位kW。"}, {"name": "液压输入功率", "expr": "P_h=ΔpQ/60", "explain": "压差MPa、流量L/min。"}], "pitfalls": ["把“高扭矩模式”和“高转速模式”的功率算出两个完全不同的大值，往往说明逻辑有误。"], "related": ["Q011"]}, {"id": "T08", "module": "高扭矩执行机构与液压马达", "title": "为什么“6630 N·m + 40 rpm”不一定能由原液压站长期实现？", "diagram": "limit_case", "summary": "这是用功率上限反推方案边界的题。", "goal": "说明高扭矩与高转速不能在同一供能条件下同时取极值。", "process": ["按P=Tn/9550，6630 N·m与40 rpm对应约27.8 kW机械输出。", "原液压站20 MPa、60 L/min输入功率约20 kW，扣除损耗后更低。", "因此“6630 N·m+40 rpm”只能是误解、瞬态或需要更大液压站。", "面试里讲出这个矛盾，会体现你有功率约束意识。"], "keypoints": ["扭矩、转速、功率三者不能各自取最大值。"], "formulas": [{"name": "极限校核", "expr": "P_need=Tn/9550", "explain": "先算需求功率，再与液压站功率比较。"}], "pitfalls": ["把不同工况下的最大值机械拼接到一起，是非常常见的方案汇报错误。"], "related": ["Q012"]}, {"id": "T09", "module": "高扭矩执行机构与液压马达", "title": "系统压力21 MPa，为什么不能直接认为马达进出口压差就是21 MPa？", "diagram": "pressure_drop", "summary": "系统额定压力只是泵站或溢流设定，不等于马达端有效压差。", "goal": "培养“沿管路看压差”的习惯。", "process": ["区分系统供压、阀口压降、管路损失、背压与马达进出口压差。", "只有马达进出口的实际压差，才参与扭矩公式。", "阀块切换、节流、回油背压都会吞掉一部分压力。", "现场测试应通过马达A/B口测压来获得真实压差。"], "keypoints": ["液压元件看的是“压差”，不是“表压名义值”。"], "formulas": [{"name": "有效压差", "expr": "Δp_m=p_A-p_B", "explain": "马达进出口压差才真正做功。"}], "pitfalls": ["把泵出口21 MPa直接代入马达扭矩公式，是最常见的高估来源。"], "related": ["Q009"]}, {"id": "T10", "module": "高扭矩执行机构与液压马达", "title": "变量泵A10VO28如何估算流量、输入扭矩及驱动功率？", "diagram": "pump", "summary": "从泵排量、转速和压力出发，建立液压源端的计算框架。", "goal": "说明“动力头不只看马达，液压源同样要匹配”。", "process": ["泵理论流量 Q_th=V_p·n/1000。", "实际流量还需乘容积效率；输入扭矩可按T_in=ΔpV_p/(2π·η_m)估算。", "泵轴输入功率≈ΔpQ/60η_t。", "面试时若无样本数据，可先给出计算框架，再说明以样本修正。"], "keypoints": ["马达端与泵端要形成闭环匹配：压力、流量、驱动功率都要能闭合。"], "formulas": [{"name": "泵流量", "expr": "Q=V_pnη_v/1000", "explain": "V_p单位mL/r。"}, {"name": "泵输入扭矩", "expr": "T_in=ΔpV_p/(2πη_m)", "explain": "用于粗算原动机扭矩。"}], "pitfalls": ["不要混淆泵排量28 mL/r与马达排量321.5 mL/r的量级差异。"], "related": ["Q013"]}, {"id": "T11", "module": "高扭矩执行机构与液压马达", "title": "两台马达共同驱动一个大齿轮，如何分析载荷分配不均、振动和齿面偏载？", "diagram": "dual_drive", "summary": "关注双输入汇合机构的同步、安装误差和刚度问题。", "goal": "这类题可以体现你对“理论可行 ≠ 工程稳定”的理解。", "process": ["检查两台马达输出扭矩一致性、齿轮安装误差和轴系扭转刚度。", "分析背隙、箱体变形、轴承游隙对双路载荷分配的影响。", "必要时通过浮动支撑、联轴器柔性、加工精度和装配调整改善均载。", "试验上看振动、温升、齿面接触斑点和噪声。"], "keypoints": ["双马达汇合机构最怕“理论均载，实际偏载”。", "箱体刚度不足会把齿轮均载问题放大。"], "formulas": [], "pitfalls": ["面试别只说“两个马达平均分担一半扭矩”，那只是理想状态。"], "related": ["Q014"]}, {"id": "T12", "module": "高扭矩执行机构与液压马达", "title": "BM3Y-315的额定扭矩、峰值扭矩、连续工作压力如何核查？", "diagram": "spec_check", "summary": "把理论计算与样本参数做对比，避免超额定使用。", "goal": "体现你会“查样本、看边界、做选型闭环”。", "process": ["先找厂家样本：额定压力、峰值压力、连续扭矩、峰值扭矩、最大流量。", "把理论870 N·m与样本连续扭矩对比，判断是否过于激进。", "若不同厂家同名系列参数差异大，应以最终采购型号生产厂家样本为准。", "最后结合占空比和温升确定是否允许长期运行。"], "keypoints": ["理论扭矩不等于样本连续允许扭矩。", "峰值能力不代表可长期输出。"], "formulas": [], "pitfalls": ["只给理论计算、不提样本，是选型答案的不完整之处。"], "related": ["Q015"]}, {"id": "T13", "module": "高扭矩执行机构与液压马达", "title": "目标7000 N·m，但初步计算只有6630 N·m，优先调压力、排量还是减速比？", "diagram": "optimization", "summary": "从功率、转速目标、结构空间和效率损失综合决定优化路径。", "goal": "建立“先看约束，再调参数”的优化逻辑。", "process": ["先确认差距：6630到7000只差约5.6%。", "若系统压力还有小幅提升空间，优先检查能否从20 MPa接近21 MPa；但必须核查样本额定。", "若需要保留20/40 rpm两档目标，改变减速比会同步影响转速，因此要谨慎。", "增大排量会增扭矩但降低转速、增加体积；最终应按功率边界和目标工况综合权衡。"], "keypoints": ["接近目标差距不大时，先做边界校核，再决定是否需要改结构。"], "formulas": [], "pitfalls": ["别一遇到扭矩不足就盲目“加大减速比”，那可能把转速目标破坏掉。"], "related": ["Q016"]}, {"id": "T14", "module": "轴承选型、游隙、预紧与装配", "title": "已知原始游隙、过盈配合和温差，如何计算最终工作游隙？", "diagram": "clearance_flow", "summary": "把轴承游隙看成“初始游隙－配合引起的游隙损失－温差引起的游隙损失”。", "goal const QUESTIONS=[{"id": "Q001", "q": "高扭矩执行机构的齿轮怎么设计？", "short": "先澄清实际传动路线，不能将液压摆动执行机构说成纯齿轮减速器。若含齿轮：明确扭矩、转速、 传动比、中心距、寿命与冲击工况；初选齿数、模数、齿宽和材料；按标准校核齿根弯曲疲劳、齿面接触疲 劳，再校核轴系、轴承、箱体。说清本人实际承担的部分。", "deep": "先画清动力流：液压压力与流量决定输入功率，液压马达/摆动执行器的输出再经 连接件传至负载。若确有齿轮副，列出各级速比、输入输出扭矩和效率；若没有齿轮，不要硬说自己做了齿轮 设计。以 7000 N·m 作为输出目标时，必须补充输出角速度、工作占空比、峰值持续时间、冲击系数及支承方 式，否则不能单凭扭矩定轴承或齿轮。", "source": "10月8日45题复习稿 · 第1题", "type": "历史复盘归纳", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "请说明该项目实际传动方案、输入参数、你本人承担的计算、用过的软件、测试证据；遇到不 会的专项计算，解释如何按标准开展，而不是虚构经历。", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q002", "q": "齿轮参数怎么算？", "short": "标准直齿圆柱齿轮初步关系：i=z2/z1；d=mz；a=m(z1+z2)/2；Ft=2T/d。随后考虑载荷系数、齿 形、接触与弯曲疲劳安全系数，不能仅凭这四式完成设计。", "deep": "算例：若小齿轮模数 m=2 mm、齿数 z=20，则分度圆 d=40 mm。若输入扭矩 T=100 N·m，则 Ft=2×100/0.04=5000 N。再根据压力角求径向力、齿轮材料和热处理确定许用应力，并用标 准校核弯曲与接触疲劳。该算例仅展示计算路径，不是用户项目参数。", "source": "10月8日45题复习稿 · 第2题", "type": "历史复盘归纳", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "请说明该项目实际传动方案、输入参数、你本人承担的计算、用过的软件、测试证据；遇到不 会的专项计算，解释如何按标准开展，而不是虚构经历。", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q003", "q": "有没有做齿轮仿真？", "short": "区分齿轮标准强度校核、啮合接触分析、轴系箱体有限元。ANSYS 可做局部应力、接触和热结构 分析，但不替代完整的齿轮标准校核。只说实际做过的项目。", "deep": "先说明仿真对象：齿根应力、齿面接触、轴承座变形、箱体刚度或热传导各需不 同边界条件。接触仿真需定义摩擦、接触网格、约束、扭矩加载和收敛；不能拿一张静力云图当成整套齿轮寿 命证明。", "source": "10月8日45题复习稿 · 第3题", "type": "历史复盘归纳", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "请说明该项目实际传动方案、输入参数、你本人承担的计算、用过的软件、测试证据；遇到不 会的专项计算，解释如何按标准开展，而不是虚构经历。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q004", "q": "用什么专业软件？", "short": "KISSsoft、Romax、MASTA 可用于传动分析。实际没用过就说“了解工具，但项目主要采用标准 计算、三维设计和 ANSYS 结构校核”。", "deep": "专业软件常用于齿轮标准校核、微观修形、轴承寿命及传动系统分析；ANSYS 更 适合结构、接触、热和模态有限元。回答时用“我实际使用的是……；对于精密齿轮专项分析，我了解……但没 有独立项目使用经历”。", "source": "10月8日45题复习稿 · 第4题", "type": "历史复盘归纳", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "请说明该项目实际传动方案、输入参数、你本人承担的计算、用过的软件、测试证据；遇到不 会的专项计算，解释如何按标准开展，而不是虚构经历。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q005", "q": "齿轮发热怎么算？", "short": "建立功率流：总损耗 Pin-Pout；分别估算齿轮啮合、轴承、密封、搅油损耗。示例：某级输入 10kW、总效率 98%，该级总损耗约 200W；不能把它全部当作齿面摩擦热。", "deep": "损耗必须按功率流分级核算，不能将整机效率损耗再与各分项简单相加造成重复 计算。轴承或密封摩擦功率可用 P=Mf×2πn/60；啮合损耗随载荷、滑动速度、润滑状态变化。温升试验应记 录环境温度、转速、负载、壳体温度与运行时长。", "source": "10月8日45题复习稿 · 第5题", "type": "历史复盘归纳", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "请说明该项目实际传动方案、输入参数、你本人承担的计算、用过的软件、测试证据；遇到不 会的专项计算，解释如何按标准开展，而不是虚构经历。", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q006", "q": "热管理怎么设计？", "short": "损耗→热源位置→轴/润滑介质/壳体热路径→自然对流/强制冷却→稳态温度→ANSYS 热分析→样 机温升试验。Q≈hA(Ts-Ta)是简化对流关系，实际还需考虑辐射与接触热阻。", "deep": "稳态热平衡为产热≈散热；自然对流可用 Q=hA(Ts−Ta)估算，但 h 需要合理工况 依据。实际热阻路径包括齿轮→润滑油→箱体、齿轮→轴→轴承→箱体。仿真应施加有根据的热功率和对流边 界，并通过热电偶数据反校模型。", "source": "10月8日45题复习稿 · 第6题", "type": "历史复盘归纳", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "请说明该项目实际传动方案、输入参数、你本人承担的计算、用过的软件、测试证据；遇到不 会的专项计算，解释如何按标准开展，而不是虚构经历。 二、晓天衡宇｜实际面试复盘", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q007", "q": "螺栓、螺钉、螺柱如何选？", "short": "按连接结构、可接近性、拆装频率、被连接件螺纹强度与载荷选。螺栓常配螺母，螺钉拧入内螺 纹，双头螺柱适合反复拆装等情况。", "deep": "连接件要区分螺栓通孔配螺母、螺钉旋入基体、双头螺柱固定于基体。设计时校 核预紧、抗滑移、疲劳、螺纹啮合长度与基体材料强度；铝合金内螺纹多次拆装可考虑钢丝螺套。", "source": "10月8日45题复习稿 · 第7题", "type": "历史复盘归纳", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q008", "q": "螺纹连接怎么防松？", "short": "先保证预紧力与连接刚度，再按振动/冲击选择锁固胶、机械防松等，并做防松验证。", "deep": "横向振动易使连接失去预紧。首先避免结合面滑移，保证合理夹紧长度与预紧； 其次根据维护要求选择机械防松、楔形垫圈或螺纹胶。防松设计需要振动试验和拆装工艺验证，不能只说“加 弹垫”。", "source": "10月8日45题复习稿 · 第8题", "type": "历史复盘归纳", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q009", "q": "不同材料热膨胀不一致怎么办？", "short": "ΔL=(α1-α2)LΔT；检查配合、定位和热应力。通过材料匹配、浮动连接、长圆孔、合理公差或柔性 结构处理。", "deep": "算例：铝件 α≈23×10⁻⁶/K，钢件 α≈12×10⁻⁶/K，长度 100 mm、温升 50 K，差异 膨胀约 0.055 mm。判断这 0.055 mm 对轴承配合、定位精度和热应力是否可接受；必要时采用浮动端或补偿 结构。", "source": "10月8日45题复习稿 · 第9题", "type": "历史复盘归纳", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q010", "q": "水下装备怎么防腐蚀？", "short": "选材、涂层、电偶隔离、密封、必要时阴极保护，并考虑维护周期。", "deep": "优先看海水腐蚀、电偶腐蚀、缝隙腐蚀与长期密封。异种金属电连接时需关注电 位差和绝缘隔离；涂层破损处也可能成为腐蚀起点。密封方案还需兼顾压力、温度、介质、装配及维护。", "source": "10月8日45题复习稿 · 第10题", "type": "历史复盘归纳", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q011", "q": "海洋生物附着怎么处理？", "short": "防污涂层、减少易附着死角、定期清洁和可维护设计，结合环保要求。", "deep": "生物附着不仅增加阻力，也可能影响换能器窗口、散热及维护。结合材料兼容性 选择防污表面，减少积水和死角，设计便于清洁的接口；不能假设某一种涂层在所有海域长期有效。", "source": "10月8日45题复习稿 · 第11题", "type": "历史复盘归纳", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q012", "q": "怎么管理研发团队？", "short": "负责人抓总体方案、核心接口、关键风险与评审；成熟模块授权工程师，按里程碑推进问题闭环。", "deep": "项目启动时建立 WBS、技术接口表、关键路径与风险清单。每周按交付物而非只 按工作时长跟踪；出现卡点时负责人负责跨部门协调、资源调整与技术决策。考核指标应可量化，避免只 喊“催进度”。", "source": "10月8日45题复习稿 · 第12题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q013", "q": "技术与管理怎么平衡？", "short": "关键技术自己深入，成熟任务授权，避免事事亲自做成为瓶颈。", "deep": "分清负责人必须亲自把关的内容（系统架构、关键载荷、重大风险、对外技术承 诺）和可授权的内容（成熟零件出图、标准件选型、一般工艺改进）。设设计评审门槛，避免反复救火。", "source": "10月8日45题复习稿 · 第13题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q014", "q": "跨部门互相推责怎么办？", "short": "以整机问题为目标，先复现、采集数据、定位物理原因，再分配整改任务并验证；可用传感器振动 案例。", "deep": "案例叙述用 STAR：背景是机械振动影响传感器；任务是定位源头；行动是同步记 录振动频谱、安装刚度、运行工况，分离机械激励与电气信号问题；结果必须填写真实测试数据和整改结论， 不可虚构。", "source": "10月8日45题复习稿 · 第14题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q015", "q": "你最大的缺点？", "short": "过去过于深入技术细节，现通过任务分级、关键路径与授权改善。", "deep": "缺点不能说成“追求完美”而没有行动。可以讲曾因自己深陷技术细节导致协调效率 下降，随后采用任务分级、关键节点评审和责任人制度；最好附真实例子说明改善。", "source": "10月8日45题复习稿 · 第15题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q016", "q": "最满意项目？", "short": "按背景→个人职责→关键难点→技术方案→测试结果→个人贡献讲真实 0 到 1 项目。", "deep": "用项目一页纸准备：项目目标、难点、个人职责、技术方案、失败与迭代、最终 指标。准备三张图：总体布局、关键机构剖面、测试或整改对比；每张图都能说清设计输入和你的贡献。", "source": "10月8日45题复习稿 · 第16题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q017", "q": "最有挑战项目？", "short": "突出不确定性、失败分析、验证与迭代，不只讲最终成功。", "deep": "按“难在哪里→为什么常规方案不行→怎么计算与试验→失败了什么→如何修正→ 证据是什么”展开。面试官往往会追问具体数字；没有留存数据就如实说明数量级或查记录，不应临场编造。", "source": "10月8日45题复习稿 · 第17题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q018", "q": "样机到量产要解决什么？", "short": "DFM/DFA、公差链、工装、供应商能力、检验规范、可靠性、成本和一致性。", "deep": "样机允许手工修配，量产必须消除对个人经验的依赖。关键动作包括公差链、 DFM/DFA、关键特性 CTQ、工装治具、首件检验、过程检验、终检、供应商过程能力及不良闭环。", "source": "10月8日45题复习稿 · 第18题", "type": "历史复盘归纳", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q019", "q": "为什么离职？", "short": "希望把复杂机械系统和工程化能力聚焦机器人机械系统与智能装备，不抱怨现公司。", "deep": "离职原因应聚焦长期技术方向和岗位适配，避免过多抱怨原公司。说明希望从复 杂工程装备走向机器人本体结构、关节系统集成和产品化，并强调过去可迁移的机械基础。", "source": "10月8日45题复习稿 · 第19题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q020", "q": "未来 3 至 5 年规划？", "short": "深入机器人机构、执行器、整机机械系统和产品化，持续承担技术及项目责任。", "deep": "前 1 年快速掌握机器人运动机构、关节模块与量产规范；2—3 年独立负责整机重 要子系统；3—5 年承担机械系统总体或技术负责人。不要承诺短期精通所有精密减速器设计。", "source": "10月8日45题复习稿 · 第20题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。 三、无限智外｜实际面试复盘", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q021", "q": "介绍主动声呐项目。", "short": "从需求、系统方案、个人负责的结构和接口、加工装配、联调、试验、整改讲清楚；不夸大自己负 责范围。", "deep": "声呐项目可按“工作水深/外压→密封与耐腐蚀→传感器安装与隔振→装配测试”组 织。若被问传播损耗，先说明频率、距离、声道和海况：100 km 球面扩散约 100 dB（以 1 m 为参考），还 需加吸收损失，不能给单一通用值。", "source": "10月8日45题复习稿 · 第21题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q022", "q": "你个人具体负责什么？", "short": "区分自己主导、参与、协同的工作，准备可验证的计算、图纸、测试及改进例子。", "deep": "把个人职责拆成：亲自完成的总体设计、关键结构、载荷/尺寸计算、供应商技术 对接、样机测试；团队或外协完成的部分单独标出。回答时主动说明“我做到了哪一步”，可信度更高。", "source": "10月8日45题复习稿 · 第22题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q023", "q": "最有挑战的 0 到 1 项目？", "short": "选择真实项目，讲关键技术不确定性、替代方案、验证与闭环。", "deep": "挑一个有明确闭环的项目，不要只讲宏观方案。面试官通常会追问最困难工况、 为什么改结构、变更前后数据、验证次数、交付状态。提前准备失败案例比只准备成功案例更重要。", "source": "10月8日45题复习稿 · 第23题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q024", "q": "为什么读 MBA？", "short": "从技术岗位走向项目/团队管理，需要系统补充资源配置、组织协同、成本和商业决策。", "deep": "读 MBA 的价值是从研发任务管理延伸到成本、项目资源、跨部门协调与产品决 策；周末学习安排可说明不会影响正常工作。不要把 MBA 当作技术能力的替代品。", "source": "10月8日45题复习稿 · 第24题 / 阿里晓天衡宇二面准备 · 第29题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q025", "q": "怎么证明设计能落地？", "short": "量化指标→计算/仿真→关键技术试验→样机→系统测试→环境和可靠性验证→问题闭环。", "deep": "技术可行性、工程可制造性和产品可交付性是三个层次。建立设计验证计划 DVP：功能、强度、刚度、温升、寿命、环境、维护性，明确测试工况、判定标准和整改闭环。", "source": "10月8日45题复习稿 · 第25题", "type": "历史复盘归纳", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "准备一个可核实的项目实例：设计输入、个人职责、关键技术决策、失败与整改、最终验证数 据。管理类问题要有具体分工与闭环机制。 四、伽利略机器人｜基于 JD 的预测题", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q026", "q": "四足机器人从零设计怎么做？", "short": "需求（重量、载荷、地形、速度、续航）→构型与自由度→运动学→动力学→关节选型→结构→仿 真→单关节/单腿/整机测试。", "deep": "整机需求要量化：质量、负载、越障、速度、坡度、续航、IP 等级、成本。先建 运动学模型和质心/足端工作空间，再估算 GRF 及关节峰值/连续扭矩，反向影响腿长、电机减速器、散热和电 池配置。最后通过单腿台架、整机步态和耐久测试验证。", "source": "10月8日45题复习稿 · 第26题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q027", "q": "为什么每腿常用 3 自由度？", "short": "髋外展内收、髋俯仰、膝俯仰，使足端能在三维空间定位；自由度数量取决于任务与成本。", "deep": "三自由度腿通常是髋外展/内收+髋俯仰+膝俯仰，足端位置在三维空间可控；足端 姿态不一定独立可控。多自由度提高灵活性但增重、增成本并增加控制复杂度；自由度应由任务决定。", "source": "10月8日45题复习稿 · 第27题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q028", "q": "关节扭矩怎么计算？", "short": "静态用力臂；多关节静力 τ=JᵀF，动态还需惯性、科氏、重力项和冲击。依据最不利姿态区分峰值 与连续。", "deep": "静态关节扭矩可由 τ=JᵀF 估算；动态完整表达还包含 M(q)q¨、C(q,q˙)q˙和 g(q)。 选型时需覆盖跳跃着地冲击、坡道、转弯、单/双腿支撑以及连续热工况；峰值扭矩不能长期输出。", "source": "10月8日45题复习稿 · 第28题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q029", "q": "40kg 四足单腿支撑力多大？", "short": "单腿独自静态支撑全部重量时竖向反力约 392N；四腿均匀约 98N/腿；实际随重心、步态、动态变 化。", "deep": "40 kg 整机重量约 392 N。四腿均匀静态支撑每腿约 98 N，两腿均匀约 196 N，单 腿静态承担全部约 392 N。若某关节有效力臂 0.15 m，对应静态扭矩约 58.9 N·m；实际还需姿态、动态和负 载系数，不能把该数作为最终选型。", "source": "10月8日45题复习稿 · 第29题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q030", "q": "四连杆膝关节优势？", "short": "可将电机布置近端、减小远端惯量；但增加铰点、间隙和装配复杂度，传动比随角度变化。", "deep": "四连杆膝部可把驱动器布置在靠近躯干位置，降低远端摆动惯量；但会产生位置 相关传动比，铰接点多、摩擦和间隙难控制。用虚功关系 Tm dθm≈Tk dθk 推导力矩变换，加入效率后再计 算。", "source": "10月8日45题复习稿 · 第30题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q031", "q": "腿部如何轻量化？", "short": "优化载荷路径、截面、材料和连接；关注刚度、疲劳、模态和远端惯量 I≈Σmr²。", "deep": "轻量化先识别载荷路径和刚度敏感位置。结构有限元看应力、变形和模态；拓扑 优化结果需再做工艺重构、连接优化和复核。远端质量对惯量贡献按 mr² 放大，优先优化小腿和足端质量。", "source": "10月8日45题复习稿 · 第31题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q032", "q": "电机和减速器如何选？", "short": "按关节峰值/连续扭矩、速度、运动周期、效率、反驱性、温升、重量、寿命匹配。", "deep": "确定输出扭矩-速度包络后，结合减速比 i 和效率 η 估算电机扭矩 Tm≈Tout/(iη)、 电机转速 nm≈i nout。校核连续 RMS 扭矩、峰值持续时间、反电动势/电压、减速器冲击额定及热容量；还 要看编码器、制动和线束接口。", "source": "10月8日45题复习稿 · 第32题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q033", "q": "谐波、行星、RV 区别？", "short": "谐波紧凑高减速比但有柔性；行星高效率、成熟且单级速比有限；RV 高刚度承载、通常较重。", "deep": "谐波高减速比和紧凑，但柔轮疲劳及扭转柔性需要关注；行星传动高效率、方案 成熟，适合准直驱；RV 常用于重载高刚度场景。具体选择取决于冲击、回驱、重量、回差、成本和寿命。", "source": "10月8日45题复习稿 · 第33题", "type": "伽利略JD预测", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q034", "q": "关节轴承怎么选？", "short": "径向/轴向/倾覆载荷、刚度、寿命、预紧、空间、精度与热膨胀综合评估。", "deep": "先画轴系受力图，分离径向、轴向和倾覆载荷，考虑支承跨距。根据载荷谱选择 轴承类型、寿命、预紧及配合；轴承额定寿命只是起点，还要校核刚度、润滑、污染和温升。", "source": "10月8日45题复习稿 · 第34题", "type": "伽利略JD预测", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q035", "q": "交叉滚子轴承优点？", "short": "紧凑空间承受复合载荷与倾覆力矩、刚度高；需关注安装面、预紧和实际型号参数。", "deep": "交叉滚子轴承在单一紧凑结构中可承受径向、轴向和倾覆载荷，常用于关节输出 支承。但必须重视安装面平面度、同轴度、预紧与螺栓固定，否则理论刚度无法实现。", "source": "10月8日45题复习稿 · 第35题", "type": "伽利略JD预测", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q036", "q": "关节温升高怎么排查？", "short": "记录转速、扭矩、电流、温度、运行时间；对比空载负载、正反转，分辨电机、减速器、轴承预 紧、润滑和密封。", "deep": "先在相同工况下测空载/负载电流、转速、扭矩和温升曲线。拆分电机铜铁损、齿 轮啮合、轴承、密封和控制振荡；通过不同转速/载荷下的温升特征定位，验证后再改预紧、润滑、结构或散 热。", "source": "10月8日45题复习稿 · 第36题", "type": "伽利略JD预测", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q037", "q": "关节回差/异响怎么办？", "short": "检查减速器间隙、连接松动、轴承游隙、同轴度、齿轮啮合、控制振荡，使用振动频谱和工况对 比。", "deep": "先确定异响频率与转速关系、正反转差异、空载负载差异。回差可来自齿隙、减 速器弹性、键连接松动或轴承游隙；控制振荡也会产生类似机械异常，需结合电流、编码器和振动频谱判断。", "source": "10月8日45题复习稿 · 第37题", "type": "伽利略JD预测", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q038", "q": "ANSYS 流程？", "short": "几何简化→材料→接触→网格→载荷约束→求解→强度刚度→网格敏感性→试验验证。", "deep": "明确分析目标与失效准则，正确设置材料、接触、约束和载荷。局部高应力先检 查尖角奇异性和网格收敛；结构强度之外还看变形、疲劳和模态。用应变片或加载试验验证模型。", "source": "10月8日45题复习稿 · 第38题", "type": "伽利略JD预测", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q039", "q": "腿部有限元载荷怎么设？", "short": "按足端地面反力、最不利姿态、关节扭矩和实际连接关系施加，避免不真实的完全固定约束。", "deep": "不能简单把腿根固定、在足端施加一个任意向下力就称为真实工况。应从足端 GRF、姿态、驱动器力矩和接触边界出发，设置落地冲击、最大伸展、侧向力和跌倒等工况；必要时进行多体 动力学联合分析。", "source": "10月8日45题复习稿 · 第39题", "type": "伽利略JD预测", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 3, "tags": []}, {"id": "Q040", "q": "强度够为什么还校核刚度？", "short": "变形会影响足端精度、轴承支撑、齿轮啮合和结构动态性能。", "deep": "强度决定是否屈服或断裂，刚度决定载荷下变形与精度。机器人腿部刚度不足会 影响足端定位、齿轮啮合、轴承受力和控制性能；要同时校核结构变形、关节扭转刚度和模态。", "source": "10月8日45题复习稿 · 第40题", "type": "伽利略JD预测", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q041", "q": "6061 与 7075 怎么选？", "short": "6061 综合工艺、耐腐蚀与成本好；7075-T6 强度高，但焊接、耐腐蚀、成本等需权衡。", "deep": "6061-T6 通常加工、焊接和耐腐蚀综合较好；7075-T6 强度更高但成本、耐蚀及焊 接等方面需权衡。相同几何下两者弹性模量相近，换 7075 不意味着刚度显著增加。还需看阳极氧化、疲劳和 加工变形。", "source": "10月8日45题复习稿 · 第41题", "type": "伽利略JD预测", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q042", "q": "关节装配卡滞怎么办？", "short": "分步拆解定位，检查尺寸公差链、同轴度、轴承预紧、紧固变形、润滑及装配顺序。", "deep": "按装配工序逐级隔离：单独转动轴承→装配壳体→安装减速器→连接电机，测每 一步摩擦力矩。重点测同轴度、轴承座过盈、预紧、垫片厚度和端面平行度，避免盲目打磨关键配合面。", "source": "10月8日45题复习稿 · 第42题", "type": "伽利略JD预测", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q043", "q": "供应商做不到公差怎么办？", "short": "先区分关键功能尺寸，优化定位基准、结构和工艺，必要时改后加工；非关键公差验证后放宽。", "deep": "先确认尺寸功能：配合、啮合、定位或外观。做公差链和过程能力评估，能改定 位基准或装配方式就优先改；不能放宽功能关键公差时，应优化加工路线、检具或供应商能力。变更需图纸与 检验标准同步。", "source": "10月8日45题复习稿 · 第43题", "type": "伽利略JD预测", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q044", "q": "样机好、批量出问题怎么办？", "short": "批次隔离→尺寸与工艺数据→根因→整改→重复验证→图纸/工艺/质检更新。", "deep": "用 8D 或类似流程：隔离风险批次、建立不良数据、复现故障、分析人机料法环 测、验证根因、永久整改、更新控制计划。小批量不良往往来自尺寸分布、工装定位、扭矩控制和供应商批次 差异。", "source": "10月8日45题复习稿 · 第44题", "type": "伽利略JD预测", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q045", "q": "装配工艺和质检规范怎么制定？", "short": "定义装配顺序、工装、关键定位、紧固扭矩、测量方法、合格标准、记录追溯和返工规则。", "deep": "装配文件至少含 BOM、工艺路线、定位基准、关键扭矩、润滑与锁固要求、检 具、检验频次、合格判据和追溯字段。关节终检可包含空载阻力矩、回差、噪声、温升、零位与密封等项目， 阈值需由设计要求与验证确定。", "source": "10月8日45题复习稿 · 第45题", "type": "伽利略JD预测", "category": "量产质量与失效分析", "steps": [], "pitfalls": "", "followups": "准备画简图并说明：工况假设、载荷路径、选型依据、制造公差、验证方法及潜在失效模式； 数值算例必须说明是假设值。", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q046", "q": "请你选一个最能代表你能力的项目，从需求到最终落地完整讲一遍。", "short": "我会优先讲一个真正完成样机和现场验证的复杂装备项目。先说明工况和目标，再讲总体方案为什 么这样定；然后拆到传动、轴系、结构、密封等关键模块，说明我亲自负责的计算、选型和结构设计；之后讲 加工、装配、测试过程中出现的问题，以及如何定位根因、修改设计并重新验证。重点不是只展示最终方案， 而是把 需求 方案 设计 制造 装配 测试 整改 的闭环讲清楚。 “ — — — — — — ”", "deep": "考察重点：项目真实性、系统思维、个人贡献、工程闭环。", "source": "阿里晓天衡宇二面准备 · 第1题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q047", "q": "如果现在让你从 0 开始设计一台具身智能移动机器人，你第一步做什么？", "short": "第一步不是直接画结构，而是冻结第一版需求边界：任务、负载、工作空间、运动速度、续航、尺 寸重量、环境、精度、安全和成本。然后做整机架构，把移动底盘、机械臂、升降机构、传感器、电池和计算 单元进行模块划分；再做质量和重心预算、极限姿态稳定性、接口和载荷定义。之后才进入关键部件选型和详 细结构设计，并提前定义机械 电— —子 软件接口以及样机验证计划。", "deep": "考察重点：需求拆解、总体架构、系统工程意识。", "source": "阿里晓天衡宇二面准备 · 第2题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q048", "q": "结构团队人很少，如果让你独立负责机械方向，你怎么推进？", "short": "我可以从总体机械方案开始承担，到模块拆分、关键计算、三维结构、工程图、BOM、供应商加 工、装配和测试闭环。前期人少时，我会优先冻结系统接口和长周期件，成熟模块尽量选型，关键自研结构集 中精力解决；同时建立设计评审、问题清单和版本管理。团队扩大后，再把工作拆成整机、执行机构、结构件 等模块，并建立设计规范和复盘机制。", "deep": "考察重点：独立承担能力、项目管理、早期团队适应性。", "source": "阿里晓天衡宇二面准备 · 第3题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q049", "q": "如果要求一个月出第一版样机，你怎么做？", "short": "先明确 MVP，只验证最关键功能，不追求第一版所有指标都最优。识别最大的技术风险和长周期 件，优先采购电机、减速器、导轨、传感器等标准件；机械接口尽早冻结，结构件根据功能分别采用 3D 打 印、CNC 或钣金。各模块并行设计、分模块测试，最后整机集成。第一版目标是尽快暴露问题，测试后形成问 题清单和第二版迭代计划。", "deep": "考察重点：快速打样、MVP、项目节奏。", "source": "阿里晓天衡宇二面准备 · 第4题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q050", "q": "机械怎么和算法、控制、电气团队协同？", "short": "不能只说沟通。我会把接口工程化：机械提供坐标系、安装基准、运动范围、负载、刚度、限位、 线束路径和传感器安装位置；控制侧提供运动曲线、峰值速度加速度、控制周期和安全策略；算法侧明确感知 视场、标定需求和末端精度。接口在早期形成文档，关键接口评审后冻结，避免后期各模块互相改。", "deep": "考察重点：跨专业接口定义、系统集成。", "source": "阿里晓天衡宇二面准备 · 第5题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q051", "q": "算法团队反馈机器人末端定位误差很大，你怎么排查？", "short": "先把误差分层：重复定位误差、绝对定位误差和随姿态变化的误差。机械侧检查关节回差、轴承游 隙、结构刚度、装配同轴度和接口变形；传感器侧检查安装刚度、零位和坐标系；系统侧再看标定模型、控制 参数和算法。通过重复实验和分模块测量逐层隔离，而不是直接修改结构。", "deep": "考察重点：系统排障，不把所有问题都归因于机械。", "source": "阿里晓天衡宇二面准备 · 第6题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q052", "q": "机械臂安装在移动底盘上，你重点考虑什么？", "short": "首先看最危险姿态，而不是静止状态。需要计算机械臂最大伸展时的重心位置、倾覆力矩和动态惯 性载荷；同时考虑底盘安装面刚度、机械臂反力传递、升降机构刚度、线束运动空间、传感器视野和维修空 间。必要时通过加宽轮距、降低重心、限制工作空间或做软件姿态限制提高稳定性。", "deep": "考察重点：整机集成、稳定性。", "source": "阿里晓天衡宇二面准备 · 第7题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q053", "q": "为什么从复杂装备转到具身智能？", "short": "我的职业主线没有离开机械研发。过去一直在做复杂机械系统、执行机构和 0 到 1 装备研发，积累 了传动、结构、样机和现场闭环能力。具身智能对机械本体、执行机构、精度和机电协同提出更高要求，我希 望下一阶段把已有工程能力集中到机器人本体，并形成长期的机器人产品经验。", "deep": "考察重点：职业动机、长期稳定性。", "source": "阿里晓天衡宇二面准备 · 第8题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q054", "q": "你没有多年机器人本体经验，为什么认为自己能胜任？", "short": "成熟机器人量产经验确实是我的短板，我不会回避。但我需要补的是机器人行业特定产品经验，而 不是从头学习机械工程。我已经具备复杂机械系统、传动执行机构、结构分析、加工装配、样机测试和问题闭 环的完整经验，也做过机械腿相关前期研发。这些底层方法可以迁移到机器人本体。", "deep": "考察重点：短板认知、能力迁移。", "source": "阿里晓天衡宇二面准备 · 第9题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q055", "q": "你来了以后希望承担什么角色？", "short": "前期团队人少，我希望承担相对完整的机械研发责任，而不是只负责出图：包括整机机械方案、关 键模块设计、接口定义、供应商加工、样机装配测试和问题闭环。随着团队扩充，我也可以结合已有研发管理 经验参与设计评审、规范建立和新人培养。", "deep": "考察重点：岗位预期、责任边界。", "source": "阿里晓天衡宇二面准备 · 第10题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q056", "q": "你怎么判断一个机械方案是 好方案 ？ “ ”", "short": "不是只看强度。至少同时看功能、刚度/精度、可靠性、重量、制造性、装配性、维护性、成本和迭 代速度。早期原型更强调快速验证，产品化阶段则提高一致性、可靠性和可制造性。方案选择要围绕当前阶段 最重要的指标做权衡。", "deep": "考察重点：工程权衡。", "source": "阿里晓天衡宇二面准备 · 第11题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q057", "q": "讲一个你设计失败或现场出问题的案例。", "short": "回答时不要包装成没有失败。按 现“ — — — — — — — 象 复现 假设 数据 根因 临时措施 永久整改 验 证 讲。 ” 强调先恢复现场，再回到设计端修改结构、材料、公差或工艺，并把经验沉淀到后续设计规范中。", "deep": "考察重点：复盘能力、责任意识。", "source": "阿里晓天衡宇二面准备 · 第12题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q058", "q": "机器人关节从零开始怎么设计？", "short": "先由整机质量、末端负载、连杆长度和运动加速度得到关节峰值/连续扭矩和转速，再确定电机、减 速器和传动比；之后设计轴承支撑、输出法兰、编码器、壳体、限位和线束。最后做强度、刚度、热和寿命校 核，并通过关节台架验证。", "deep": "考察重点：载荷反推与关节架构。", "source": "阿里晓天衡宇二面准备 · 第13题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q059", "q": "谐波减速器和行星减速器怎么选？", "short": "谐波减速器减速比大、结构紧凑、回差小，适合高精度机器人关节，但柔轮带来柔性和寿命等问 题；行星减速器承载和效率高、刚度好、工程成熟，但同等大减速比通常需要多级。最终按扭矩、速度、回 差、刚度、寿命、尺寸和成本选。", "deep": "考察重点：传动选型。", "source": "阿里晓天衡宇二面准备 · 第14题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q060", "q": "轴承为什么要预紧？预紧过大有什么后果？", "short": "预紧用于消除游隙、提高刚度和旋转精度。过小会产生窜动和刚度不足；过大会增加摩擦和温升、 降低寿命，严重时卡滞。需要结合轴承类型、安装配合、温升和厂家预紧要求确定。", "deep": "考察重点：轴承工程基础。", "source": "阿里晓天衡宇二面准备 · 第15题", "type": "岗位模拟题", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q061", "q": "DB、DF、DT 分别有什么特点？", "short": "DB 背对背支撑跨距大、抗倾覆力矩和刚度好；DF 面对面对安装误差更宽容，但抗力矩能力通常较 弱；DT 串联用于提高单方向轴向承载能力。", "deep": "考察重点：角接触轴承配置。", "source": "阿里晓天衡宇二面准备 · 第16题", "type": "岗位模拟题", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q062", "q": "齿轮 6 级、7 级、8 级怎么理解？", "short": "常见 ISO/GB 体系下数字越小精度越高，即 6 级高于 7 级，7 级高于 8 级。工程机械低速重载闭式传 动常见 7～9 级范围，机器人精密传动可能要求更高，但必须结合标准、转速、噪声、回差和加工能力确定。", "deep": "考察重点：齿轮精度。", "source": "阿里晓天衡宇二面准备 · 第17题", "type": "岗位模拟题", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q063", "q": "齿轮精度高是不是齿侧间隙一定小？", "short": "不是。精度等级主要约束齿距、齿形、齿向等制造误差；齿侧间隙还受齿厚、中心距、温升、润滑 和装配要求影响。不能把精度等级和背隙直接等同。", "deep": "考察重点：概念辨析。", "source": "阿里晓天衡宇二面准备 · 第18题", "type": "岗位模拟题", "category": "齿轮与减速器", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q064", "q": "怎么保证两个轴承孔的同轴度？", "short": "结构上尽量统一基准和一次装夹加工，必要时同镗或精加工；设计中明确基准和同轴/位置要求；装 配时利用止口、定位肩等稳定定位。避免依赖普通螺栓孔来保证精确位置。", "deep": "考察重点：加工与基准。", "source": "阿里晓天衡宇二面准备 · 第19题", "type": "岗位模拟题", "category": "轴承与轴系", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 3, "tags": []}, {"id": "Q065", "q": "定位销和螺栓分别干什么？", "short": "定位销、止口等主要承担精确定位和重复装配位置；螺栓主要提供夹紧力。普通螺栓孔存在间隙， 不能默认靠螺栓杆精确定位。", "deep": "考察重点：装配定位。", "source": "阿里晓天衡宇二面准备 · 第20题", "type": "岗位模拟题", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q066", "q": "钢螺栓连接铝合金壳体要注意什么？", "short": "关注铝螺纹强度、接触面压溃、热膨胀差、预紧力松弛以及电偶腐蚀。必要时增加螺纹啮合长度、 钢丝螺套/衬套、垫片或表面隔离，并根据铝件承载能力确定拧紧力矩。", "deep": "考察重点：异种材料连接。", "source": "阿里晓天衡宇二面准备 · 第21题", "type": "岗位模拟题", "category": "公差装配与机械基础", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q067", "q": "机器人结构为什么特别关注刚度？", "short": "强度够不代表精度够。串联机器人各级变形会累积到末端，结构挠度、关节扭转刚度和连接刚度都 会影响末端定位和控制性能，因此很多机器人结构是刚度先成为约束。", "deep": "考察重点：刚度与精度。", "source": "阿里晓天衡宇二面准备 · 第22题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q068", "q": "ANSYS 分析你怎么做？", "short": "先从真实工况确定载荷路径，再简化几何、材料、接触、约束和载荷；关键区域网格加密并检查收 敛；结果不仅看最大 von Mises 应力，还看变形、接触压力、反力和载荷路径。最后必须和理论估算或样机测 试交叉验证。", "deep": "考察重点：CAE 工程化。", "source": "阿里晓天衡宇二面准备 · 第23题", "type": "岗位模拟题", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q069", "q": "模态分析有什么用？", "short": "得到固有频率和振型，用于判断工作激励是否接近结构固有频率。如果接近，需要通过改变刚度、 质量分布、连接方式或控制激励频率来避开共振。", "deep": "考察重点：振动基础。", "source": "阿里晓天衡宇二面准备 · 第24题", "type": "岗位模拟题", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q070", "q": "3D 打印、CNC、钣金怎么选？", "short": "3D 打印适合快速验证外形、装配和低载荷复杂结构；CNC 适合高精度、高刚度关键承载件；钣金 适合框架、支架、罩壳等快速低成本结构。原型阶段根据验证目标组合使用，而不是一种工艺做到底。", "deep": "考察重点：快速制造。", "source": "阿里晓天衡宇二面准备 · 第25题", "type": "岗位模拟题", "category": "材料与热处理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q071", "q": "编码器放电机端还是输出端？", "short": "电机端容易集成，可直接用于电机控制，但无法完全反映减速器回差和弹性；输出端更接近真实关 节角度。高性能系统可能采用双编码器，分别满足电机控制和关节精度需求。", "deep": "考察重点：关节反馈。", "source": "阿里晓天衡宇二面准备 · 第26题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q072", "q": "六维力传感器安装最重要的原则是什么？", "short": "被测载荷必须完整经过传感器，避免旁路载荷；安装面需要足够刚、平整，控制螺栓预紧和坐标 系；同时考虑过载保护、线束和标定。", "deep": "考察重点：传感器机械集成。", "source": "阿里晓天衡宇二面准备 · 第27题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q073", "q": "机器人线束设计要注意什么？", "short": "关注弯曲半径、反复弯折寿命、旋转关节扭转、应力释放、固定点、磨损保护和维修更换。运动范 围验证时要检查极限姿态，避免拉紧、夹线和与运动件干涉。", "deep": "考察重点：可靠性。", "source": "阿里晓天衡宇二面准备 · 第28题", "type": "岗位模拟题", "category": "机器人本体与关节", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q074", "q": "为什么离开现在的公司？", "short": "重点讲职业方向：希望把复杂装备和执行机构经验进一步聚焦到机器人/具身智能本体，在更高集成 度、更高精度的产品环境里持续积累。不要把抱怨公司作为主线。", "deep": "考察重点：稳定性、动机。", "source": "阿里晓天衡宇二面准备 · 第30题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q075", "q": "你如何管理多项目并行？", "short": "先按业务节点、技术风险和资源约束排序，明确每个项目关键里程碑；关键路径由核心人员负责， 接口和长周期件提前冻结；通过短周期输出和风险清单跟踪，而不是只看是否加班。", "deep": "考察重点：优先级与执行。", "source": "阿里晓天衡宇二面准备 · 第31题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q076", "q": "团队里有人能力不足、进度落后怎么办？", "short": "先判断是能力、资源、需求不清还是任务拆分问题。短期保证项目节点，必要时调整任务或提供技 术支持；长期通过明确交付标准、复盘和针对性培养改善，而不是简单催进度。", "deep": "考察重点：管理成熟度。", "source": "阿里晓天衡宇二面准备 · 第32题", "type": "岗位模拟题", "category": "技术面试与研发管理", "steps": [], "pitfalls": "", "followups": "", "formula": "", "difficulty": 2, "priority": 2, "tags": []}, {"id": "Q077", "q": "你现在负责高压泵撬装产品，挑一个你最熟悉的项目，从客户压力、流量和介质需求开始，讲到泵型选择、动力配置、结构设计、生产和最终试验。", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点听具体参数、计算过程、本人职责、现场问题和最终验证，避免只讲流程。", "source": "机械工程师面试提纲 · 张成良", "type": "面试官追问题", "category": "液压与重载装备", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "其中哪些计算和结构是你本人亲自完成的？最难的技术问题是什么？；项目中有没有计算正确但实际试验不满足的情况？最后怎么定位和解决？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q078", "q": "你简历写到多级传动比分配、齿轮参数计算和强度校核。给你一个通用工况：已知输入功率、输入转速和目标输出转速，你如何从零开始设计一套减速箱？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：看是否真正掌握传动比、齿轮强度、轴系、轴承寿命、润滑及箱体设计，而不是只会调用软件。", "source": "机械工程师面试提纲 · 张成良", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "多级传动比怎么分配？齿轮模数、齿数、齿宽和材料怎么确定？；轴和轴承如何设计、选型和验算？润滑方式怎么确定？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q079", "q": "一根传动轴同时承受扭矩和径向载荷，你如何确定轴径、材料以及轴承布置？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点判断载荷分析、组合应力、轴承寿命、配合、公差、润滑、安装误差和实际工况意识。", "source": "机械工程师面试提纲 · 张成良", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "轴承寿命怎么验算？固定端和浮动端怎么布置？什么时候会考虑角接触、圆锥滚子或调心轴承？；如果轴承实际寿命明显低于计算寿命，你首先怀疑哪些因素？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q080", "q": "讲一个你亲自做过的ANSYS结构分析案例：载荷从哪里来？约束怎么定？网格怎么处理？最后怎么判断结果可信？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点看边界条件、网格、接触、应力集中、结果解释以及与理论计算/试验的交叉验证。", "source": "机械工程师面试提纲 · 张成良", "type": "面试官追问题", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "如果最大应力出现在固定约束处、尖角或接触边缘，而且数值很高，你怎么判断是否是真实危险点？；理论计算和有限元结果不一致时，你怎么处理？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q081", "q": "你简历写到升降伸缩机的新产品开发，请从市场需求开始，完整讲一下你如何把需求转化成机械方案并最终做成样机。", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点判断是否真正具备需求量化→方案对比→详细设计→选型→出图/BOM→供应商→装配调试的完整能力。", "source": "机械工程师面试提纲 · 张成良", "type": "面试官追问题", "category": "量产质量与失效分析", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "升降、伸缩和摆动三种功能的驱动方式为什么这么选？有没有比较过其他方案？；电机、减速机、齿轮/链轮、电缸等关键件怎么计算和选型？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q082", "q": "一台设备的传动轴在使用过程中反复断裂，上一版已经加粗轴径，但仍然断。你接手以后怎么排查？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：看是否覆盖冲击/偏载、疲劳、应力集中、材料热处理、加工缺陷、装配同轴度、轴承问题和真实工况。", "source": "机械工程师面试提纲 · 张成良", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "第一步需要拿到哪些现场数据？断口、材料、热处理、装配和实际载荷分别怎么看？；如果理论强度明显足够，但仍然发生断裂，你会继续查什么？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q083", "q": "加工件关键尺寸超差，但生产说重新加工会影响交期。你作为设计工程师怎么判断这个零件能不能让步接收？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功 数据和失效复盘验证结论。", "deep": "面试官重点观察：应关注剪切、弯曲、挤压、耳板净截面、孔边承压、配合间隙、表面硬度、润滑、偏载和疲劳。", "source": "机械工程师面试提纲 · 张永才", "type": "面试官追问题", "category": "轴承与轴系", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "除了销轴剪切强度，还需要校核哪些位置？耳板怎么设计？；如果现场销轴没断，但耳板孔被拉长、磨损越来越严重，你怎么分析？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q088", "q": "一个重载焊接结构静强度计算完全合格，但使用一段时间后焊趾附近反复开裂，你会怎么分析？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点验证疲劳方向是否真正扎实：载荷谱、应力集中、焊接细节、残余应力、热点应力/名义应力、结构过渡和验证思路。", "source": "机械工程师面试提纲 · 张永才", "type": "面试官追问题", "category": "材料与热处理", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "为什么静强度合格仍然可能疲劳开裂？焊缝附近做有限元时有什么需要特别注意？；如果让你改结构，你会优先从哪些方向入手？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q089", "q": "讲一个你亲自做过的有限元分析案例。载荷怎么得到？约束怎么施加？网格怎么划？最终结果如何和实际试验对应？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：重点看边界条件、单元选择、网格敏感性、接触处理、结果解释和试验验证。", "source": "机械工程师面试提纲 · 张永才", "type": "面试官追问题", "category": "仿真强度与可靠性", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "如果最大应力出现在固定约束点、尖角或接触边缘，而且数值特别高，你怎么判断是真实危险点还是数值奇异？；什么时候必须做网格收敛？什么时候梁单元、壳单元比实体单元更合适？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q090", "q": "现场一个连接件反复断裂，上一版已经把尺寸加粗了，但仍然断。你接手以后怎么排查？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep": "面试官重点观察：合理路径应覆盖真实载荷、冲击/偏载、断口、材料和热处理、加工缺陷、装配、应力集中、疲劳、边界条件以及工况复现。", "source": "机械工程师面试提纲 · 张永才", "type": "面试官追问题", "category": "液压与重载装备", "steps": [], "pitfalls": "只有泛泛的项目管理描述，不能给出本人计算、实物结构和验证数据。", "followups": "第一批需要拿到哪些现场信息？断口你会看什么？；如果计算载荷远低于理论承载能力，但现场仍然断，你下一步怀疑什么？", "formula": "", "difficulty": 3, "priority": 2, "tags": []}, {"id": "Q091", "q": "你过去主要做起重机和高空作业平台。现在给你一台微型桩钻机：先打φ130中心孔，再扩到φ400，孔深10 m以上，岩石最高约150 MPa。你没做过这个产品的话，接手后第一步怎么开展？", "short": "回答框架：①先澄清工况与边界；②建立载荷/运动/功率模型；③说明关键计算、结构选型及制造方案；④以试验、现场数据和失效复盘验证结论。", "deep":
