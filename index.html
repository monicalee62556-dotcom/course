intro('B01','先认识一台机器：动力从哪里来，传到哪里去','从电机、泵、马达、齿轮、轴到轴承，先看懂各零件在做什么。',['电机','液压泵','液压马达','减速器','主轴','轴承'],'chain',
'把机器想成一队接力的人。电机从电源获得能量，液压泵把机械能送进油液，液压马达把油液的能量变回旋转；减速器改变转速和扭矩，主轴把扭矩送到工具。轴承像扶住转轴的手，让轴转起来，同时把支承力传给机架。不是所有机器都同时有这些零件：电机也能直接带减速器。',
[['先找到最后做事的部件','钻机是钻头，机械臂是末端工具。先问它要转多快、受多大力，而不是先选电机型号。'],['沿着动力往回找','钻头←主轴←齿轮←马达←液压泵←电机。箭头表示能量从输入端传向输出端；支承力还会经轴承、壳体回到地面。'],['区分驱动与支承','马达负责提供转动，轴承负责支承；轴承不会因为名字里有“轴”就负责产生扭矩。普通支承轴承通常也不是把工作扭矩送到机架的部件。'],['学会看接口','每两个部件之间都要有连接：轴、联轴器、法兰或齿轮。连接既要装得上，也要传得动，并允许必要的维修。']],
['例：电机直接带齿轮减速器','输入轴 1000 rpm，减速比 5，忽略损失。','输出轴每转一圈，输入轴要转 5 圈。','因此输出转速=1000÷5=200 rpm。','这是转速关系，还不能凭转速算出扭矩；还需要输入扭矩或功率。'],
['轴承主要做什么？',['给主轴提供无限扭矩','支承轴并允许它按设计运动','自动提高电机功率'],1,'轴承主要传递支承载荷并约束不希望出现的位移。动力来自驱动装置。']);
intro('B02','力和扭矩：为什么扳手长一点就省力','用开门、拧螺母理解 N、N·m、力臂与受力方向。',['力','扭矩','力臂','质量'],'lever',
'推门时，靠近门轴推很费力，推门把手就轻松。相同的力，因为到门轴的垂直距离不同，产生的转动作用不同。力描述推拉，扭矩描述让物体绕某一轴转动的作用。质量用 kg 表示，力用 N 表示，不能直接把“10 kg”写成“10 N”。',
[['先确定转轴','门轴、螺栓中心线就是转轴。扭矩必须相对于一个指定轴来讨论。'],['找垂直力臂','力臂是转轴到力的作用线的最短距离。只有力与扳手垂直时，扳手长度才等于力臂。'],['写公式与单位','T=F×r，F 用 N、r 用 m，结果才是 N·m。一般方向下 T=F×l×sinθ。'],['把质量转成重力','地面附近静止物体的重力近似 F=m×9.81。10 kg 约为 98.1 N；动态冲击另算。']],
['例：用扳手拧螺母','扳手长 200 mm，在末端垂直施加 50 N。','200 mm÷1000=0.2 m。','T=50×0.2=10 N·m。','换成 400 mm 扳手，保持相同 10 N·m 时只需 F=10÷0.4=25 N。'],
['50 N 垂直作用在 0.3 m 力臂上，扭矩是多少？',['15 N·m','150 N·m','0.006 N·m'],0,'50×0.3=15 N·m。先确认力的方向和力臂，再相乘。']);
intro('B03','转速、角度、功率：转得快不等于劲大','看懂 rpm、度、弧度、kW，以及功率守恒。',['转速','弧度','功率','效率'],'power',
'自行车低挡上坡时蹬得快、轮子转得慢，但轮子获得的转动作用更大。齿轮可以交换速度与扭矩，能量却不会凭空增加。功率描述每秒传递多少能量；只给“7000 N·m”而不给转速，还不能确定需要多少功率。',
[['认识转速','20 rpm 就是每分钟转 20 圈，不是每秒 20 圈。换成每秒转数需除以 60。'],['认识角度单位','一整圈=360°=2π rad。公式中的角速度一般是 rad/s，因此 ω=2πn/60。'],['连接扭矩与功率','P=Tω。用 T 的 N·m 和 n 的 rpm 表示，可写 P(kW)=Tn/9550；9550 是单位换算系数的近似值。'],['考虑效率','若输入功率为 10 kW、效率 0.9，输出功率约 9 kW，约 1 kW 变成热等损失。减速比不会创造额外功率。']],
['例：100 N·m、60 rpm 的轴','角速度=2π×60÷60=6.283 rad/s。','功率=100×6.283=628.3 W。','换成 kW：628.3÷1000≈0.628 kW。','快速核对：100×60÷9550≈0.628 kW，与前面一致。'],
['扭矩不变，转速翻倍，机械功率会怎样？',['减半','不变','翻倍'],2,'P=Tn/9550。扭矩不变时，功率与转速成正比，但驱动必须有能力提供它。']);
intro('B04','压力、流量、排量：液压系统的三个基本量','压力差决定转动作用，流量与排量共同决定转速。',['压力','压差','流量','排量'],'hydraulic',
'水管的类比能帮助入门：压力像推动水前进的条件，流量是每分钟流过多少水。液压系统用油传递能量，负载与控制共同决定实际工作压力。排量是马达理论上转一圈需要的油液体积。把排量想成每转一圈要“吃掉”的一杯油，杯子越大，同样供油量下转得越慢。',
[['压力要看两端','马达入口 18 MPa、出口 2 MPa，真正起作用的压差是 16 MPa。额定压力只是元件允许能力之一，不是每时每刻都达到它。'],['流量是每分钟的体积','60 L/min 表示每分钟通过 60 升。流量进入两条并联支路后，应分别检查支路流量，不可每条都算 60。'],['排量是每圈的体积','300 mL/r=0.3 L/r。理想情况下 30 L/min÷0.3 L/r=100 r/min。'],['功率把它们连起来','液压功率 P(kW)=Δp(MPa)×Q(L/min)÷60。压力和流量都要对应同一段回路。']],
['例：300 mL/r 马达','单台供油 30 L/min，假设无泄漏。','先把 300 mL/r 换成 0.3 L/r。','n=30÷0.3=100 rpm。','若容积效率是 0.9，实际转速估为 100×0.9=90 rpm。'],
['入口 20 MPa，出口 3 MPa，马达压差是多少？',['23 MPa','17 MPa','20 MPa'],1,'压差=入口压力−出口压力=20−3=17 MPa。']);
intro('B05','先过单位关：mm、μm、MPa 为什么最容易算错','掌握六组常见换算，并养成先写单位再代数的习惯。',['单位换算','压力','排量','弧度'],'units',
'工程计算中，公式常常没背错，却因为 mm 当成 m、度当成弧度而差了 1000 倍。每次计算都先写“已知量＋单位”，再选择一套一致的单位。可以统一成国际单位，也可用经过推导的工程单位公式，但不能混用。',
[['长度','1 m=1000 mm；1 mm=1000 μm。40 μm=0.040 mm；μm 是微米，常用来表达轴承游隙与精密配合。'],['体积与排量','1 L=1000 mL；1 mL=10⁻⁶ m³。因此 321.5 mL/r=321.5×10⁻⁶ m³/r。不要把长度的换算直接套给体积。'],['压力和扭矩','1 MPa=10⁶ Pa=1 N/mm²；1 N·m=1000 N·mm。扭矩公式中直径用 mm 时，扭矩通常要用 N·mm。'],['角度与功率','弧度=度数×π/180；1 kW=1000 W；1 rpm 对应 2π/60 rad/s。算完后回看数量级是否合理。']],
['例：把 0.1° 转成弧度','角度 0.1°，半径 0.5 m。','0.1×π÷180≈0.001745 rad。','小角度位移≈0.5×0.001745=0.0008727 m。','换成 mm：0.0008727×1000≈0.873 mm。直接用 0.1 代替弧度会错约 57.3 倍。'],
['0.035 mm 是多少 μm？',['0.035 μm','35 μm','3500 μm'],1,'毫米变成微米乘 1000：0.035×1000=35。']);
intro('B06','轴承、游隙、预紧：为什么既不能松也不能硬顶','先认识内圈、外圈、滚动体，再理解安装与温升。',['轴承','游隙','预紧','过盈配合'],'bearing',
'滚动轴承通常由内圈、外圈、滚动体和保持架组成。轴与内圈配合，壳体与外圈配合，球或滚子在滚道之间滚动。“游隙”是内部允许的相对移动，不是肉眼看到的壳体缝隙。“预紧”是装配时建立内部载荷，常用于需要高刚度的成对角接触轴承等结构。',
[['看载荷方向','垂直轴线的力叫径向力，沿轴线的力叫轴向力，让轴倾倒的作用叫倾覆力矩。不同类型轴承能承受的组合不同。'],['理解松和紧','间隙太大可能导致窜动与定位误差；预紧或过盈过大可能使摩擦发热。适合的状态取决于型号和工况。'],['装配会改变游隙','把内圈压到偏大的轴上，内圈通常膨胀，内部游隙减少；外圈压入偏小孔也可能使游隙减少。过盈量不等于游隙损失量。'],['温度也会改变状态','钢制轴承内圈比外圈热时，内部游隙一般会减少；但钢轴与铝壳体的配合变化是另一层问题，不能混为一谈。']],
['例：只看简化径向游隙预算','原始游隙 40 μm，配合损失 12 μm，温差损失 8 μm。','安装后游隙=40−12=28 μm。','工作游隙≈28−8=20 μm。','正值不自动代表合格，还要与该型号和实际应用需要的工作游隙比较。'],
['安装过盈量能直接当作轴承内部游隙损失吗？',['能，两者始终一样','不能，还与套圈和轴座变形有关','只要是 C3 就可以'],1,'过盈会在多个接触零件之间引起弹性变形，必须用厂商方法或计算得到内部游隙变化。']);
intro('B07','强度、刚度、疲劳：没断也可能不合格','用尺子与回形针区分变形、屈服和反复受力失效。',['强度','刚度','疲劳','应力'],'beam',
'拿一把薄尺悬空压它，尺子可以弯得很明显却没有断：这说明刚度可能不足。再加力，尺子永久弯曲：进入屈服。反复掰回形针，单次力不大也会最终折断：这是疲劳的直观例子。三类问题需要不同的判断方法。',
[['力不等于应力','同样 1000 N，作用在粗杆与细杆上的危险程度不同。简单轴向应力 σ=F/A，载荷分布、孔和圆角还会改变局部应力。'],['强度看是否承受得住','静强度常比较计算应力与相应材料在规定状态下的允许应力。仅给材料牌号还不足以知道允许值。'],['刚度看变形是否太大','机器人末端偏差、轴承偏载、齿轮偏啮合都可能来自过大变形，即使材料没屈服也会不合格。'],['疲劳看重复载荷','要有载荷循环、平均应力、应力幅、表面与应力集中等信息。静态安全系数高不能直接证明疲劳寿命足够。']],
['例：轴向拉杆','假设均匀拉力 1000 N、横截面积 100 mm²，忽略应力集中。','平均轴向应力=1000÷100=10 N/mm²=10 MPa。','同样力改成 50 mm²，应力变成 20 MPa。','这只是平均应力示例；若有螺纹根部或交变载荷，还要单独评估。'],
['零件没断，但机械臂末端偏了 5 mm，先检查哪项？',['只查材料强度','刚度、连接和误差链','直接证明完全合格'],1,'变形与连接间隙会影响精度；没有断裂并不代表功能合格。']);
intro('B08','怎么把一道工程题拆成能学会的小步骤','先画图、列已知未知、算数量级，再验证。',['工况','边界条件','安全系数','验证'],'workflow',
'听到“设计一根承受 7000 N·m 的轴”容易急着找公式。真正的第一步是问清：它转多快、还受什么力、连续工作多久、哪里支承、材料是什么。工程题经常没有唯一答案，因为边界条件还没齐。你需要学会把缺少的信息说出来，而不是硬凑一个尺寸。',
[['画最简单的图','先画输入、输出、支点和力的方向。图不用漂亮，但要让别人知道力从哪里来，往哪里去。'],['列三张小清单','已知：数值和单位；未知：要算的结果；待确认：目前没有的数据，例如冲击、寿命、温度、允许误差。'],['先估再细算','先用简单模型算数量级，再补效率、载荷系数和真实边界。每一步写为什么使用这个公式、适用于什么条件。'],['用第二条路径核对','例如用扭矩与转速算输出功率，再用压力与流量算输入功率。若输出超过输入，先检查单位与工况是否混用。']],
['例：先检查一个不可能的需求','液压源压差 20 MPa、流量 60 L/min，目标输出 7000 N·m、40 rpm。','理想液压功率=20×60÷60=20 kW。','目标机械功率=7000×40÷9550≈29.3 kW。','即使没有损失，20 kW 也小于 29.3 kW，所以该液压源不能同时维持这组扭矩和转速。'],
['只知道主轴最大扭矩，可以马上确定全部轴承型号吗？',['可以，扭矩越大轴承越大','不可以，还缺支承载荷、转速和寿命等','可以，只看主轴直径'],1,'先求载荷路径和支反力，再结合速度、寿命、刚度、空间选择轴承。']);

lesson('T01',['排量','流量','压差','功率','减速比'],'dual',
'一台大排量马达像“大杯子”，每转一圈要消耗更多油，因此同样流量下转得慢。两台相同马达共同驱动一个输出轴时，可以通过回路安排改变每台获得的流量和压差。不过双马达并不自动更优，要比较控制复杂度、效率、均载和成本。',
[['先比较公平的条件','把总供油量、总压差、输出需求定成相同，才有资格比较单双马达。不要拿双马达用两倍流量的结果与单马达比较。'],['并联时分别分流','理想对称并联，每台约分一半总流量，并承受相近的完整压差；两台的输出扭矩经齿轮映射后相加。负载不均时不一定均分流量。'],['串联时分别分压','油依次经过两台马达，每台流量接近总流量；可用总压差要分给两台。对称均载时各约一半，因此比并联更快但单台扭矩更低。'],['回到可实现性','要核查马达是否允许串联、出口背压和泄油要求、阀切换冲击与故障工况。两台机械耦合不代表故障后仍能安全继续运行。']],
['例：用理想数看懂两挡','假设两台各 0.3 L/r，总流量 60 L/min、可用总压差 20 MPa；两台同速均载，暂不考虑效率。','并联：每台 30 L/min→30÷0.3=100 rpm；每台压差约 20 MPa。','串联：每台约 60 L/min→60÷0.3=200 rpm；每台压差约 10 MPa。','共同输出在相同减速比下：串联转速约是并联 2 倍，总扭矩约是并联一半；输入功率仍为 20 kW。'],
['同一泵站改用两台马达，输入功率会自动翻倍吗？',['会，因为马达数量翻倍','不会，仍受总压差与总流量限制','只在串联时翻倍'],1,'液压源功率由总压差和总流量决定。多马达是分配能量的方案。']);
lesson('T02',['扭矩','压差','排量','机械效率'],'motor',
'油液每推动马达转一整圈，会输入一份能量。压力差乘每圈排量就是理想每圈能量；一圈是 2π 弧度，所以再除以 2π，得到转动作用，也就是扭矩。摩擦损失使真实输出比理论值小。',
[['先弄懂每个符号','T 是轴端输出扭矩，Δp 是马达两口有效压差，V 是每转排量，ηm 是机械效率。20 MPa 必须是实际两端压差或明确的假设。'],['先做国际单位换算','20 MPa=20,000,000 Pa；321.5 mL/r=0.0003215 m³/r；0.85 无单位。'],['从能量得到公式','每圈液压能量 E=ΔpV；每圈机械做功 E=T×2π。因此理想 T=ΔpV/(2π)，实际马达输出还要乘 ηm。'],['核对模型范围','这是稳态估算。效率随工况变化，启动扭矩与连续额定扭矩还要查具体型号样本；不能把计算结果当作允许峰值。']],
['例：从头算 321.5 mL/r 马达','已知有效压差 20 MPa，假设机械效率 0.85。','每圈液压能量=20,000,000×0.0003215=6430 J。','理论扭矩=6430÷(2π)≈1023.4 N·m。','实际输出≈1023.4×0.85≈869.9 N·m。工程单位快捷式 T≈0.1592×Δp(MPa)×V(mL/r)×ηm。'],
['马达机械效率 0.85，理论扭矩 1000 N·m，实际输出约为？',['1176 N·m','850 N·m','150 N·m'],1,'马达向外输出机械能，摩擦使输出降低，因此乘 0.85。']);
lesson('T03',['减速比','转速','扭矩','效率'],'gear',
'14 齿小齿轮每转一圈，推动大齿轮经过 14 个齿。55 齿大齿轮要经过 55 个齿才转完一圈，因此小轮要转 55/14 圈。速度降低，输出扭矩增大，但损失以后输出功率比输入小。',
[['先认主动与从动','主动轮连接马达，从动轮连接主轴；本例 z1=14、z2=55。如果动力方向反过来，传动关系也会反过来。'],['算比值','本课减速比定义 i=n输入/n输出=z2/z1=55/14≈3.9286；公式的定义要保持一致。'],['分别换算速度和扭矩','n输出=n输入/i；T输出=T输入×i×ηg。两台共同驱动时，先把各支路映射到同一输出轴再相加。'],['检查方向和单位','外啮合两轮转向相反，画图时标清。转速比与齿数比无单位；扭矩的单位仍是 N·m。']],
['例：单台马达经 14/55 齿轮传动','假设输入 100 rpm、870 N·m，齿轮效率 0.97。','i=55÷14≈3.9286。','输出转速=100÷3.9286≈25.45 rpm。','输出扭矩=870×3.9286×0.97≈3315.3 N·m。两台同条件均载时合计约 6630.6 N·m；这是估算而非额定能力。'],
['减速比 4，输入转速 120 rpm，输出转速为？',['480 rpm','30 rpm','4 rpm'],1,'减速时速度除以减速比：120÷4=30 rpm。']);
lesson('T04',['并联','串联','流量','压差'],'series',
'理解串并联要同时看油路和机械连接。油路并联是两条支路，油路串联是先过一台再过另一台；这里另外假设两台马达经过传动机构共同驱动同一负载，所以两台转速受机械关系约束。只画油路、不说明输出怎样连接，结论可能不同。',
[['并联看流量和','总流量 Q总=Q1+Q2。相同马达、均载且忽略支路差别时，Q1≈Q2≈Q总/2；不是不加条件就一定平分。'],['串联看压差和','总可用压差约等于 Δp1+Δp2 加管阀损失。相同马达均载时，压差才近似各一半。'],['比较共同输出','同样排量、相同齿轮比、相同总供油条件下，串联每台流量更多，转得更快；每台分到压差更小，扭矩更低。'],['把不理想因素补回来','内泄漏、均载、出口背压和外泄油连接都会影响实际。切换时要防液压冲击和失速，需查厂商允许回路。']],
['例：先用比例理解，不急着算型号','总流量 60 L/min、两台排量均 300 mL/r，可用总压差 20 MPa；忽略损失且均载。','并联每台约 30 L/min、20 MPa：100 rpm。','串联每台约 60 L/min、10 MPa：200 rpm。','因为扭矩正比压差，串联每台扭矩约减半；两个模式的源端功率同为 20×60/60=20 kW。'],
['两台相同均载马达理想串联时，哪一项接近相同？',['每台通过的流量','每台都获得泵站完整压差','每台的输出功率等于整个泵站'],0,'忽略外泄和内泄的简化模型中，油依次通过两台，流量接近相同；总压差在它们之间分配。']);
lesson('T05',['容积效率','排量','流量','减速比'],'series',
'这道题把“每分钟送多少油”一步步换成“主轴每分钟转几圈”。先求每台马达实际拿到多少流量，再除以每圈要用的油量，然后考虑泄漏，最后通过齿轮减速。不要一步跳到约 20 或 40 rpm；结果取决于你假设的效率。',
[['写清同一组参数','两台各 321.5 mL/r，泵站总流量 60 L/min，减速比 55/14；本例另假设两种模式每台容积效率均为 0.9。'],['并联先分流','均载简化下每台 30 L/min。马达 n=1000Qηv/V；1000 是把 L 换成 mL。'],['串联用过机流量','简化模型中每台约通过 60 L/min，不是 30；用同一公式再算一次。'],['最后才算主轴','马达转速除以 3.9286。若泵实际只有 50 L/min 或效率不同，要重新代入，不能沿用结果。']],
['例：ηv=0.9 时的完整转速','并联马达 n=1000×30×0.9÷321.5≈83.98 rpm。','并联主轴 n=83.98÷(55/14)≈21.38 rpm。','串联马达 n=1000×60×0.9÷321.5≈167.96 rpm；主轴≈42.75 rpm。','若 ηv=1，主轴约为 23.75/47.50 rpm。由此可见“20/40 rpm”不是只凭齿数就能得到的固定值。'],
['并联两台均分 60 L/min 时，单台公式中的 Q 应代入多少？',['60 L/min','120 L/min','30 L/min'],2,'Q 是流经该台马达的流量，所以是 60÷2=30 L/min。']);
lesson('T06',['机械效率','容积效率','效率','功率'],'power',
'想象水车：一部分水漏过去没有推动水车，这类似容积损失；轴转起来还要克服摩擦，这类似机械损失。因此马达转速与扭矩各有一类主要效率修正，不能看见“效率”就随意相乘。',
[['容积效率作用在转速','马达实际转速 n=Qηv/V，单位一致时适用。输入的油有部分泄漏，没有变成有效转动。'],['机械效率作用在扭矩','马达 T=ΔpVηm/(2π)。液压泵则为了输出同样压力流量需要多输入机械功，扭矩估算里机械效率在分母。'],['总效率看功率','在相应稳态模型下，单元总效率 ηt≈ηvηm。齿轮、密封等下游损失要单独计入，不能重复算。'],['效率不是固定常数','它随压差、转速、油温变化。0.9 和 0.85 是本课教学假设，具体型号需查效率图和试验。']],
['例：一台马达的功率核对','压差 20 MPa、流量 30 L/min、排量 321.5 mL/r，ηv=0.9、ηm=0.85。','输入液压功率=20×30÷60=10 kW。','转速≈83.98 rpm，扭矩≈869.9 N·m；机械功率≈869.9×83.98÷9550≈7.65 kW。','10×0.9×0.85=7.65 kW，与上一行相符；两种算法可互相检查。'],
['马达理论转速 100 rpm，容积效率 0.9，估算实际转速是？',['90 rpm','111.1 rpm','85 rpm'],0,'马达容积效率通常乘在理论转速上。不要与泵的输入扭矩公式混用。']);
lesson('T07',['功率','扭矩','转速','效率'],'power',
'7000 N·m 看起来很大，但需要多大的电机还取决于转多快。慢速大扭矩可能只需要中等功率，高速同时保持大扭矩才真正“吃功率”。本题用两条独立路径检查数字能否同时成立。',
[['先算目标轴功率','把扭矩 N·m 与转速 rpm 代入 P=Tn/9550，得 kW。只给其中一个量不够。'],['再算马达端液压功率','用实际压差与总流量计算。若用的是泵出口压力，需考虑回油背压和管阀损失。'],['留出所有损失','马达容积和机械效率、齿轮效率、其他传动损失都会降低轴端功率。泵的输入电功率又高于液压输出。'],['避免拼接不同工况','本题的 20 rpm 是独立目标值，不是 T05 的必然计算结果；不要把峰值扭矩与另一个速度点硬组合。']],
['例：6630 N·m、20 rpm','目标机械功率=6630×20÷9550≈13.88 kW。','假设马达端可用总压差 20 MPa、总流量 60 L/min，则液压输入为 20 kW。','所需从马达端到主轴的总效率至少为 13.88÷20≈0.694，即 69.4%。','若示例 ηv×ηm×ηg=0.9×0.85×0.97≈0.742，可用约 14.84 kW；这只是功率可行性检查，还需核查扭矩与速度包络。'],
['6630 N·m、20 rpm 的机械功率最接近？',['1.39 kW','13.88 kW','138.8 kW'],1,'6630×20÷9550≈13.88 kW。']);
lesson('T08',['功率','效率','工况'],'power',
'同一台马达、齿轮和泵站，不能在不增加能量输入的情况下同时把速度和扭矩都提高。串联能提高速度，但可用总压差需要分配，因此扭矩会相应降低。这里先用最宽松的“无损失”模型证明边界。',
[['把两个目标同时写出','扭矩 6630 N·m，转速 40 rpm，必须在同一个持续工作点成立。'],['算绝对最低功率','机械输出 P=6630×40/9550；这是输出端需要的功率，还没算输入损失。'],['算源端上限','若可用总压差为 20 MPa、总流量 60 L/min，理想源功率只有 20 kW。实际输出只会更少。'],['选择可改变量','降低速度、降低持续扭矩、提高源功率，或明确短时储能工况。短时峰值也需要储能与元件能力证据。']],
['例：反推 40 rpm 下的扭矩上限','目标功率=6630×40÷9550≈27.77 kW，大于源端 20 kW。','即使完全无损，40 rpm 下最大扭矩也只约为 9550×20÷40=4775 N·m。','若从液压端到输出轴效率假设为 0.742，可用输出约 14.84 kW。','对应扭矩约 9550×14.84÷40≈3543 N·m；这还是功率上限，并不证明各零件都允许该工作点。'],
['20 kW 液压源能持续输出 28 kW 机械功率吗？',['能，只要减速比足够大','不能，输出还会有损失','两台马达就可以'],1,'减速器只能重分配转速和扭矩，不会创造功率。']);
lesson('T09',['压力','压差','背压'],'hydraulic',
'站在泵出口看见的压力表，无法告诉你马达出口也有多大压力。推动马达做功的是两端压力差；油经过阀、过滤器、管路都会消耗一部分压差，回油也不一定是零压力。',
[['给压力点命名','泵出口记 p泵，马达入口 pA，马达出口 pB。测量时注明位置、转向、转速、负载和油温。'],['先算入口可用压力','泵到马达之间的损失会使 pA 小于泵出口压力；切勿直接拿溢流设定值代入所有工况。'],['再扣出口背压','马达有效压差 Δp=pA−pB。反向运行时进出口角色改变，应按实际高低压口定义。'],['带回扭矩公式','其他条件相同时，压差减少 10%，稳态扭矩估算也约减少 10%；启动、效率变化需另查。']],
['例：压力表读数怎样变成扭矩条件','泵出口 21 MPa，进油管阀损失 1 MPa，马达出口背压 2 MPa。','马达入口 pA=21−1=20 MPa。','有效压差=20−2=18 MPa，而不是 21 MPa。','同样排量和效率下，18/21≈0.857；若误用 21 MPa，预测扭矩会明显偏高。'],
['马达两口分别 19 MPa 与 2 MPa，扭矩计算用哪个压力？',['21 MPa','19 MPa','17 MPa'],2,'应使用有效压差 19−2=17 MPa。']);
lesson('T10',['液压泵','排量','容积效率','机械效率'],'motor',
'液压泵与马达做的能量转换方向相反：泵吃进机械功，把油加压送出去；马达吃进液压功，输出机械转动。因此泵的实际流量比理论小，而它需要的输入扭矩比理想值更大。型号中的排量数字应以实际样本确认，变量泵还能改变当前排量。',
[['区分最大与当前排量','以下假设泵当前排量为 28 mL/r。变量泵在小排量时流量下降，不能一直按铭牌最大排量算。'],['由转速算流量','Q=Vpnηv/1000；Vp 用 mL/r、n 用 rpm，Q 为 L/min。流量受容积损失影响。'],['由压力算输入扭矩','T输入=ΔpVp/(2πηm)，国际单位制代入。因为泵内部摩擦，输入扭矩要除以机械效率。'],['由功率检查驱动','液压功率为 ΔpQ/60，轴端输入需再除以泵总效率。电机电功率还要考虑电机效率与工作余量。']],
['例：28 mL/r、1500 rpm 泵','假设 Δp=20 MPa、ηv=0.9、ηm=0.9。','实际流量=28×1500×0.9÷1000=37.8 L/min。','输入扭矩≈20×10⁶×28×10⁻⁶÷(2π×0.9)≈99.0 N·m。','液压输出=20×37.8÷60=12.6 kW；轴输入≈12.6÷0.81=15.56 kW。这组参数本身达不到 60 L/min。'],
['泵理论流量 42 L/min、容积效率 0.9，实际约多少？',['46.7 L/min','37.8 L/min','42.9 L/min'],1,'实际排出流量=理论流量×容积效率。']);
lesson('T11',['均载','刚度','齿侧间隙','切向力'],'dual',
'两个人一起推车，不代表每人一定出一半力。两台马达推同一个大齿轮也一样：啮合间隙、安装位置、支承刚度与油路差别，会让某一支路先吃上更多载荷。平均计算只是开始，必须考虑偏载。',
[['分别画两条动力流','马达 1→小齿轮 1→大齿轮；马达 2→小齿轮 2→大齿轮。给每条支路分别标扭矩与啮合力。'],['从输出分配反推支路','均载假设各承担总输出的一半；偏载分析可先做 60/40 等敏感性工况，但该比例不是通用标准系数。'],['追查为何不均','支架变形、齿向误差、回差不同、马达效率不同、管路压降不同都可能造成偏载；机械同速不保证扭矩相等。'],['用数据验证','在可行处测两支路压差与流量，结合振动和齿面接触斑点。不要只看总输出扭矩就宣布两侧安全。']],
['例：总输出 6000 N·m 的支路检查','假设两支路传动比都为 4、各自效率 0.97。','均载时每条支路输出贡献 3000 N·m，对应马达输入≈3000÷(4×0.97)=773.2 N·m。','若某工况分配为 60/40，重载支路贡献 3600 N·m，马达需约 927.8 N·m。','相对均载增加 20%；因此只按 773.2 N·m 选型可能低估重载支路。'],
['两台马达转速相同，扭矩一定相同吗？',['一定','不一定，还取决于压差、效率与载荷分配','只要齿数一样就一定'],1,'同速由机械约束决定，扭矩由各自做功与载荷分配决定。']);
lesson('T12',['额定值','峰值','工况','背压'],'limits',
'理论算出的扭矩，回答“在这些假设下大约能输出多少”；厂家样本回答“元件允许在哪些条件下工作”。两者用途不同。BM3Y-315 的具体制造商、完整后缀、版本不明确时，不能凭型号给出一套确定的连续或峰值能力。',
[['确认精确身份','记录制造商、完整型号后缀、样本日期、排量、轴端形式、密封与泄油结构。相似名称并不保证参数相同。'],['读懂连续与短时','连续工作意味着在规定环境与冷却条件下可持续；间歇和峰值会附带时间、频率、转速、背压限制。'],['沿着工作点逐项核对','压差、流量、转速、连续扭矩、峰值持续时间、启动性能、轴端径向载荷、出口背压与壳体压力都要核查。'],['留下证据','把计算输入和数据表对应页并排保存；缺少实际样本时标记“待确认”，不能拿教学效率替代产品保证值。']],
['例：怎样读一张虚构样本','仅为读表练习：假设某马达连续允许压差 16 MPa，间歇允许 20 MPa，且间歇条件另有时间规定。','方案希望持续使用 20 MPa。','20>16，因此不能凭“间歇 20 MPa”认定可持续。','应调整持续工况，或选更适合的元件并查完整约束；这些数字不是 BM3Y-315 的实际额定参数。'],
['缺少制造商样本，能用公式证明该型号可长期承受峰值吗？',['可以','不可以，公式不等于额定能力证明','看型号数字即可'],1,'需要精确型号的额定边界、时间限制与验证证据。']);
lesson('T13',['减速比','功率','额定值'],'tradeoff',
'扭矩差一点时，看起来调一个数就够了。但升压力会增加元件载荷与发热，增排量会降低同流量下的转速，增减速比也会降低输出转速。先问“速度能不能降”，再决定怎样补扭矩。',
[['量化差多少','目标 7000、目前 6630 N·m，比值为 7000/6630≈1.0558，需要约增加 5.58%。'],['把三种改动并排看','理想近似：压差提高 5.58% 或排量提高 5.58% 或减速比提高 5.58%，都能提高相应扭矩，但约束不同。'],['检查速度和功率代价','改排量或减速比，同流量条件下输出速度会约除以 1.0558；升压则要求更多输入功率与元件承压能力。'],['再做工程选择','先核对额定和连续工作能力，再看结构空间、采购、强度、热与控制。目标必须落在同一个可持续工况上。']],
['例：只增加减速比的代价','假设当前 6630 N·m、20 rpm，效率近似不变。','所需倍率=7000÷6630≈1.0558。','新输出转速≈20÷1.0558≈18.94 rpm。','扭矩提高到了目标，速度却下降；若必须维持 20 rpm，就要补输入流量/转速与相应功率，重新检查全系统。'],
['只增大减速比、输入不变时，输出转速通常怎样？',['提高','降低','始终不变'],1,'减速比定义 i=n输入/n输出；i 增大，输出转速降低。']);


lesson('T14',['游隙','过盈配合','温差','单位换算'],'clearance',
'把游隙当成一个会被装配和温度消耗的“内部活动预算”。从原始游隙出发，先减去配合带来的变化，再减去运行温差引起的变化。但这里只是一种简化预算，游隙损失必须来自合适的计算或资料，不能把轴孔过盈直接当成游隙损失。',
[['区分三个状态','未装配是原始游隙 G0；装进轴和壳体后是安装游隙；转起来达到工作温度后是工作游隙 Gw。它们不是同一个数。'],['先算配合变化','内圈受过盈而扩张、外圈受过盈而收缩，通常使内部游隙减小。薄壁轴座、空心轴、材料弹性等会影响传递量。'],['再算热影响','内外圈温差造成滚道尺寸相对变化。应使用具体轴承的厂商方法，简单估算只用于初筛。'],['判断结果而非只看正负','Gw≈G0−ΔGfit−ΔGT。某些应用需要正工作游隙，另一些专门按预紧设计；负数是警示，不能直接当作已知预紧力。']],
['例：全部统一为 μm','假设 G0=35 μm，计算得到配合损失 14 μm，温差损失 12 μm。','安装后 G=35−14=21 μm。','工作时 Gw≈21−12=9 μm=0.009 mm。','若原始游隙有上下限，就要分别算最小和最大工作游隙；仅用平均值可能漏掉最紧组合。'],
['工作游隙公式中的配合损失应是什么？',['轴孔过盈量原样照抄','由配合变形推得的内部游隙变化','轴承外径'],1,'几何过盈与内部游隙改变不是一比一关系。']);
lesson('T15',['游隙','C3游隙','额定值'],'clearance',
'C3 是某一种径向内部游隙分组，通常比 CN 普通组大；它不是一个固定微米数，也不代表制造精度更高。型号不同、尺寸不同，C3 的上下限就可能不同。',
[['先认识完整型号','确定轴承种类、内径尺寸、制造商与后缀。深沟球、圆柱滚子等的游隙表可能不同，成对角接触结构也不应直接照搬。'],['找到正确表格','确认表头写的是未安装径向内部游隙，单位是否为 μm，以及测量载荷等适用说明。不要把轴向游隙表当径向表。'],['按尺寸段定位','按照厂商尺寸区间的边界规则选行，然后在 C3 列读最小值与最大值。边界是否“超过/至”要看表头。'],['把范围带回工作预算','用最小原始游隙减最大损失，用最大原始游隙减最小损失，检查公差组合，而不是只选中间值。']],
['例：练习读范围，不冒充真实目录','假设一张教学表对某尺寸段规定 C3 为 25～45 μm；这不是实际型号数据。','若总游隙损失可能为 15～22 μm。','最小工作游隙=25−22=3 μm；最大=45−15=30 μm。','要检查 3～30 μm 是否满足应用，不能只说“用了 C3 所以没问题”。真实值要查具体目录。'],
['C3 可以理解成所有轴承都是 30 μm 吗？',['可以','不可以，它是按类型尺寸给出的范围','只有 P5 才可以'],1,'C3 是游隙分组标识，数值范围随类型、尺寸和厂商规定变化。']);
lesson('T16',['温差','游隙','单位换算'],'thermal',
'钢制轴承的内圈更热时，内圈滚道通常向外膨胀，与外圈之间的内部活动空间减少。这里比较的是内圈和外圈的相对温度，不是只问壳体摸起来热不热；两圈一起升温与两圈产生温差是不同情况。',
[['先区分测量位置','壳体外表温度不等于外圈滚道温度，轴表面温度也不一定等于内圈温度。初算中需要注明温度是测量还是估计。'],['认识热膨胀','一维近似 ΔL=αLΔT；钢的线膨胀系数常用约 12×10⁻⁶/K 初估，实际材料和温度范围会改变它。'],['使用有范围的估算','对常见钢制滚动轴承，可作初筛：游隙减少约 ΔG(μm)≈0.012×dm(mm)×ΔT(°C)，dm=(d+D)/2。具体系列应依厂商方法。'],['不要重复扣减','温差造成内部游隙变化，与轴和壳体热胀造成的配合变化相关但不是同一个量。详细模型要分层，避免重复计算。']],
['例：内外圈差 10°C','假设 d=50 mm、D=90 mm，dm=(50+90)/2=70 mm。','内圈 60°C、外圈 50°C，ΔT=10°C。','简化热游隙损失≈0.012×70×10=8.4 μm。','若安装游隙 20 μm，工作游隙初估约 11.6 μm；该结果不包含载荷和速度等额外影响。'],
['在其他条件相同时，钢制内圈比外圈更热通常怎样影响内部游隙？',['减小','一定增大','与温差绝对无关'],0,'内圈滚道相对向外膨胀，通常使可用内部游隙减小。']);
lesson('T17',['预紧','隔套','轴向力','额定值'],'preload',
'预紧不是“用力拧紧螺母”这么简单。成对角接触球轴承或圆锥滚子轴承，通过轴向相对位置形成内部载荷。螺母是定位和夹持工具之一，真正决定轴承状态的是结构尺寸、接触关系与弹性变形。',
[['先查配对类型','配对轴承可能由厂家规定端面差或预紧等级。随机拿两只普通轴承与规定配对件不是同一回事。'],['找轴向定位链','沿轴肩→内圈→隔套→另一内圈→螺母，外圈也有自己的定位链。两条链的相对尺寸决定压缩或间隙。'],['区分定位预紧与恒力预紧','刚性隔套/端面尺寸设定属于定位预紧；弹簧等可提供一定范围的恒力预紧。两者对热伸长的响应不同。'],['按规定装配并测量','采用厂商装配步骤、测量轴向位移和启动力矩、温升。螺母扭矩还受螺纹摩擦影响，不可直接等同于轴承预紧力。']],
['例：为什么一片垫片不能随便减薄','假设某已确认结构中，垫片减薄 0.02 mm 会让预紧位移增加 0.02 mm。','0.02 mm=20 μm，这在精密轴承中可能很显著。','预紧力还取决于轴承非线性刚度，不能写成“20 μm 就是 20 N”。','应根据已知装配关系和载荷—位移曲线选择，再用测量验证；其他结构的调节方向可能相反。'],
['锁紧螺母的拧紧扭矩等于轴承预紧力吗？',['等于','不等于，单位和力传递关系都不同','在所有 DB 结构中等于'],1,'扭矩是 N·m，预紧力是 N；螺纹摩擦、结构刚度和尺寸链都参与转换。']);
lesson('T18',['预紧','刚度','启动力矩','温升'],'test',
'轴承转得动不代表预紧合适，手感“很紧”也不代表刚度足够。要把预紧状态转成可重复的测量：轴向位移、启动与运行扭矩、温度变化和振动，并且在相同工况下比较。',
[['测位移要有载荷','用规定方向和大小的轴向力加载，配合位移表或传感器；只手推一下无法知道实际刚度。记录正反向与加载卸载。'],['把密封等影响剥离','启动扭矩包括轴承、密封、润滑、传动阻力等。对比时保持密封、油脂、温度和转速条件一致。'],['温升看过程','记录环境温度与测点温度随时间的曲线，设定稳态判据。温升高不只可能是预紧大，也可能润滑或对中不良。'],['判断依据来自设计','允许窜动、摩擦扭矩、温升、振动限值应来自型号/整机设计与验证计划。没有通用“所有轴承 5 μm 都合格”。']],
['例：用增量刚度理解测量','假设轴向载荷从 100 N 增到 300 N，轴向位移增加 4 μm。','ΔF=200 N，Δx=4 μm。','该段增量刚度 k=200÷4=50 N/μm。','这不直接等于预紧力，也不代表所有载荷下刚度恒定；还要看回差、重复性和热态变化。'],
['一次测得温度偏高，能立即判定预紧过大吗？',['能','不能，需隔离润滑、对中、负载等原因','只需降低测量转速'],1,'温升是现象，必须做对照与分步隔离，才能找原因。']);
lesson('T19',['DB与DF','倾覆力矩','支点跨距','预紧'],'dbdf',
'把轴想成一根棍子，两个支承作用点离得越远，同样倾覆力矩通常越容易抵抗。成对角接触轴承的“有效支点”由接触角和接触线决定，不一定就在轴承几何中心。DB 背对背的接触线向外张成 O 形，DF 面对面向内形成 X 形。',
[['先记方向再记名字','DB：接触线向外张；DF：接触线向内收。不要凭两个外圈看起来相同就判断装反与否，要看标识和厂商安装图。'],['比较有效跨度','相同尺寸和布置下，DB 有效跨度通常更大，抗倾覆刚度更好；DF 对某些安装倾斜更宽容，但不等于允许任意不同轴。'],['热影响要按结构分析','内外圈及轴座的热伸长会改变预紧；DB、DF 的结果与轴向定位、材料、尺寸、接触角一起有关，不能背“某组合热了总变松”。'],['用实际载荷选择','看双向轴向力、径向载荷、倾覆力矩、对中与装配条件，并对成对轴承按目录方法计算。']],
['例：只用力偶说明跨度作用','忽略其他载荷，倾覆力矩 M=100 N·m，由两相反支反力组成力偶。','若有效跨度 L=0.10 m，则支反力差对应的力偶大小 F=M/L=1000 N。','若跨度改成 0.20 m，F=500 N。','这只是力偶直觉示例，不是用轴承外形尺寸直接替代厂商成对计算。'],
['同样条件下，DB 常见优势是什么？',['有效支点跨度较大，抗倾覆刚度较好','不需要预紧与装配要求','热膨胀永远没有影响'],0,'DB 的 O 形接触线使有效支承跨度通常较大。']);
lesson('T20',['扭矩','切向力','径向力','支反力'],'shaft',
'7000 N·m 是轴上的转动作用，不是轴承上的径向力。先知道扭矩通过哪个直径的齿轮或链轮传递，才能把扭矩转换成具体的力；再根据力作用位置和两支点位置求轴承反力。',
[['从传动件得到外力','齿轮分度圆直径为 d 时，切向力 Ft=2T/d。还要按直齿/斜齿得到径向和轴向分量。T 与 d 必须使用一致单位。'],['画两个平面受力图','轴通常在两个垂直平面受弯，分别求各平面的支反力，再矢量合成每个支点径向力。轴向力另按定位方式分配。'],['用静力平衡求反力','简支、两支点之间集中载荷 F，距 A 为 a、距 B 为 b，L=a+b：RA=Fb/L，RB=Fa/L。悬臂与力矩要另画。'],['再转成轴承校核','结合类型与目录系数求当量载荷 P，并检查静载、寿命、速度、刚度和冲击。X、Y 不是通用常数。']],
['例：从 7000 N·m 到支承力','假设扭矩作用在分度圆直径 0.5 m 的齿轮上。','切向力 Ft=2×7000÷0.5=28000 N。','仅考虑此方向，支点跨度 0.4 m，齿轮在跨中，RA=RB=14000 N。','若为 20° 直齿还有 Fr=Ft tan20°≈10191 N，须按实际方向求另一平面反力；不能把刚才 14000 N 当最终总载荷。'],
['7000 N·m 可以直接作为轴承的 Fr=7000 N 吗？',['可以','不可以，需要传动半径和载荷路径','只要转速低就可以'],1,'扭矩和力单位不同，先按结构把扭矩换成力。']);
lesson('T21',['径向力','轴向力','倾覆力矩','额定值'],'bearingtypes',
'选轴承像选鞋，先看要跑步、登山还是负重，不是简单挑最贵的一款。角接触球、圆锥滚子、交叉滚子都有适用场景，尤其液压摆动关节与连续旋转电机的润滑和寿命问题不一样。',
[['角接触球轴承','常用于组合载荷、较高转速和精度需求；单列通常只能承受特定方向轴向载荷，双向定位常需配对。'],['圆锥滚子轴承','适合较大组合载荷，通常需要成对和调整；径向载荷会产生附加轴向分力，必须按目录计算。'],['交叉滚子轴承','紧凑结构可承受径向、双向轴向和倾覆力矩，但安装面平面度、壳体刚度、螺栓与预紧要求很重要。'],['摆动应用单独核查','小角度、重复往返时，润滑膜与微动磨损可能比标准旋转 L10 寿命更关键。按厂家摆动指南选型。']],
['例：先分需求再筛类型','假设关节低速摆动、空间短、同时有径向力、双向轴向力与较大倾覆力矩。','先将交叉滚子或合适组合支承列为候选，而不是直接定型号。','若空间允许且负载重，也比较成对圆锥滚子方案的支撑跨度与摩擦。','最后用各候选的额定载荷、刚度、安装要求、摆动适用性和成本做选择表。'],
['交叉滚子轴承额定载荷高，是否就不需要检查壳体刚度？',['不需要','仍然需要，安装结构会影响载荷分布','只检查润滑脂即可'],1,'薄弱安装面和壳体会导致套圈变形与偏载，影响精度和寿命。']);
lesson('T22',['过盈配合','游隙','预紧','温升'],'fit',
'把一个略小的金属环套到稍大的轴上，环会被撑大。这正是内圈过盈配合的直觉。它有助于防止套圈爬行，但过大时会挤掉内部游隙，甚至在热态产生不希望的内部载荷。',
[['先算几何过盈','过盈=轴尺寸−孔尺寸；最大与最小组合分别计算。轴和内圈孔、外圈和壳体孔是两组不同配合。'],['再看弹性分配','轴会压缩、内圈会扩张；空心轴和薄壁内圈的变形不同。因此 20 μm 过盈不等于 20 μm 内部游隙损失。'],['叠加运行温度','轴、内圈、外圈、壳体材料和温度不同，配合与内部游隙会继续变化。应做冷态与热态尺寸链。'],['用功能决定配合','载荷相对套圈的旋转、冲击、拆装和防爬行需求共同决定公差带。不是“越紧越牢靠”。']],
['例：先把配合极限算明白','教学假设：轴为 50.015～50.025 mm，轴承孔为 49.990～50.000 mm。','最小过盈=50.015−50.000=0.015 mm=15 μm。','最大过盈=50.025−49.990=0.035 mm=35 μm。','后续还要把 15～35 μm 过盈转成轴承内部游隙变化；这是两步，不能省掉第二步。'],
['为避免套圈爬行，可以无限增大过盈吗？',['可以','不可以，会影响游隙、应力与装配','改用 C3 就无限制'],1,'过盈必须满足防爬行与内部状态、材料应力和装配之间的平衡。']);
lesson('T23',['温升','预紧','润滑','对中'],'diagnosis',
'发热像发烧，是现象而不是病因。润滑不足会热，脂太多搅拌也会热；预紧大、对中差、外载异常也会热。要做有记录的对照实验，不要一上来就换更大轴承或加更多油脂。',
[['先建立可比较记录','转速、负载、运行时间、环境、测点、油脂类型和填量同时记录；比较温升 ΔT，而不是只比两天的绝对温度。'],['从空载和低速开始隔离','在预先确定的安全限制内，分级运行，观察空载也热还是带载才热；保持其他条件一致。'],['逐类找证据','高摩擦启动力矩可能提示预紧/密封问题；装配后才出现异常提示定位与对中；负载变化强相关提示外部载荷，但任何一个都非单独定论。'],['复测才能闭环','一次只改一个主要变量，记录修改前后同工况曲线；若温度超出预先限值，先停机查明，不用盲目跑到“自己稳定”。']],
['例：比较温升而不是只看 65°C','试验 A：环境 25°C，轴承测点 60°C，温升 35°C。','试验 B：环境 35°C，测点 65°C，温升 30°C。','B 的绝对温度更高，但相对环境温升更低。','仍需看润滑与部件允许绝对温度；这个比较只说明不能凭 65>60 就认定损耗更大。'],
['看到轴承热，最合理的第一步是？',['马上加满润滑脂','记录工况与温升曲线，并做隔离对照','把螺母再拧紧'],1,'先收集证据。过量润滑或盲目增预紧可能加重发热。']);

lesson('T24',['齿轮','模数','根切','变位'],'undercut',
'齿轮不是随便画几个三角齿就能正确啮合。渐开线齿廓来自特定几何，刀具加工少齿数小轮时可能把齿根一部分切掉，造成根切，削弱齿根并影响啮合。14 齿是否能用，取决于压力角、齿顶高、变位等条件。',
[['先限定齿形','以下讨论标准齿条刀具加工的外齿渐开线直齿轮。其他刀具、内齿、斜齿等情况不能直接套同一判断。'],['看无变位参考界限','标准 20°、全齿高齿条刀具的理论参考界限约 17 齿。它是特定条件下的近似界限，不能解读成小于 17 都不可制造。'],['理解正变位','刀具相对齿坯向外移，可增加齿根厚度并改善根切，但还会影响齿顶厚度、工作压力角与配对几何。'],['成对检查后才能定','检查齿顶变尖、重合度、顶隙、中心距与强度。换压力角或做变位都会引入取舍，不是免费提升。']],
['例：判断 14 齿是否需要额外设计','假设 20° 标准全齿高、无变位外齿小轮，z=14。','14 小于约 17 的参考界限，应检查根切风险。','可以把正变位列为候选，同时设计配对大轮与工作中心距。','尚缺模数、刀具参数、变位及配对几何时，不能直接给“某个变位系数保证合格”的结论。'],
['14 齿小齿轮是否必然不能用？',['必然不能','不必然，但需按实际齿形检查根切与强度','只加齿宽就能消除根切'],1,'齿数不是唯一条件，变位和齿形参数会改变结果。']);
lesson('T25',['模数','分度圆','切向力','压力角'],'gearforce',
'模数表示齿的大小，齿数表示有多少个齿，分度圆是建立传动几何的参考圆。真正接触的齿面力可分解成传递扭矩的切向力和把两轮推开的径向力；轴承要承受这些力带来的支反力。',
[['几何先限定条件','标准无变位直齿轮：d=mz，a=(d1+d2)/2。m 用 mm，则 d 和 a 也是 mm；有变位时工作中心距需另算。'],['确定扭矩属于哪只轮','Ft=2T/d 中的 T 和 d 必须来自同一只齿轮，不能用输出总扭矩配输入小轮直径。'],['再分解径向力','标准直齿简化：Fr=Ft tanα，α 是对应压力角；20° 输入计算器时选择角度模式。'],['传给支承模型','齿面实际法向力、齿轮所在位置与支承布置共同决定轴承载荷；两啮合位置不能把所有方向都当成同向。']],
['例：14/55 齿，模数 5 mm','假设标准无变位直齿，压力角 20°，小轮扭矩 870 N·m。','d1=5×14=70 mm；d2=5×55=275 mm；a=(70+275)/2=172.5 mm。','把小轮直径换成 0.070 m：Ft=2×870÷0.070≈24857 N。','Fr=24857×tan20°≈9047 N。若用 N·mm，也可写 Ft=2×870000÷70，结果相同。'],
['870 N·m 配 70 mm 直径计算 Ft，应该怎样代入？',['2×870/70','2×870/0.070','870×70'],1,'N·m 配 m；或者先把扭矩换成 N·mm 再配 mm。']);
lesson('T26',['变位','工作压力角','中心距'],'gearpair',
'中心距是两个齿轮轴中心之间的距离。壳体孔位固定以后，标准中心距不一定刚好匹配，变位可调整齿轮几何，但不是把中心距差简单除以模数就完成完整设计。需要先求工作压力角和总变位，再决定两轮怎样分配。',
[['先算参考中心距','a0=m(z1+z2)/2。已知壳体中心距 aw 时，先比较 aw 与 a0；同时确认制造与装配公差。'],['求工作压力角','对于外啮合直齿轮，在相应几何条件下 cosαw=a0 cosα/aw。aw 与 αw 改变会影响啮合。'],['求总变位关系','xΣ=[invαw−invα]×(z1+z2)/(2tanα)，invα=tanα−α，α 必须用弧度参与渐开线函数。此式不是斜齿等所有情况的通式。'],['分配后做全检查','x1+x2=xΣ，但分配不唯一。小轮根切、两轮齿顶厚度、滑动、重合度与强度共同约束分配。']],
['例：先发现几何变化','假设 m=5 mm、z1=14、z2=55、α=20°，壳体 aw=175 mm。','标准 a0=5×69/2=172.5 mm。','cosαw=172.5×cos20°/175≈0.9263，所以 αw≈22.14°。','接着才能由渐开线函数求总变位并分配；中心距增加 2.5 mm 不意味着直接让小轮 x=0.5 就一定合格。'],
['算出总变位系数后，x1 与 x2 是否只有一个唯一分配？',['只有一个','通常不唯一，还需按根切与强度等选择','永远各一半'],1,'总和受几何约束，分配还需考虑两轮具体性能。']);
lesson('T27',['变位','修形','齿侧间隙'],'gearpair',
'变位改变的是齿轮设计时的宏观齿形参数；修形是在齿廓或齿宽方向做有目的的微量修正。可以把变位理解成确定“整体外形与比例”，修形理解成针对受载变形和制造误差“修整接触”。两者可以同时存在。',
[['正负变位','相对标准刀具位置向外或向内移动，改变齿根、齿顶厚度等；它不等于给整个齿轮按比例放大。'],['齿廓修形','沿齿高方向进行修缘等微量修正，常用于改善进入/退出啮合时的载荷变化，需要针对负载设计。'],['齿向修形','沿齿宽方向做鼓形或端部修缘，以降低轴挠度、安装倾斜等引起的边缘接触风险。'],['量级与用途都要看','修形通常以 μm 量级描述，但具体值由几何、载荷、精度与变形决定；不能把通用示意值直接写进生产图纸。']],
['例：先判断问题属于哪类','14 齿小轮担心根切：优先检查齿形与变位几何。','齿宽两端接触斑点偏一侧：先查对中、支承变形和齿向误差，再评估齿向修形。','负载下啮入冲击明显：分析齿廓修形和传动误差。','三种现象的处理路线不同；单纯“把齿磨薄一点”可能同时破坏侧隙和承载。'],
['为了改善齿宽边缘接触，常评估哪种措施？',['只增加正变位','对中与齿向修形','无条件减小全部侧隙'],1,'先找偏载原因，再根据负载变形考虑齿向修形。']);
lesson('T28',['精度等级','齿侧间隙','工况'],'gearpair',
'齿轮精度等级描述制造误差控制水平，不是减速比、强度或回差的直接数值。常见 ISO/GB 等级中，数字越小通常越精密。选 6 级还是 8 级，必须先知道哪些误差影响你的功能。',
[['先确认标准','图纸注明采用的标准和版本、要控制的检验项目。不同体系的数字不能不加判断直接对照。'],['认识误差项目','齿距误差影响传动均匀性，齿廓与齿向误差影响接触和噪声。一个“7级”口号不能替代完整验收要求。'],['联系真实工况','较高转速、低噪声、定位精度可能需要更严控制；低速重载还要关注载荷分布与强度，不能只追求数字小。'],['考虑加工和检测成本','加工能力、热处理变形、磨齿与检测设备都参与成本。等级提高以后，装配误差仍可能抵消收益。']],
['例：分清精度和侧隙','假设两套都声明相同标准的 6 级齿轮，但一套按热态润滑要求设计更大齿侧间隙。','它们仍可能都满足相同制造精度等级。','输出反向空程大小还与侧隙、连接、轴承和弹性相关。','因此不能把“6级”翻译成“零回差”；若要精密定位，应单独定义反向误差与测试方法。'],
['在同一常见 ISO/GB 体系下，6、7、8 级哪个通常更精密？',['8级','7级','6级'],2,'数字通常越小制造精度越高，但必须先确认同一标准体系。']);
lesson('T29',['螺旋角','切向力','轴向力','压力角'],'helical',
'直齿像横着排的齿，斜齿的齿线倾斜，啮合可更平稳，但会把一部分作用力沿轴线推出去。螺旋角越大，轴向载荷一般越大，轴承和壳体就要一起升级考虑。',
[['区分法向与端面','斜齿轮常给法向模数 mn 和法向压力角 αn；端面模数 mt=mn/cosβ。不能拿 mn 直接当 mt 求所有几何。'],['先求切向力','仍可按同一只轮的扭矩与分度圆直径用 Ft=2T/d，单位配套。'],['再算轴向和径向','简化力分解：Fa=Ft tanβ；Fr=Ft tanαt，tanαt=tanαn/cosβ。力的方向还由旋向、转向和主动从动决定。'],['看系统代价','轴向定位、支承刚度、效率、温升、齿宽与重合度一起评估。斜齿不等于任何工况下效率必然更高。']],
['例：看螺旋角引入多少轴向力','假设 Ft=10000 N，β=20°。','Fa=10000×tan20°≈3640 N。','若 β=30°，Fa≈5774 N，在相同 Ft 下明显增大。','这里未做具体齿轮设计，仅说明轴向载荷趋势；轴承必须按实际两向工况和目录规则选择。'],
['斜齿轮比直齿轮多出的典型载荷是什么？',['轴向分力','不存在任何径向力','只有自重'],0,'齿线倾斜导致轴向分力，方向需结合旋向和转向判断。']);
lesson('T30',['行星架','太阳轮','内齿圈','减速比'],'planet',
'行星轮系里不仅齿轮转，行星轮的轴也可能随行星架转动，所以不能直接按两个普通齿轮的齿数比算输入输出。先指出哪个构件固定、哪个输入、哪个输出，是计算的起点。',
[['先认三个主构件','简单行星机构包括太阳轮 s、内齿圈 r、行星架 c，行星轮安装在架上。名称相同也可能有不同动力路线。'],['从相对运动开始','简单太阳轮—内齿圈结构满足 (ns−nc)/(nr−nc)=−Zr/Zs；这个关系包含行星架的运动。'],['加固定条件','齿圈固定 nr=0、太阳轮输入、架输出时，i=ns/nc=1+Zr/Zs。换固定构件或输入端会改变结果。'],['NGW/NW 必须看拓扑','复合双联行星等结构需要各级啮合与刚性连接关系。只有名称没有齿数和连接图，无法可靠给统一速比。']],
['例：简单 NGW 的特定工况','假设太阳轮 20 齿、内齿圈 60 齿，内齿圈固定，太阳轮输入。','i=1+60÷20=4。','若太阳轮 1000 rpm，行星架输出=1000÷4=250 rpm，同向。','未检查行星轮齿数、同心条件、邻接条件和装配条件前，这还不是一套可生产设计。'],
['i=1+Zr/Zs 适用于本课哪种情况？',['所有行星机构','简单机构、齿圈固定、太阳轮输入、架输出','任意 NW 结构'],1,'先确认固定/输入/输出构件，才能使用对应公式。']);
lesson('T31',['均载','齿根弯曲','接触疲劳','热处理'],'gearforce',
'两个小齿轮推一个大齿轮时，总扭矩分成两个接触区域。大轮的每个齿会随旋转经历载荷循环，不能只把总扭矩除二后就宣布齿宽和材料够用。需要检查每条支路的最不利力与载荷循环。',
[['把总扭矩分解到啮合点','依据实际几何、支路速比和效率确定各小轮扭矩与 Ft，考虑均载偏差和工况峰值。'],['区分两类强度','齿根弯曲疲劳关注齿根裂纹；接触疲劳关注齿面点蚀/剥落。模数、齿宽、材料和热处理对两者影响不同。'],['偏载会浪费齿宽','加宽并不保证载荷均匀，轴挠度、箱体和齿向误差会造成边缘载荷。应校核载荷分布与安装刚度。'],['用适用标准迭代','按 ISO 6336 等适用方法输入材料性能、寿命、可靠度、载荷系数与几何，迭代模数、齿宽和工艺；教学简式不能替代标准。']],
['例：均载假设对设计有多大影响','假设大轮总输出 6000 N·m、分度圆直径 0.3 m。','均载时每啮合点扭矩贡献 3000 N·m，切向力=2×3000÷0.3=20000 N。','如果某支路承担 60%，该处 Ft=2×3600÷0.3=24000 N。','同一齿宽下平均单位齿宽载荷提高 20%；真实齿根和接触应力仍需按标准模型计算。'],
['增加齿宽以后能忽略轴和箱体变形吗？',['能','不能，偏载可能使新增齿宽无法有效承载','只要材料够硬就能'],1,'齿宽与系统刚度、齿向载荷分布相关，必须一并评估。']);
lesson('T32',['有限元','边界条件','网格收敛','验证'],'fea',
'软件像不同科室的工具箱：传动专用计算、轴系和系统分析、通用有限元各有擅长。软件给出彩色应力图，并不自动意味着输入工况和模型正确。先问要回答哪一个工程问题，再选工具。',
[['齿轮标准校核','KISSsoft 等传动工具可用于齿轮、轴等设计校核，功能随模块与版本不同。输入载荷谱、材料和精度必须可追溯。'],['系统与轴系','Romax 等工具可分析传动系统、轴承和轴系载荷及变形，仍需明确具体模型与模块，不应仅凭品牌推断能力。'],['通用有限元','ANSYS 可做结构、接触、热、模态等分析。几何、接触、网格、约束与载荷决定结果，不能代替全部齿轮标准计算。'],['建立相互检查','用手算反力和变形作数量级核对，用试验核对温升、振动、刚度与耐久。工具之间一致也不能证明共同的错误输入没问题。']],
['例：齿轮箱噪声大如何选分析','先记录工况与频谱，判断噪声是否随齿轮啮合频率变化。','传动模型查看传动误差与载荷分布；轴系模型看支承变形。','有限元模态分析看壳体/结构是否接近激励频率。','最后用台架同工况数据验证修改。不是只把壳体最大应力降下来就算噪声解决。'],
['软件报告安全系数高，就可以省掉实际载荷核查吗？',['可以','不可以，输入与边界可能有误','两个软件一致就可以'],1,'结果可信度首先受输入、模型和验证证据限制。']);


lesson('T33',['峰值','RMS扭矩','减速比','功率'],'joint',
'关节是“电机＋减速器＋轴承＋编码器＋壳体”的组合，不是选一只写着 130 N·m 的电机就结束。先确认 130 N·m 是连续还是短时、80 rpm 是否要同时达到，并明确 φ110×90 mm 是否包含法兰、线束与驱动器。',
[['把需求写成包络','至少列出连续/峰值扭矩、速度、加速度、运动周期、精度、重量、寿命、环境温度与安装空间。峰值扭矩和最高速度可能不在同一个工作点。'],['从候选速比反推电机','假设减速比 i、效率 ηg，则 T电机=T输出/(iηg)，n电机=i×n输出。再检查电机在这个速度下是否能提供对应扭矩。'],['检查热与机械支承','按运动周期计算电机 RMS 扭矩，核查散热条件；输出轴承按径向/轴向/倾覆载荷选择，不能按 130 N·m 直接选择。'],['做空间叠加','减速器、电机、轴承、编码器、密封、法兰与装配公差需要真实尺寸链。外径和长度都满足才算装得下。']],
['例：先筛一组候选工作点','假设输出连续 130 N·m、80 rpm，候选 i=50、齿轮效率 0.8。','电机需约 130÷(50×0.8)=3.25 N·m，转速为 50×80=4000 rpm。','输出功率=130×80÷9550≈1.09 kW；电机轴输入至少约 1.09÷0.8=1.36 kW。','还需在转矩—转速图、热条件与减速器额定表上验证；以上不是已选定型号。'],
['选电机时只看静态峰值扭矩够吗？',['够','不够，还要看速度包络与持续热能力','减速比大就都够'],1,'电机在高速下可用扭矩可能下降，持续工作还受发热和冷却限制。']);
lesson('T34',['峰值','RMS扭矩','额定值'],'rms',
'峰值扭矩像短跑时的冲刺能力，连续扭矩像能够长期维持的配速。电机铜损与电流平方相关，在线性扭矩—电流近似下，热效应更接近扭矩平方的平均，因此需要 RMS 等效扭矩。',
[['先有完整运动周期','列出每段扭矩和持续时间，包括加速、恒速、减速、保持与休息。正负扭矩在平方后都贡献发热，不能直接互相抵消。'],['写 RMS 公式','TRMS=√[Σ(Ti²ti)/Σti]。每段扭矩 N·m、时间 s，结果仍为 N·m。'],['同时看峰值和包络','TRMS 在相应冷却与速度条件下满足连续热能力，T峰值不超允许短时扭矩；还需检查驱动电流与再生制动。'],['知道公式边界','铁损、速度变化、堵转、冷却变化与热时间常数也重要。RMS 是初步热筛选，不是所有工况的完整热模型。']],
['例：一个 10 秒周期','前 2 s 为 6 N·m，后 8 s 为 2 N·m，假设两段同等冷却且采用简化模型。','平方加权和=6²×2+2²×8=72+32=104。','平均平方=104÷10=10.4；TRMS=√10.4≈3.225 N·m。','峰值仍是 6 N·m，不能只按 3.225 选驱动；普通时间平均 2.8 N·m 会低估此热指标。'],
['扭矩从 +5 变成 −5 N·m，RMS 发热贡献能抵消吗？',['能','不能，平方后都为正','转速为零就一定不发热'],1,'正反向电流都产生铜损，平方项不会互相抵消。']);
lesson('T35',['转子','定子','气隙','热路径'],'motorcut',
'普通成品电机自带壳体和支承；无框电机通常提供转子与定子，整机设计者要负责支承、定位、固定和散热。省掉原电机壳体有助于集成，但被省掉的功能必须由关节结构补回来。',
[['区分转动与固定','转子连接旋转轴，定子固定在壳体。轴承决定它们相对位置，不能让转子依赖磁力“自动保持居中”。'],['控制气隙','气隙是转子与定子之间的设计间隙。考虑尺寸误差、偏心、轴承变形、热胀与动态挠度，最不利条件下不能擦碰。'],['建立扭矩连接','转子套、胶接、压配合或其他固定方式要传递峰值扭矩，并满足热和装配要求；具体方法依供应商设计。'],['给损耗找到散热路','定子→界面材料→壳体→环境/冷却结构。额定扭矩常依赖规定散热条件，不能脱离条件照抄。']],
['例：做一个简化气隙预算','仅作教学：名义最小径向间隙 0.5 mm，偏心和动态位移最不利合计 0.2 mm，热态相对变化再占 0.1 mm。','剩余间隙初估=0.5−0.2−0.1=0.2 mm。','还需考虑跳动、公差的统计/极值组合和测试；0.2 mm 并不是通用合格线。','实际设计必须采用具体电机允许气隙、安装同轴度与供应商要求。'],
['无框电机省去独立壳体后，散热和支承是否不用设计了？',['是','否，这些功能转由关节结构承担','仅定子不需要散热'],1,'集成度提高，也意味着整机设计需要承担原成品电机的部分功能。']);
lesson('T36',['弧度','力臂','误差链'],'angle',
'关节角度错一点，离关节越远的末端偏得越多。像长尺子转一个小角度，尺子尖端会移动一段距离。本题先学单关节、单平面的近似，再认识多关节不能只把角度数字直接相加。',
[['把角度换成弧度','θ(rad)=θ(°)×π/180。小角位移公式必须用弧度，不是把 0.1 原样代入。'],['说明 L 是什么','L 是末端到该旋转轴的相关垂直距离。关节沿轴方向的距离不应直接全当作力臂。'],['使用小角近似','小角度下位移量近似 Δs≈Lθ；精确几何随所比较的距离定义不同，弦长为 2L sin(θ/2)。'],['扩展到多关节','多个关节的误差经姿态、几何与雅可比映射到末端，还包含回差和弹性。此处单关节结果不是整机总精度承诺。']],
['例：0.5 m 臂长、0.1° 误差','θ=0.1×π÷180≈0.001745 rad。','Δs≈0.5×0.001745=0.0008727 m。','换成 mm：约 0.873 mm。','若相同角误差、有效距离 1 m，则位移约 1.745 mm；所以长臂对角误差更敏感。'],
['0.1° 在 Lθ 中应怎样代入？',['0.1','约 0.001745 rad','约 5.73 rad'],1,'必须先做度到弧度的换算。']);
lesson('T37',['编码器','零位','回差','刚度'],'diagnosis',
'编码器报告角度，零位决定“从哪儿开始算角度”。零位变化可能是传感器电子漂移，也可能是编码器环滑动、法兰松动、轴扭转或结构热变形。先建立独立参考，才知道变化发生在哪一层。',
[['建立外部基准','用重复机械基准、角度测量装置或外部位置测量观察真实输出，不能只用同一个编码器证明自己正确。'],['分冷/热与空/载','冷态无载、热态无载、正向受载、反向受载分别记录；时间与温度相关、方向相关、力矩相关往往指向不同问题。'],['检查安装链','轴→转子/磁环→固定件→传感器底座→壳体。看紧固、胶接、偏心与间隙，同时查看线缆和电源。'],['分清误差类型','突然跳变可能与松动或信号异常相关；随扭矩可逆变化可能与弹性相关；反转空程可能来自回差。这些都需试验确认。']],
['例：用双测量定位','假设输出端外部仪器也观察到角度随负载改变，而电机端编码器读数基本不变。','先检查减速器、连接和输出支承的弹性/回差链。','若只有编码器数值飘、外部参考不变，优先检查传感器与信号安装问题。','这是一种隔离逻辑，不代表单次观测就可以排除所有其他原因。'],
['检查零位漂移，为什么需要独立参考？',['为了让界面更复杂','避免用同一个可能出错的传感器验证自己','可以替代所有结构检查'],1,'独立测量能区分真实机械运动与传感器读数错误。']);
lesson('T38',['六维力传感器','预紧','旁路载荷','坐标系'],'sensor',
'六维力传感器测三个方向的力 Fx、Fy、Fz 和三个方向的力矩 Mx、My、Mz。它像一座测重桥，载荷必须经过它；若旁边另搭一根很硬的“桥”，一部分力从旁路走掉，传感器就测不全。',
[['画完整受力路径','末端工具→上法兰→传感器→下法兰→机器人。检查外壳、保护件和线缆是否形成绕过传感器的刚性连接。'],['安装面与螺栓一起看','平面度、刚度、清洁、规定螺栓顺序与预紧会影响初始应力。按厂家要求，不是任意加大拧紧力。'],['坐标与力臂要转换','传感器测点与工具作用点不同，力矩要考虑 r×F；坐标旋转也要按定义变换。'],['安装后重新校验','去皮只能消除某一状态的零偏，不能消除旁路、非线性或错误坐标。用已知方向载荷与力臂做校验，并设过载保护。']],
['例：载荷位置改变会带来力矩','假设垂直力 100 N，作用点距传感器中心的垂直力臂 0.1 m。','附加力矩大小 M=100×0.1=10 N·m。','若把工具作用点当作传感器原点，可能误读这个力矩来源。','真正方向要按右手坐标与 r×F 判断，不能只记正负号。'],
['把传感器两侧用刚性护罩直接连接，会有什么风险？',['测量永远更准','载荷旁路，部分力绕过传感器','自动消除全部耦合'],1,'刚性旁路会改变受力路径，去皮也不能修复这一问题。']);
lesson('T39',['刚度','转动惯量','材料','误差链'],'beam',
'轻量化不等于到处挖孔。机器人关节必须把力传到支承，载荷路径上的材料被去掉后，变形可能明显增大。优先减小远离旋转轴的无效质量，并通过截面形状和连接改善刚度。',
[['强度与刚度分别验','同样屈服强度不代表相同刚度。弹性变形与弹性模量、几何和连接有关；轻金属的弹性模量通常低于钢。'],['看材料放在哪里','梁的截面惯性矩 I 与材料离中性轴的分布有关；扭转用极惯性矩或相应扭转常数，不能与转动惯量混淆。'],['关节也有连接刚度','法兰、螺栓、轴承、减速器与壳体都会贡献变形。仅给壳体加厚可能没有解决最弱环节。'],['比较系统指标','在相同载荷下比较质量、位移、扭转刚度、疲劳与模态，再看加工装配和成本。优化前先定义允许误差。']],
['例：减质量的位置不同，效果不同','简化为点质量，转动惯量 J=mr²；假设去掉 0.1 kg。','距轴 0.2 m 处减少 J=0.1×0.2²=0.004 kg·m²。','距轴 0.05 m 处减少 J=0.1×0.05²=0.00025 kg·m²。','前者对该轴的惯量影响是后者 16 倍；但能否去材料仍需强度、刚度和功能校核。'],
['高强度材料一定使同形状零件的弹性变形更小吗？',['一定','不一定，要看弹性模量与结构','只看硬度即可'],1,'屈服强度与弹性模量是不同物理量。']);

lesson('T40',['调质','表面淬火','氮化','疲劳'],'heat',
'热处理像给同一材料安排不同的加热、冷却流程，改变组织和性能。主轴往往既要心部强韧，也要某些表面耐磨。调质、表面淬火和氮化不是必须三选一，它们可能按具体工艺组合使用。',
[['先问哪里会失效','整体弯扭疲劳、轴肩裂纹、配合面磨损、键槽损伤，对表面与心部的需求不同。先确定目标，再选工艺。'],['调质管综合强韧','通常指淬火加高温回火，为心部综合性能服务；实际效果受截面尺寸、材料与热处理能力影响。'],['表面硬化管局部性能','感应淬火可使特定表面硬化；氮化温度相对低、变形通常较小，但硬化层深度、脆性与承载条件要核查。'],['图纸写可检验要求','写清材料状态、硬度范围、有效层深度、检查位置、变形与最终精加工要求，不能只写“做硬一点”。']],
['例：把不同需求分开','假设轴身主要受弯扭，某密封跑道磨损明显。','先确认轴心部的强韧与疲劳设计，再评估跑道局部硬化或表面处理。','若整轴热处理变形会影响轴承位，要把磨削余量、基准和工序排进去。','未给截面、载荷与寿命前，不提供一组通用硬度作为保证值。'],
['调质与氮化必定只能选一种吗？',['必定','不一定，可能按适用工艺组合','只由零件颜色决定'],1,'工艺路线要分别满足心部、表面与尺寸精度要求。']);
lesson('T41',['强度','韧性','淬透性','材料'],'materials',
'45 钢、40Cr、42CrMo 是材料牌号，不是固定强度数字。同一牌号经过不同热处理、不同截面尺寸，性能会不同。合金钢通常有更好的淬透性和可获得的综合性能，但材料更贵不意味着可以省略疲劳设计。',
[['45 钢看经济性','适合许多一般轴类和零件，工艺成熟；对于大截面或较高强韧需求，要核对实际热处理能力。'],['40Cr 看调质与截面','加入合金元素有助于改善淬透性等性能，常用于要求更高的轴齿类；仍需明确材料与热处理标准。'],['42CrMo 看更高要求','常用于较高强韧性要求的轴和重载零件，但尺寸效应、热处理、缺口和成本仍重要。'],['把比较落实到数据','在相同供货状态、尺寸、热处理与试验标准下比较屈服、抗拉、延伸、冲击、疲劳与成本；别拿退火态与调质态混比。']],
['例：为何不能只换材料不看几何','某轴反复在键槽根部开裂，原来使用 45 钢。','换成 42CrMo 可能改善某些材料能力，但尖锐键槽、表面刀痕与载荷循环仍在。','需同时查断口、载荷谱、缺口、圆角、表面与热处理。','正确结论应有改动前后计算与疲劳验证，而不是“牌号升级就解决”。'],
['比较材料强度时必须注明什么？',['只注明颜色','热处理状态、截面与适用数据来源','只看价格'],1,'材料性能取决于状态与制备，不能把牌号当作固定强度。']);
lesson('T42',['屈服强度','刚度','焊接疲劳','材料'],'beam',
'Q235 与 Q355 名称中的数字与规定条件下的屈服强度等级有关，实际值还随厚度、质量等级和标准变化。钢材换成更高强等级，弹性模量通常不会同比增加，所以“更强”不自动带来“同样刚度更轻”。',
[['先判谁限制设计','是静强度、挠度、局部屈曲、疲劳还是焊缝？如果刚度先超限，提高屈服强度未必允许减薄。'],['保留截面效应','梁抗弯刚度与 EI 有关，E 是弹性模量，I 强烈受截面形状和厚度影响。减材料时 I 可能下降很快。'],['焊接与母材分开','焊缝、热影响区、焊趾形状与残余应力会限制疲劳性能。母材屈服提高不等于焊接疲劳等级同比提高。'],['考虑工艺与检验','钢板厚度、焊接工艺、矫形、无损检测和供应稳定性纳入比较。不能只用一条屈服强度比值做轻量化。']],
['例：为什么换高强钢仍然挠','假设简支梁几何与载荷不变，两种钢的弹性模量均近似 210 GPa。','在线弹性范围内，挠度与 1/(EI) 成正比，因此换钢后挠度基本不变。','若随后减薄截面，I 降低，挠度反而会增大。','需要重新校核屈曲、疲劳和连接，不能把 355/235 直接当作减重倍率。'],
['相同几何的钢梁换成更高屈服等级，弹性挠度一定大幅降低吗？',['一定','不一定，钢的弹性模量通常相近','屈服强度就是弹性模量'],1,'强度等级主要改变屈服能力，刚度需看弹性模量与截面。']);
lesson('T43',['基准','形位公差','尺寸公差'],'datum',
'尺寸公差回答“这个孔有多大”，形位公差回答“孔和其他特征的位置、方向或形状允许偏多少”。基准是测量时用来建立理想参考的面、轴线等。没有看到具体框格时，不能仅凭 C、D 两个字母判断完整要求。',
[['先辨符号与被控特征','位置度、垂直度、圆跳动等控制的内容不同；先找框格指向的是孔、轴线、面还是其他特征。'],['再读公差值和修饰符','数值、直径符号、材料条件等共同定义公差带。把直径公差带误看成单向偏移会导致不同判断。'],['按顺序建立基准','框格不同格里的 C、D 通常表示有优先次序的基准；同一格的 C-D 可能是公共基准。具体按采用标准和图样解释。'],['把图纸翻成检测动作','零件怎样靠主定位面、怎样定向、怎样约束剩余自由度；检测方法与真实装配功能要一致。']],
['例：先学读框格的逻辑','假设图示为某孔的位置度要求，公差带 φ0.05，相对于顺序基准 C、D，且未给额外修饰符。','先建立 C，再用 D 约束图样要求的剩余自由度。','检查孔轴线是否落在图样定义的 φ0.05 公差带内；理论位置还要看基本尺寸。','仅这个文字例子不足以定义完整生产检验，仍需图纸、基准特征与适用标准。'],
['两个字母在框格不同格，和写成同格 C-D，能无条件视作一样吗？',['可以','不可以，可能分别表示顺序基准与公共基准','字母顺序从不重要'],1,'符号、格子和顺序都是要求的一部分。']);
lesson('T44',['热膨胀','过盈配合','游隙','预紧'],'thermalfit',
'这里至少有三组相对变化：钢轴与内圈孔，钢制外圈与铝壳体孔，内圈与外圈滚道。铝通常比钢热胀更明显，同温升时铝孔可能比钢外圈长得更快，从而减小外圈配合过盈；内部游隙变化还要另算。',
[['分别列材料与温度','不要把钢轴、内圈、外圈、铝壳体都设成同一个温度却不说明；先做简化假设，再逐层改进。'],['每个直径单独算','热胀近似 Δd=αdΔT；所有直径与系数单位要一致，变化量再换成 μm 比较。'],['重新算热态配合','热态过盈=热态外配件直径−热态内孔直径。对外圈—壳体，需明确哪一项是轴尺寸、哪一项是孔尺寸。'],['再检查内部状态','轴向定位链的热伸长也会改变成对轴承预紧。外圈配合变松与内部游隙变小可能同时发生，不能互相替代。']],
['例：铝孔与钢外圈同温升','仅作自由热胀估算：直径均约 100 mm，温升 40°C，铝 α=23×10⁻⁶/K，钢 α=12×10⁻⁶/K。','铝孔增大约 0.092 mm，钢外圈增大约 0.048 mm。','相对差=0.092−0.048=0.044 mm=44 μm。','若冷态外圈过盈约 20 μm，理想自由尺寸估算可能转为约 24 μm 间隙；真实接触约束和温差要进一步算。'],
['同样温升下，铝孔通常比相同直径钢外圈胀得多，外圈过盈会怎样？',['倾向减小','必然无限增大','永远不变'],0,'孔相对增大更多，外圈与孔的过盈倾向减小。']);
lesson('T45',['失效安全','冗余','制动','验证'],'safety',
'升降装置断电后，负载仍受重力。软件发不出停止指令、执行器失效或钢丝绳断裂时，必须有对应的安全功能。先列失效场景，再设计制动、机械防坠与监测，不能把“加一个限位开关”当作所有风险的答案。',
[['逐个列单点失效','断电、驱动失控、制动器失效、传动断裂、同步失效、超载和维护误操作可能需要不同保护路径。'],['区分保持与动态制停','静止时托住载荷所需力，与下落后捕获和制停的冲击载荷不同。动态停距越短，平均减速度可能越大。'],['设计独立的承载路径','机械锁止、合适的失电抱闸等是否真正覆盖所识别失效？两套装置共用同一薄弱件时，不能直接声称完全独立。'],['明确合规与验证','按设备类别适用标准进行风险评估、功能设计、强度与耐久验证、救援和检修方案。教学示例不提供可直接制造的安全机构尺寸。']],
['例：只理解捕获冲击为什么更大','教学近似：质量 100 kg 的负载已以 0.5 m/s 下落，假设均匀在 0.01 m 内停止。','减速度大小 a=v²/(2s)=0.5²/(2×0.01)=12.5 m/s²。','向上制动力平均量级 F=m(g+a)=100×(9.81+12.5)=2231 N，超过静重 981 N。','真实峰值与弹性、冲击及结构动力有关，必须专门设计验证；这不是可选用的额定防坠载荷。'],
['静态能托住负载，是否就证明能安全捕获下落负载？',['是','否，还需动态制停与失效场景验证','加软件限位就足够'],1,'捕获下落涉及动能、停距与冲击，要求不同于静态保持。']);
lesson('T46',['疲劳','断口','热处理','追溯'],'fracture',
'同一个位置反复断，可能是设计薄弱，也可能是批次材料、热处理、加工或实际冲击。先保护证据，避免把断口磨掉或焊回去，再按批次和工况对比。断口外观只能提供线索，完整根因还需多种证据。',
[['先隔离风险与留样','编号零件，记录断裂位置、方向、时间、载荷和装配状态，保留断口配对与未失效对照件。'],['分设计共性和批次差异','如果所有批次同位置失效，关注共性载荷和几何；若集中在某供应商或热处理炉次，关注制造波动，但两者也可能叠加。'],['把检测与假设对应','硬度/金相查热处理，成分查材料，尺寸粗糙度查加工，紧固与对中查装配，传感数据查实际载荷。'],['改完要重现验证','用可重复工况对比改前改后，验证疲劳、强度和工艺一致性；将结果写入图纸、检验与版本记录。']],
['例：比较批次而不草率归因','假设 100 件中 8 件断裂，都来自同一热处理炉次，但使用工况也恰好更重。','仅凭“同炉”无法区分工艺与工况因素。','应抽检断裂/未断同炉件、其他炉次件，记录硬度组织，并匹配载荷和尺寸。','证据若显示超硬脆化且载荷相近，才更支持热处理路径；仍需验证整改。'],
['拿到断件，第一步应把断口打磨干净吗？',['应当','不应，先保留并记录原始证据','直接换更粗的就行'],1,'断口与装配痕迹是失效分析证据，打磨会破坏信息。']);

lesson('T47',['有限元','边界条件','疲劳','网格收敛'],'fea',
'有限元是把连续结构拆成许多小单元，近似求出受力和变形。软件只回答“这个模型在这些输入下会怎样”。如果漏掉冲击、把螺栓连接绑得过硬，安全系数再高也不能代表真实机器。',
[['先问模型算了哪种失效','静强度、疲劳、屈曲、接触、温升与振动是不同问题。静态 von Mises 应力低并不能覆盖所有失效模式。'],['核对载荷与约束','真实载荷路径、接触、预紧、支承柔性和材料状态都要核对。完全固定、点载荷与理想绑定可能不真实。'],['检查数值可信度','反力是否平衡、变形方向是否合理、网格是否收敛、局部尖峰是否奇异。不能只读整张图的最大值。'],['用断裂证据反查','真实裂纹位置与分析危险区是否一致？把缺口、加工、残余应力和实际载荷谱补回，再和试验交叉验证。']],
['例：静安全系数高不等于疲劳合格','假设模型最大静应力 100 MPa，材料屈服 500 MPa，按这个比较得到静屈服安全系数约 5。','实际存在反复载荷、缺口和腐蚀。','疲劳允许应力可能远低于屈服，且与循环次数和应力比有关。','因此不能由“5”推出长期不裂；要建立疲劳模型和验证载荷谱。'],
['最大应力随网格加密一直上升，可能意味着什么？',['模型一定更安全','存在奇异性或尚未收敛，需要检查','直接取最小网格的峰值即可'],1,'应检查点载荷、尖角、约束与接触，并选有物理意义的评价量。']);
lesson('T48',['DVP','工况','额定值','验证'],'testmatrix',
'DVP 是设计验证计划：每个需求用什么试验、在什么条件下、用什么判据证明。7000 N·m 只是一项指标，还必须问清速度、方向、持续时间、峰值和寿命。没有合格判据的“跑一下看看”不能证明要求达标。',
[['把需求编号','例如输出扭矩、转速、温升、泄漏、回差、耐久、冲击与环境。每项都标数据来源和需要确认的条件。'],['写试验输入','负载、压力流量、速度、方向、油温、环境、周期、样本量、测点和采样。测量设备量程与不确定度要合适。'],['写合格与停止条件','持续扭矩、允许温升、稳态判定、泄漏限值和安全停机条件事先确定，不能测完以后临时调低标准。'],['写记录和闭环','需求→试验编号→原始数据→结果→问题单→整改版本→复测。一个空白结果栏不等于通过。']],
['例：将一句目标变成可验证条目','教学需求：“动力头在规定输入条件下持续输出 7000 N·m、20 rpm。”','试验要明确输入压差/流量边界、可持续时间、允许误差、油温与环境、正反转和负载台能力。','预计输出功率=7000×20÷9550≈14.66 kW，可用于筛查台架功率与吸收能力。','若输入源达不到所需功率，先调整方案；时间与允许偏差不能凭本例随意定成产品标准。'],
['DVP 中必须在试验前明确什么？',['只写设备颜色','工况、测量方法、合格与停止判据','先跑完再决定合格线'],1,'事先定义才能避免试验结果不可比较或事后迁就。']);
lesson('T49',['吸空','气蚀','泄漏','润滑'],'bubbles',
'泵尖叫与油箱气泡常见，但“气蚀”和“空气混入”不是完全同一机制。气蚀是局部绝对压力低使油液形成蒸汽空穴；吸油侧漏气是外部空气进入油中。两者都可能造成噪声、性能下降和损伤。',
[['先分现象和原因','记录油位、油温、转速、负载、泡沫持续性与发生时机，确认油液型号和泵启动/排气要求。'],['检查入口供油条件','油位低、吸油滤芯阻塞、油太冷黏度高、管太细太长、转速高都可能造成入口压力过低。'],['检查漏气和回油布置','吸油侧可能吸进空气而不明显往外漏油；接头密封、软管、回油冲击和油箱隔板影响空气混入。'],['依据泵规格验证','入口允许绝对压力、黏度范围和启动程序依厂商要求。异常严重时先按限制停机，避免持续运行造成损坏。']],
['例：理解表压和绝对压力','假设当地大气压约 0.10 MPa，入口表压为 −0.06 MPa。','入口绝对压力≈0.10−0.06=0.04 MPa。','这说明入口压力明显低于大气，但是否满足该泵要求还需查具体允许值与油温。','不能用“负表压”单独证明已气蚀，也不能只靠油箱有泡判断唯一原因。'],
['吸油侧没有向外滴油，就能排除吸气吗？',['能','不能，负压下可能向内吸气','只有油温高才会吸气'],1,'吸油侧压力低，密封不良可能只表现为向内吸气。']);
lesson('T50',['容积效率','测量误差','流量','转速'],'diagnosis',
'理论值与实测差 16.5%，第一步是确认“以谁为分母”。以理论值为基准，偏差=(理论−实测)/理论。这个比例可能同时包含泵实际流量、马达泄漏、速度测量与参数错误，不能全部归成一个容积效率。',
[['定义同一个工况','理论与实测应匹配压力、温度、负载、泵排量、转速和回路模式。参数来自铭牌还是实测要分清。'],['先核查输入流量','变量泵不一定全排量，溢流和分流可能使马达拿不到理论流量；优先测马达实际入口流量。'],['再核查传动与泄漏','齿数、流量分配、马达排量单位和转速传感器倍率都要检查；以同工况泄漏和效率证据解释剩余差异。'],['分析测量不确定度','低速采样时长、脉冲分辨率、仪表校准与读数稳定性可能影响结果。保持工况做重复测量。']],
['例：100 rpm 与 83.5 rpm','以理论为基准：偏差=(100−83.5)/100=16.5%。','若原模型假设流量 60 L/min，但实际只有 55 L/min，单是流量就使比例变成 55/60≈0.9167。','若其余差别仅暂归入有效转速系数，它约为 0.835/0.9167≈0.911。','只有在排除其他差异且测点正确时，才能进一步把该系数解释为相应容积效率。'],
['偏差 16.5% 能直接等于马达泄漏率 16.5% 吗？',['能','不能，还要排除实际流量和测量等因素','所有工况都一样'],1,'同一个结果比例可能包含多个因素，需分层测量和隔离。']);
lesson('T51',['关键路径','MVP','接口','验证'],'timeline',
'项目只有 8 周，但核心减速器需 12 周，按原采购路线就无法在 8 周得到正式件。管理不是把 12 周写成 8 周，而是区分“验证什么”和“最终量产什么”，重新选择有证据的交付方案。',
[['先把冲突显性化','正式件最早第 12 周到，而样机第 8 周要交，至少缺 4 周，还未含运输、集成和验证。让决策者知道真实边界。'],['按验证目标拆样机','第一版要验证结构、控制、负载还是寿命？台架替代件可支持部分验证，却未必能代表最终精度和热性能。'],['比较替代方案','现货替代、借样、供应商试制、分阶段交付或调整里程碑；列每种方案的成本、接口改动与可验证范围。'],['接口先冻结并保留复测','用转接板、模块化安装和明确电气/控制接口降低返工；正式件到货后重做受其影响的精度、热和耐久验证。']],
['例：用里程碑而非口头承诺','第 1 周冻结接口与替代方案；第 2～4 周并行加工结构、做单关节台架。','第 5～6 周使用已确认替代件集成，第 7～8 周验证明确的样机功能。','第 12 周正式减速器到货后，安排替换与受影响项目复测。','这是教学计划，不代表任意项目都能照搬；需有供应商确认、资源和试验时间证据。'],
['用替代减速器完成动作展示，可以声称正式配置的寿命已经通过吗？',['可以','不可以，验证结论仅覆盖实际配置与工况','只要外径一样就可以'],1,'配置改变会影响精度、负载、温升和耐久，必须界定验证范围。']);
lesson('T52',['风险评审','验证','追溯','接口'],'decision',
'技术分歧要从“我觉得不行”变成可评审的问题：哪个工况、哪种失效、什么后果、有什么证据、怎样验证。涉及安全时，要按项目既定的风险处理与评审流程推进，不能靠职位或争论代替证据。',
[['把担忧写成具体风险','例如“断电后负载可能下落，现制动与驱动共用单一供电，无法覆盖此失效”，而不是笼统说方案不靠谱。'],['准备可比较的方案','列原方案、替代方案与补充验证，比较功能、安全、成本、周期与未解决问题。明确哪些数据是已测、计算或待确认。'],['让评审产生可执行结论','记录决策人、责任人、整改内容、期限、试验判据与风险接受依据；有必要时按组织规则升级处理。'],['验证与版本闭环','按约定条件试验，结果不满足就继续整改；更新设计文件与验证记录。开过会不等于风险已关闭。']],
['例：把担忧改成验证条目','原话：“这个支架太薄，我不同意。”','可评审表述：“在最不利姿态和规定载荷下，接口相对位移初算 0.8 mm，超过当前精度预算 0.3 mm。”','提出加筋、调整支点或修改结构的候选，并约定相同工况刚度试验。','若 0.8 与 0.3 只是示例或暂估，必须注明并补证据；不能伪装成项目实测。'],
['一次设计评审后，风险什么时候可以关闭？',['会议结束即可','完成约定整改并有验证证据后','负责人说没问题即可'],1,'风险闭环依赖落实与证据，而非开会这一动作本身。']);


const TERMS={
'电机':['把电能转换成机械运动的装置。这里主要讨论旋转电机。','例如电机先带动泵，再由油液驱动马达。'],
'液压泵':['把机械输入转换为油液的压力和流量输出。实际压力由负载、回路和控制共同决定。','28 mL/r 泵每转理论排出约 28 mL 油；变量泵当前排量可以调整。'],
'液压马达':['接收有压油液，输出旋转运动与扭矩的装置。','马达的两口压差影响扭矩，通过流量与排量影响转速。'],
'减速器':['用齿轮等传动机构降低转速，并在功率约束下提高输出扭矩。','减速比 4、输入 100 rpm 时，输出约 25 rpm。'],
'主轴':['设备中向工作部件传递运动或扭矩的主要轴。结构角色需看具体机器。','钻机动力头主轴把扭矩传给钻具。'],
'轴承':['支承轴或其他运动件，并允许设计所需的相对运动、传递支承载荷。','内圈常配轴，外圈常配壳体；具体也可能反过来。'],
'力':['使物体运动状态或形状改变的作用，常用单位 N。','1 kg 质量在地面附近的重力约 9.81 N。'],
'扭矩':['使物体绕指定轴转动的作用，常用单位 N·m。','50 N 的垂直力作用在 0.2 m 力臂上，扭矩为 10 N·m。'],
'力臂':['指定转轴到力的作用线的垂直距离。','并不是任何情况下都等于扳手或机械臂的总长度。'],
'质量':['物体的一项惯性属性，常用单位 kg。质量与重力不是同一个量。','10 kg 的物体静重约 98.1 N；加速或冲击时支承力可能不同。'],
'转速':['单位时间旋转多少圈；rpm 表示每分钟圈数。','60 rpm=每秒 1 圈=2π rad/s。'],
'弧度':['角度的一种单位，弧长除以圆半径；一整圈为 2π rad。','0.1°×π/180≈0.001745 rad。'],
'功率':['每单位时间传递或转换的能量，常用 W 或 kW。','旋转轴 P(kW)=T(N·m)×n(rpm)/9550。'],
'效率':['有效输出与相应输入的比值，无单位。边界应一致。','输入 10 kW、输出 8 kW 时，效率为 0.8。'],
'压力':['单位面积上的法向作用，Pa=N/m²；1 MPa=1 N/mm²。','液压中的额定压力不是实际每个时刻的工作压力。'],
'压差':['同一元件或回路段两端的压力之差。','入口 20 MPa、出口 2 MPa，压差为 18 MPa。'],
'背压':['相对于参考压力，元件出口或回油侧存在的压力。','马达回油不为零压时，必须从入口压力中扣除它来算有效压差。'],
'流量':['单位时间通过的流体体积，液压常用 L/min。','两支路并联时，总流量等于各支路流量之和。'],
'排量':['液压元件每转理论排出或需要的流体体积，常用 mL/r。','300 mL/r=0.3 L/r；理想 30 L/min 可使马达转 100 rpm。'],
'单位换算':['将同一物理量用不同单位表达，数值改变但实际量不变。','1 mm=1000 μm；1 mL=10⁻⁶ m³。'],
'容积效率':['与泄漏等体积损失有关的效率。泵实际输出流量和马达实际转速分别受其影响。','简化马达转速 n=1000Qηv/V；泵流量 Q=Vpnηv/1000。'],
'机械效率':['与摩擦等机械损失有关的效率，泵与马达的能量流向不同。','马达输出扭矩乘 ηm；泵所需输入扭矩除以 ηm。'],
'减速比':['本课定义为输入转速除以输出转速。','外啮合固定轴齿轮对 i=z从动/z主动；行星机构需按拓扑计算。'],
'并联':['本课液压语境中，两台元件接在不同支路；总流量分配给支路。','理想相同均载马达可近似均分流量，但真实分配还受阻力与泄漏影响。'],
'串联':['本课液压语境中，油液依次经过多个元件；总可用压差在元件之间分配。','简化相同均载双马达，每台流量近似总流量，压差约各一半。'],
'工况':['机器运行的具体条件组合。','扭矩、转速、温度、负载方向、持续时间与启停频次共同构成工况。'],
'额定值':['厂商在规定条件下声明的允许性能或能力；需同时阅读条件。','连续扭矩和短时峰值扭矩不能不加条件互换。'],
'峰值':['一个过程中的最大值，能维持多久与重复频率很重要。','电机可短时达到的扭矩，不代表可以长期保持。'],
'均载':['多个承载支路按设计分担载荷的状态。','双小齿轮共同驱动时，机械同速也不自动保证扭矩各半。'],
'刚度':['对受力变形的抵抗能力。不同结构可用不同刚度定义。','轴向增量刚度 k=ΔF/Δx；扭转刚度 kθ=ΔT/Δθ。'],
'强度':['材料或结构承受载荷而不发生某种破坏的能力。','静屈服、断裂、疲劳各有对应评价方法，不能只用一个数覆盖。'],
'疲劳':['反复载荷导致损伤积累、裂纹和失效的过程。','峰值未达到屈服强度的反复载荷，也可能造成疲劳断裂。'],
'应力':['结构内部单位面积上的内力分布，常用 MPa。','简单均匀拉杆 σ=F/A；孔边与圆角附近可能有应力集中。'],
'游隙':['轴承内部允许的相对移动量；区分径向/轴向及原始/安装/工作状态。','外圈与壳体之间的装配间隙，不等同于轴承内部游隙。'],
'预紧':['装配时有目的建立的内部载荷，常用于改善刚度和定位。','成对角接触轴承的预紧取决于端面尺寸、安装链和弹性关系。'],
'过盈配合':['配合的外尺寸比对应孔尺寸大，装配后靠接触变形产生压力。','50.020 mm 的轴装入 50.000 mm 的孔，几何过盈为 20 μm。'],
'C3游隙':['比普通 CN 组通常更大的径向内部游隙分组，具体范围要查型号目录。','C3 不是固定微米值，也不是精度等级 P5/P4。'],
'温差':['两个位置或状态的温度差。温差用 °C 或 K 表示时数值相同。','内圈 60°C、外圈 50°C，温差为 10°C。'],
'温升':['部件温度相对于参考环境或起始温度的升高，应注明参考。','测点 60°C、环境 25°C，相对环境温升为 35°C。'],
'隔套':['放在配合零件之间用于控制轴向距离、定位或装配关系的套筒。','内外圈隔套长度差可能影响成对轴承的预紧。'],
'轴向力':['沿轴线方向的力。','斜齿啮合产生的轴向分力需要合适的轴承与定位承受。'],
'径向力':['垂直于轴线方向的力。','齿轮把两轴推开的分力及某些外部侧向力会形成径向载荷。'],
'倾覆力矩':['使被支承部件发生倾斜、翻转趋势的力矩。','偏离支承面的负载会产生倾覆作用，支承跨度影响反力。'],
'启动力矩':['开始运动时为克服阻力所需的扭矩；包含轴承、密封等贡献。','测得较大启动力矩并不能单独证明轴承预紧过大。'],
'DB与DF':['成对角接触等轴承的背对背 DB（O形）与面对面 DF（X形）布置。','同等条件下 DB 通常有效支点跨度较大，具体热态性能还看安装结构。'],
'支点跨距':['两个支承作用点之间的距离，须区分几何中心距和有效支点跨度。','力偶简化中，相同力矩所需支反力与跨度成反比。'],
'支反力':['支承对被支承物体施加的力，来自整体受力平衡。','简支梁跨中集中载荷，在理想对称情况下两支点各承担一半。'],
'润滑':['利用润滑剂降低接触摩擦与磨损，并可能参与冷却和防腐。','润滑脂并非越多越好，填量和补脂按工况与厂商要求。'],
'对中':['使轴线、支承或传动件达到设计所要求的相对位置与方向。','不对中会改变载荷分布，引起偏载、发热或振动。'],
'齿轮':['利用齿的啮合传递运动和载荷的零件。','直齿、斜齿、内齿等的几何和力分解条件不同。'],
'模数':['描述齿大小的一项几何参数，标准直齿 d=mz。','模数 5 mm、14 齿的参考分度圆直径为 70 mm。'],
'分度圆':['用于定义齿轮参考几何的圆，不是齿顶外圆。','计算 Ft=2T/d 时常用相应分度圆/工作节圆条件下的直径。'],
'切向力':['沿参考圆切线方向传递扭矩的力分量。','一致单位下 Ft=2T/d；T 与 d 需来自同一只齿轮。'],
'压力角':['齿面接触作用方向与相应切线之间的角度参数，分参考与工作等定义。','标准直齿简化中 Fr=Ft tanα。'],
'螺旋角':['斜齿齿线相对轴线的倾斜角度参数。','简化力分解 Fa=Ft tanβ；具体正负方向由旋向和转向决定。'],

function calculatorFor(t){if(['B02'].includes(t.id))return 'lever';if(['B04','T05'].includes(t.id))return 'speed';if(['T02','T09'].includes(t.id))return 'torque';if(t.id==='T03')return 'gear';if(['B06','T14'].includes(t.id))return 'clearance';if(['B05','T36'].includes(t.id))return 'angle';return null;}
const CALCS={
lever:['自己试：扳手力矩',[['force','垂直力 F（N）',50],['arm','垂直力臂 r（m）',0.2]],'力与手柄垂直；不包含冲击或复杂分布载荷。'],
torque:['自己试：算马达扭矩',[['pressure','有效压差 Δp（MPa）',20],['displacement','马达排量 V（mL/r）',321.5],['efficiency','机械效率 ηm（%）',85]],'稳态简化估算；使用马达两口压差，产品额定与启动性能另查。'],
speed:['自己试：从流量算转速',[['flow','流经单台马达的流量 Q（L/min）',30],['displacement','马达排量 V（mL/r）',321.5],['efficiency','容积效率 ηv（%）',90],['ratio','减速比 i（输入/输出）',55/14]],'Q 是这台马达拿到的流量，不是自动等于泵总流量。'],
gear:['自己试：齿轮减速',[['z1','主动轮齿数 z₁',14],['z2','从动轮齿数 z₂',55],['speed','输入转速（rpm）',100],['torque','输入扭矩（N·m）',870],['efficiency','齿轮效率（%）',97]],'适用于此处的定轴外啮合齿轮对；仅算速度与扭矩，不做强度校核。'],
clearance:['自己试：工作游隙预算',[['initial','原始游隙 G₀（μm）',35],['fitloss','配合造成的内部游隙损失（μm）',14],['heatloss','温差造成的内部游隙损失（μm）',12]],'输入的是内部游隙变化，不是直接输入轴孔过盈量。仅作简化预算。'],
angle:['自己试：角误差与末端位移',[['angle','小角误差（°）',0.1],['length','到转轴的有效距离 L（m）',0.5]],'单关节、小角度、一平面近似；多关节整机误差需另外建模。']
};
function calculator(kind){const c=CALCS[kind];return `<section class="calculator"><h3>${c[0]}</h3><p class="small muted">${c[2]}</p><form data-calc="${kind}"><div class="calcfields">${c[1].map(([name,label,val])=>`<label>${esc(label)}<input type="number" name="${name}" value="${Number(val.toFixed(6))}" step="any" required></label>`).join('')}</div><button class="btn" style="margin-top:16px" type="submit">计算并展开步骤</button><div class="calcresult" role="status" aria-live="polite"></div></form></section>`;}
function calcSubmit(form){const kind=form.dataset.calc,out=form.querySelector('.calcresult'),v={};for(const [name] of CALCS[kind][1]){const input=form.elements.namedItem(name);v[name]=Number(input.value);if(input.value.trim()===''||!Number.isFinite(v[name])||v[name]<0){out.innerHTML='<p>请填写有限的非负数，并核对每项单位。</p>';return;}}
 const f=n=>Number.isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:4}):'数值超出范围';let lines=[];
 if('efficiency'in v&&(v.efficiency<=0||v.efficiency>100)){out.textContent='效率请输入大于0、且不超过100的百分数，例如85。';return;}
 if('displacement'in v&&v.displacement<=0||'ratio'in v&&v.ratio<=0){out.textContent='排量和减速比必须大于0。';return;}
 if(kind==='lever'){const value=v.force*v.arm;lines=[`T=F×r=${f(v.force)}×${f(v.arm)}`,`<strong>扭矩≈${f(value)} N·m</strong>`];}
 if(kind==='torque'){const p=v.pressure*1e6,d=v.displacement*1e-6,e=v.efficiency/100;lines=[`${f(v.pressure)} MPa=${f(p)} Pa；${f(v.displacement)} mL/r=${v.displacement}×10⁻⁶ m³/r`,`ηm=${f(e)}；T=ΔpVηm/(2π)`,`T=(${f(v.pressure)}×10⁶)×(${f(v.displacement)}×10⁻⁶)×${f(e)}÷(2π)`,`<strong>轴端输出扭矩≈${f(p*d*e/(2*Math.PI))} N·m</strong>`,`该结果不代表具体型号连续额定能力。`];}
 if(kind==='speed'){const n=1000*v.flow*(v.efficiency/100)/v.displacement;lines=[`n马达=1000×${f(v.flow)}×${f(v.efficiency/100)}÷${f(v.displacement)}≈${f(n)} rpm`,`n输出=n马达÷i=${f(n)}÷${f(v.ratio)}`,`<strong>输出转速≈${f(n/v.ratio)} rpm</strong>`];}
 if(kind==='gear'){if(v.z1<=0||v.z2<=0||!Number.isInteger(v.z1)||!Number.isInteger(v.z2)){out.textContent='齿数必须是正整数。';return;}const i=v.z2/v.z1;lines=[`i=z₂/z₁=${f(v.z2)}÷${f(v.z1)}=${f(i)}`,`n输出=${f(v.speed)}÷${f(i)}=<strong>${f(v.speed/i)} rpm</strong>`,`T输出=${f(v.torque)}×${f(i)}×${f(v.efficiency/100)}=<strong>${f(v.torque*i*v.efficiency/100)} N·m</strong>`,`外啮合两轮旋转方向相反；这是传动估算，未校核根切、强度与额定能力。`];}
 if(kind==='clearance'){const g=v.initial-v.fitloss-v.heatloss;lines=[`安装游隙=${f(v.initial)}−${f(v.fitloss)}=${f(v.initial-v.fitloss)} μm`,`工作游隙≈${f(v.initial)}−${f(v.fitloss)}−${f(v.heatloss)}`,`<strong>工作游隙≈${f(g)} μm（${f(g/1000)} mm）</strong>`,g<0?'结果为负：提示可能出现不希望的内部预载；不能把它直接转换成已知预紧力。':'正值并不自动合格，需比较该型号和工况所需范围。'];}
 if(kind==='angle'){if(v.angle>5){out.textContent='本计算器用于小角度近似，请输入0～5°；更大角度需用实际几何模型。';return;}const theta=v.angle*Math.PI/180;lines=[`θ=${f(v.angle)}×π/180≈${f(theta)} rad`,`Δs≈Lθ=${f(v.length)}×(${f(v.angle)}×π/180)`,`<strong>位移≈${f(v.length*theta*1000)} mm</strong>`,`计算时使用未四舍五入的中间值。`];}
 out.innerHTML=lines.map(s=>`<p>${s}</p>`).join('');}
function lessonPage(t){saved.last=t.id;persist();const family=t.id[0]==='B'?INTRO:ALL.filter(x=>x.module===t.module);const list=family.map(x=>`<button class="lessonlink ${x.id===t.id?'active':''}" ${x.id===t.id?'aria-current="page"':''} data-lesson="${x.id}">${saved.done.includes(x.id)?'✓ ':''}${x.id} · ${esc(x.title)}</button>`).join('');const index=ALL.findIndex(x=>x.id===t.id),prev=ALL[index-1],next=ALL[index+1];const calc=calculatorFor(t);const answer=saved.answers[t.id];const checked=Number.isInteger(answer?.choice)?answer.choice:-1;return `<div class="lessonlayout"><aside class="lessonaside" aria-label="本模块课程目录"><h3>${esc(t.module)}</h3>${list}</aside><article class="lesson"><div class="crumb">${t.id} / ${esc(t.module)} / ${saved.done.includes(t.id)?'✓ 已完成':'可反复学习'}</div><h1>${esc(t.title)}</h1><p class="lead">${esc(t.summary)}</p><div class="learningpath"><a href="#section-terms" data-scroll="section-terms">① 术语</a><a href="#section-understand" data-scroll="section-understand">② 原理与图解</a><a href="#section-steps" data-scroll="section-steps">③ 逐步理解</a><a href="#section-example" data-scroll="section-example">④ 例题</a><a href="#section-quiz" data-scroll="section-quiz">⑤ 自测</a></div>${prerequisites(t).length?`<p class="asidehint">觉得吃力？先补：${prerequisites(t).map(([id,title])=>`<button class="textbtn" data-lesson="${id}">${esc(title)}</button>`).join(' · ')}</p>`:''}<section class="lessonsection" id="section-terms"><h2><span class="numbox">1</span>先认识这些词</h2><p class="muted small">点任意词语，查看白话解释和小例子。</p><div class="termrow">${t.terms.map(s=>`<button class="term" data-term="${esc(s)}">${esc(s)} ↗</button>`).join('')}</div></section><section class="lessonsection" id="section-understand"><h2><span class="numbox">2</span>先用白话讲明白</h2><div class="story">${esc(t.story)}</div>${diagram(t.diagram)}</section><section class="lessonsection" id="section-steps"><h2><span class="numbox">3</span>一步一步，为什么这样做</h2>${t.steps.map(([title,text],i)=>`<div class="stepdetail"><span class="stepno">${i+1}</span><div><h3>${esc(title)}</h3><p>${esc(text)}</p></div></div>`).join('')}</section><section class="lessonsection" id="section-example"><h2><span class="numbox">4</span>跟着完整做一遍</h2><div class="worked"><h3>${esc(t.example[0])}</h3><p class="assumption">以下为教学例题；数值、简化条件与结论仅适用于题内假设。</p><ol>${t.example.slice(1).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>${calc?calculator(calc):''}</section>${t.pitfalls?.length?`<section class="lessonsection"><h2>这些地方最容易误解</h2><div class="limitsbox"><ul>${t.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></section>`:''}<section class="lessonsection" id="section-quiz"><h2><span class="numbox">5</span>自己试着回答</h2><form data-quiz="${t.id}"><fieldset class="quiz"><legend>${esc(t.quiz[0])}</legend>${t.quiz[1].map((option,i)=>`<label><input type="radio" name="choice" value="${i}" ${checked===i?'checked':''}><span>${String.fromCharCode(65+i)}. ${esc(option)}</span></label>`).join('')}<button class="btn" type="submit">检查答案，看看为什么</button><div class="feedback ${answer?.correct?'good':answer?'warn':''}" role="status" aria-live="polite">${answer?quizFeedback(t,!!answer.correct):''}</div></fieldset></form></section><div class="lessonfooter"><div class="actions">${prev?`<button class="ghost" data-lesson="${prev.id}">← 上一课</button>`:''}<button class="ghost" data-complete="${t.id}">${saved.done.includes(t.id)?'✓ 已标记学懂':'我已经学懂这课了'}</button></div>${next?`<button class="btn" data-lesson="${next.id}">下一课 ${next.id} →</button>`:'<button class="btn" data-nav="progress">看看学习进度 →</button>'}</div><p class="statusnote">自测答对会自动记录本课完成；也可手动标记。进度仅保存在当前浏览器，清理浏览器数据或更换设备不会自动同步。</p></article></div>`;}
function quizFeedback(t,correct){return `<strong>${correct?'✓ 答对了，这一课已记为完成。':'再想一想。正确选项是 '+String.fromCharCode(65+t.quiz[2])+'。'}</strong><br>${esc(t.quiz[3])}`;}
function quizSubmit(form){const t=BYID[form.dataset.quiz],choice=form.querySelector('input[name="choice"]:checked'),out=form.querySelector('.feedback');if(!choice){out.className='feedback warn';out.textContent='先选择一个答案，再看解释；选错也没关系。';return;}const n=Number(choice.value),correct=n===t.quiz[2];saved.answers[t.id]={choice:n,correct};if(correct&&!saved.done.includes(t.id))saved.done.push(t.id);persist();out.className='feedback '+(correct?'good':'warn');out.innerHTML=quizFeedback(t,correct);}
const CATEGORY_LESSONS={'齿轮与减速器':['T03','T24','T25','T30','T31'],'轴承与轴系':['B06','T14','T19','T20','T21'],'机器人本体与关节':['B07','T33','T34','T36','T39'],'液压与重载装备':['B04','T02','T04','T09','T49'],'材料与热处理':['B07','T40','T41','T42'],'公差装配与机械基础':['B05','T17','T22','T43','T44'],'仿真强度与可靠性':['B07','T32','T47','T48'],'量产质量与失效分析':['B08','T23','T46','T48'],'技术面试与研发管理':['B08','T51','T52'],'同步带与动力传动':['B02','B03','T03']};
function recommended(q){const text=q.q;let ids=/温升|发热/.test(text)?['B06','T23']:/游隙/.test(text)?['B06','T14','T15']:/预紧/.test(text)?['B06','T17','T18']:/7000|扭矩/.test(text)?['B02','B03','T02','T20']:/RMS/.test(text)?['T34']:/根切/.test(text)?['T24']:/零位|编码器/.test(text)?['T37']:CATEGORY_LESSONS[q.category]||['B08'];return ids.filter(id=>BYID[id]).slice(0,4);}
function bank(){return `<p class="eyebrow">PRACTISE AFTER UNDERSTANDING</p><h1>懂了原理，再来复习题。</h1><p class="muted">234道原题保留为进阶笔记。点击题目展开；遇到不会的内容，先跳到推荐课程补基础。</p><div class="notice">原题中的历史数值与回答框架保留供复盘，未逐题改造成基础讲义。学习原理与详细计算，请以关联的先修课和专题详解为主。</div><div class="searchbar"><input id="bank-search" aria-label="搜索题库" placeholder="输入问题、Q编号或关键词" value="${esc(ui.q)}"></div><div class="filterrow">${['全部',...new Set(QUESTIONS.map(q=>q.category))].map(c=>`<button class="filter ${ui.category===c?'active':''}" data-filter-category="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="bank-results">${bankResults()}</div>`;}
function bankResults(){const s=ui.q.trim().toLowerCase();const arr=QUESTIONS.filter(q=>(ui.category==='全部'||q.category===ui.category)&&(!s||JSON.stringify(q).toLowerCase().includes(s)));return `<p class="resultcount">显示 ${arr.length} / ${QUESTIONS.length} 道题 · 点击题名展开</p>${arr.map(q=>`<details class="question" id="question-${esc(q.id)}"><summary><span class="qmeta">${esc(q.id)} · ${esc(q.category)}</span>${esc(q.q)}</summary><div class="answer"><p class="small muted">先补这些课：</p><div class="actions">${recommended(q).map(id=>`<button class="ghost" data-lesson="${id}">${id} · ${esc(BYID[id].title.slice(0,16))} →</button>`).join('')}</div><h3>原题复习要点</h3><p>${esc(q.short||'原题没有简答，建议先学习上方关联课程。')}</p>${q.deep?`<h3>原有深度解析</h3><p>${esc(q.deep)}</p>`:''}${q.formula?`<h3>原题公式</h3><p>${esc(q.formula)}</p>`:''}${Array.isArray(q.steps)&&q.steps.length?`<h3>原题步骤</h3><ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}${q.pitfalls?`<div class="notice">${esc(Array.isArray(q.pitfalls)?q.pitfalls.join('；'):q.pitfalls)}</div>`:''}</div></details>`).join('')}${arr.length?'':'<div class="empty">没有匹配题目。试试缩短关键词或选择全部分类。</div>'}`;}
function glossary(){return `<p class="eyebrow">WORDS IN PLAIN LANGUAGE</p><h1>不认识的词，在这里慢慢看。</h1><p class="muted">${Object.keys(TERMS).length}个词语都有白话解释与例子。课程里的词语也可直接点开。</p><div class="searchbar"><input id="terms-search" aria-label="搜索术语" placeholder="例如：压力、游隙、预紧、刚度" value="${esc(ui.q)}"></div><div id="terms-results">${termResults()}</div>`;}
function termResults(){const q=ui.q.trim().toLowerCase();const entries=Object.entries(TERMS).filter(([k,v])=>!q||(k+v.join(' ')).toLowerCase().includes(q));return `<p class="resultcount">${entries.length}个术语</p><div class="grid glossarycards">${entries.map(([key,v])=>`<article class="coursecard"><h3>${esc(key)}</h3><div class="body"><p>${esc(v[0])}</p></div><button class="term" data-term="${esc(key)}">看例子 ↗</button></article>`).join('')}</div>${entries.length?'':'<div class="empty">没有匹配词语。换一个更短的词试试。</div>'}`;}
function progress(){const introDone=saved.done.filter(id=>id.startsWith('B')).length;const last=BYID[saved.last];return `<p class="eyebrow">YOUR LEARNING JOURNEY</p><h1>理解一点，就前进一点。</h1><section class="hero"><div><h2>已完成 ${saved.done.length} / ${ALL.length} 课</h2><p class="muted">先修课 ${introDone}/8 · 专题 ${saved.done.length-introDone}/52</p><div class="actions"><button class="btn" data-lesson="${last.id}">继续 ${last.id} →</button><button class="ghost" data-nav="intro">回到先修课</button></div><p class="asidehint">记录保存在当前浏览器；换设备、无痕模式或清理数据不会自动同步。</p></div><div class="hero-visual"><h3>上次学到</h3><p>${esc(last.title)}</p><p class="small muted">自测答对或手动标记学懂会计入完成。</p></div></section><div class="tablewrap"><table><thead><tr><th>课程</th><th>名称</th><th>学习记录</th><th>自测</th><th>继续</th></tr></thead><tbody>${ALL.map(t=>`<tr><td>${t.id}</td><td>${esc(t.title)}</td><td>${saved.done.includes(t.id)?'✓ 已完成':'待学习'}</td><td>${saved.answers[t.id]?(saved.answers[t.id].correct?'答对':'需复习'):'未作答'}</td><td><button class="textbtn" data-lesson="${t.id}">打开</button></td></tr>`).join('')}</tbody></table></div>`;}
function openTerm(term){const t=TERMS[term];if(!t)return;const d=document.getElementById('detail-dialog');d.classList.remove('zoomed');document.getElementById('dialog-content').innerHTML=`<div class="dialoghead"><div><p class="eyebrow">术语解释</p><h2>${esc(term)}</h2></div><button class="close" data-action="close-dialog" aria-label="关闭帮助">×</button></div><p>${esc(t[0])}</p><div class="example"><b>举个例子</b><p>${esc(t[1])}</p></div>`;d.showModal();}
function render(){const route=location.hash.slice(1)||'home';const match=/^lesson-(B0[1-8]|T\d{2})$/.exec(route);let active=route;let html;if(match&&BYID[match[1]]){const t=BYID[match[1]];active=t.id[0]==='B'?'intro':'topics';html=lessonPage(t);document.title=`${t.id} ${t.title} | 从零学机械研发`;}else{document.title='机械研发 · 从零开始 | 哆啦A胡的学习室';if(route==='intro')html=listing(true);else if(route==='topics')html=listing(false);else if(route==='bank')html=bank();else if(route==='terms')html=glossary();else if(route==='progress')html=progress();else{active='home';html=home();}}
 document.getElementById('content').innerHTML=html;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.nav===active);if(b.dataset.nav===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});updateProgress();}
document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;const d=target.dataset;if(d.nav){ui.q='';go(d.nav);}else if(d.lesson){if(BYID[d.lesson])go('lesson-'+d.lesson);}else if(d.openModule){ui.module=d.openModule;ui.q='';go('topics');}else if(d.filterModule){ui.module=d.filterModule;render();}else if(d.filterCategory){ui.category=d.filterCategory;render();}else if(d.term){openTerm(d.term);}else if(d.scroll){event.preventDefault();document.getElementById(d.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}else if(d.complete){if(!saved.done.includes(d.complete))saved.done.push(d.complete);persist();target.textContent='✓ 已标记学懂';toast('本课进度已保存，可以继续下一课。');}else if(d.action==='zoom'){const dialog=document.getElementById('detail-dialog');dialog.classList.add('zoomed');document.getElementById('dialog-content').innerHTML=`<div class="dialoghead"><h2>放大图解</h2><button class="close" data-action="close-dialog" aria-label="关闭图解">×</button></div>${diagram(d.kind)}`;document.querySelector('#dialog-content .textbtn')?.remove();dialog.showModal();}else if(d.action==='close-dialog')document.getElementById('detail-dialog').close();});
document.addEventListener('input',event=>{const el=event.target;if(!['list-search','bank-search','terms-search'].includes(el.id))return;ui.q=el.value;if(el.id==='list-search')document.getElementById('list-results').innerHTML=listingResults(location.hash==='#intro');if(el.id==='bank-search')document.getElementById('bank-results').innerHTML=bankResults();if(el.id==='terms-search')document.getElementById('terms-results').innerHTML=termResults();});
document.addEventListener('submit',event=>{if(event.target.dataset.quiz){event.preventDefault();quizSubmit(event.target);}if(event.target.dataset.calc){event.preventDefault();calcSubmit(event.target);}});
window.addEventListener('hashchange',()=>{document.getElementById('detail-dialog').close();render();window.scrollTo(0,0);});
render();

</script></body></html>
