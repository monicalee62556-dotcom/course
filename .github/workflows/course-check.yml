name: Course build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build static course
        run: python build.py
      - name: Check JavaScript syntax
        run: node --check compiled.js
      - name: Verify course content
        run: |
          grep -q 'A16' advanced-16/advanced-lessons.js
          grep -q 'ADVANCED_DIAGRAMS' advanced-16/advanced-diagrams.js
          grep -q '76节课程' index.html
